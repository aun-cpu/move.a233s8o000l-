<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Simultaneous Multi-touch</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        /* 視点操作（カメラ制御）専用の右側タッチエリア */
        #camera-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%; /* 画面右側60%をカメラ操作エリアに設定 */
            height: 100%;
            z-index: 10;
            touch-action: none;
        }

        /* 左下固定のジョイスティックUI */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            user-select: none;
            z-index: 20; /* カメラエリアより前面に配置 */
            display: block; 
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- カメラ操作用の領域を独立させる -->
    <div id="camera-touch-zone"></div>

    <!-- ジョイスティック -->
    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 【改善の重要ポイント】
        // OrbitControls に Canvas全体ではなく「右側の透明DIV(#camera-touch-zone)」をバインドする
        const touchZone = document.getElementById('camera-touch-zone');
        const controls = new THREE.OrbitControls(camera, touchZone);
        controls.enableDamping = true;
        controls.enableZoom = false; // ズーム禁止

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const targetHeightOffset = 1.5;
        const cameraOffset = new THREE.Vector3(0, 0.4, -1.6); 

        let targetModel = null;
        let bgModel = null;
        let mixer = null;
        let actions = [];
        let currentAction = null;
        const clock = new THREE.Clock();

        const moveSpeed = 4.0;
        const rotationSpeed = 10.0;

        const loader = new THREE.GLTFLoader();

        // 1. 背景モデル (bg.glb)
        loader.load(
            './bg.glb',
            function (gltf) {
                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);
                bgModel.traverse((child) => {
                    if (child.isMesh) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach((mat) => { mat.wireframe = true; });
                        } else if (child.material) {
                            child.material.wireframe = true;
                        }
                    }
                });
                scene.add(bgModel);
            },
            undefined,
            function (error) { console.error('bg.glb の読み込みエラー:', error); }
        );

        // 2. ターゲットモデル (ct1.glb)
        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;
                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    gltf.animations.forEach((clip) => {
                        actions.push(mixer.clipAction(clip));
                    });
                    setAction(0);
                }

                initCameraPosition();
            },
            undefined,
            function (error) { console.error('ct1.glb の読み込みエラー:', error); }
        );

        function setAction(index) {
            if (!mixer || !actions[index]) return;
            const nextAction = actions[index];
            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().fadeIn(0.2).play();
                currentAction = nextAction;
            }
        }

        function initCameraPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const offset = cameraOffset.clone().applyQuaternion(targetModel.quaternion);
            
            camera.position.copy(targetPosition).add(offset);
            controls.target.copy(targetPosition);
            controls.update();
        }

        function followModelPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const deltaPosition = targetPosition.clone().sub(controls.target);

            controls.target.add(deltaPosition);
            camera.position.add(deltaPosition);
        }

        // ============================================================
        // ジョイスティック処理（独立要素としてイベント制御）
        // ============================================================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickStick = document.getElementById('joystick-stick');
        
        let joystickInput = { x: 0, y: 0 };
        let activePointerId = null;
        const maxRadius = 40;

        function getJoystickCenter() {
            const rect = joystickContainer.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        joystickContainer.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); // カメラ操作側へイベントを行かせない
            activePointerId = e.pointerId;
            joystickContainer.setPointerCapture(e.pointerId); // 指が枠外に出ても追尾
            updateJoystick(e.clientX, e.clientY);
        });

        joystickContainer.addEventListener('pointermove', (e) => {
            if (e.pointerId === activePointerId) {
                updateJoystick(e.clientX, e.clientY);
            }
        });

        const handlePointerEnd = (e) => {
            if (e.pointerId === activePointerId) {
                resetJoystick();
            }
        };

        joystickContainer.addEventListener('pointerup', handlePointerEnd);
        joystickContainer.addEventListener('pointercancel', handlePointerEnd);

        function updateJoystick(clientX, clientY) {
            const center = getJoystickCenter();
            let dx = clientX - center.x;
            let dy = clientY - center.y;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            joystickInput.x = dx / maxRadius;
            joystickInput.y = dy / maxRadius;
        }

        function resetJoystick() {
            activePointerId = null;
            joystickInput.x = 0;
            joystickInput.y = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        // ============================================================
        // モデルの移動・回転
        // ============================================================
        function updateModelMovement(delta) {
            if (!targetModel) return;

            const isMoving = Math.abs(joystickInput.x) > 0.05 || Math.abs(joystickInput.y) > 0.05;

            if (isMoving) {
                if (actions.length > 1) {
                    setAction(1);
                }

                const cameraForward = new THREE.Vector3();
                camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDirection = new THREE.Vector3()
                    .addScaledVector(cameraRight, joystickInput.x)
                    .addScaledVector(cameraForward, -joystickInput.y)
                    .normalize();

                const inputLength = Math.min(1.0, Math.hypot(joystickInput.x, joystickInput.y));
                targetModel.position.addScaledVector(moveDirection, moveSpeed * inputLength * delta);

                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                const targetQuaternion = new THREE.Quaternion();
                targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
                targetModel.quaternion.slerp(targetQuaternion, rotationSpeed * delta);

            } else {
                if (actions.length > 0) {
                    setAction(0);
                }
            }
        }

        // ============================================================
        // メインループ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateModelMovement(delta);

            if (mixer) {
                mixer.update(delta);
            }

            if (targetModel) {
                followModelPosition();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
