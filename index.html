<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Analog Stick & Camera Control</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ============================================================
           左下：アナログスティック
        ============================================================ */
        #joystick-container {
            position: absolute;
            left: 30px;
            bottom: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-base {
            position: absolute;
            left: 0;
            top: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-stick {
            position: absolute;
            left: 52px;
            top: 52px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.65);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transform: translate(0px, 0px);
        }

        /* ============================================================
           右下：ジャンプボタン
        ============================================================ */
        #jump-button {
            position: absolute;
            right: 35px;
            bottom: 75px;
            width: 90px;
            height: 90px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #jump-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }

        /* ============================================================
           ジャンプボタンの右下：ダッシュ（高速移動）ボタン
        ============================================================ */
        #dash-button {
            position: absolute;
            right: 20px;
            bottom: 15px;
            width: 56px;
            height: 56px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #dash-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
    <div id="canvas-container"></div>

    <!-- アナログスティック -->
    <div id="joystick-container">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>

    <!-- ジャンプボタン -->
    <div id="jump-button">↑</div>

    <!-- ダッシュボタン（ジャンプボタンの右下） -->
    <div id="dash-button">⏫</div>

    <script>

        // ============================================================
        // Three.js 基本設定
        // ============================================================
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.1, 1000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        document.getElementById('canvas-container').appendChild(renderer.domElement);


        // ============================================================
        // ライト
        // ============================================================
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
        fillLight.position.set(-5, 5, -7);
        scene.add(fillLight);


        // ============================================================
        // 環境マップ
        // ============================================================
        const pmremGenerator = new THREE.PMREMGenerator(renderer);

        const environmentScene = new THREE.Scene();
        environmentScene.background = new THREE.Color(0x202020);

        const environmentLight = new THREE.HemisphereLight(0xffffff, 0x222222, 2);
        environmentScene.add(environmentLight);

        const environmentTarget = pmremGenerator.fromScene(environmentScene);
        scene.environment = environmentTarget.texture;


        // ============================================================
        // カメラ設定
        // ============================================================
        const targetHeightOffset = 1.5;
        const cameraDistance = 1.6;

        let cameraSpherical = new THREE.Spherical(cameraDistance, Math.PI / 2.2, 0);

        const minPolarAngle = 0.1;
        const maxPolarAngle = Math.PI / 2 - 0.05;


        // ============================================================
        // モデル・アニメーション
        // ============================================================
        let targetModel = null;
        let bgModel = null;
        let mixer = null;

        // idle / dash / jump
        let actions = {};
        let currentAction = null;

        // ct1のスケルトン内で最も上位（＝全体の上下移動を代表する）のボーン
        // jump中はここのワールドY座標を見て、カメラを上下に追従させる
        let rootBone = null;

        // ------------------------------------------------------------
        // 斬撃エフェクトの発生源となるノード（右手首ボーン）
        //
        // GLB内の実際の命名が不明なため、右手首らしき名前のボーンを
        // 複数のキーワードでゆるく一致検索するヒューリスティックな実装。
        // 見つからない場合は rootBone にフォールバックする。
        // ------------------------------------------------------------
        let slashSourceNode = null;

        const rightWristBoneNamePattern =
            /(right.*hand|right.*wrist|r[_\.]?hand\b|hand[_\.]?r\b|wrist.*r\b|r.*wrist|righthand|rightwrist|右手首|右手首関節|みぎてくび)/i;

        // rootBoneの立ち姿勢（基準）でのワールドY座標
        let rootBoneRestY = 0;

        // rootBoneの現在Y - 基準Y（＝ジャンプによる上下オフセット）
        let jumpHeightOffset = 0;

        // rootBoneのワールド座標取得用（毎フレーム使い回す）
        const rootBoneWorldPosition = new THREE.Vector3();

        // ジャンプ中かどうか
        // true の間（＝jump中断/完走のどちらかが確定するまで）は
        // dash/idleへのアニメーション切り替えを行わず、移動も
        // jumpMoveSpeedFactorをかけた低速でのみ許可する
        let isJumping = false;

        // jump開始からのフレーム数
        let jumpFrameCount = 0;

        // このフレームに到達し、かつ移動入力がある場合のみ
        // jumpをdashへ中断する（戦闘のリズムを崩さないため）
        // 入力が無ければ中断せず、jumpを最後まで再生してidleへ戻す
        const jumpTransitionFrame = 25;

        // GLBのアニメーションFPS
        const animationFPS = 30;

        // 衝撃波（＋黒い爆発）を発生させるフレーム
        const shockwaveFrame = 22;

        // 今回のjumpで衝撃波を発生させ済みかどうか
        let jumpShockwaveSpawned = false;

        const clock = new THREE.Clock();


        // ============================================================
        // 移動・カメラ設定
        // ============================================================
        const maxMoveSpeed = 4.0;

        // jump中は移動を完全に禁止せず、この倍率をかけた
        // 低速でのみ移動できるようにする
        const jumpMoveSpeedFactor = 0.3;

        const rotationSpeed = 10.0;
        const cameraTouchSensitivity = 0.005;


        // ============================================================
        // GLTF Loader
        // ============================================================
        const loader = new THREE.GLTFLoader();


        // ============================================================
        // 背景モデル
        // ============================================================
        loader.load(
            './bg.glb',
            function (gltf) {

                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);

                // 元のマテリアルの色を使用したワイヤーフレーム
                bgModel.traverse((child) => {

                    if (!child.isMesh) return;

                    const oldMaterial = child.material;
                    const materials = Array.isArray(oldMaterial) ? oldMaterial : [oldMaterial];

                    const newMaterials = materials.map((material) => {
                        return new THREE.MeshBasicMaterial({
                            wireframe: true,
                            transparent: material.transparent,
                            opacity: material.opacity,
                            map: material.map || null,
                            vertexColors: material.vertexColors
                        });
                    });

                    child.material = Array.isArray(oldMaterial) ? newMaterials : newMaterials[0];

                });

                scene.add(bgModel);

            },
            undefined,
            function (error) {
                console.error('bg.glb の読み込みエラー:', error);
            }
        );


        // ============================================================
        // ターゲットモデル
        // ============================================================
        loader.load(
            './ct1.glb',
            function (gltf) {

                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;

                // ct1.glb: 元の色を維持しつつ暗くする
                targetModel.traverse((child) => {

                    if (!child.isMesh) return;

                    const materials = Array.isArray(child.material) ? child.material : [child.material];

                    materials.forEach((material) => {

                        if (!material) return;

                        if (material.color) {
                            material.color.multiplyScalar(0.55);
                        }

                        material.metalness = 0.05;
                        material.roughness = 0.85;
                        material.envMapIntensity = 0.15;

                        if (material.map) {
                            material.map.encoding = THREE.sRGBEncoding;
                            material.map.needsUpdate = true;
                        }

                        material.needsUpdate = true;

                    });

                });

                scene.add(targetModel);

                // ====================================================
                // アニメーション
                // ====================================================
                if (gltf.animations && gltf.animations.length > 0) {

                    mixer = new THREE.AnimationMixer(targetModel);

                    gltf.animations.forEach((clip) => {

                        const action = mixer.clipAction(clip);
                        const animationName = clip.name.trim().toLowerCase();

                        if (animationName === 'jump') {

                            actions.jump = action;
                            action.setLoop(THREE.LoopOnce, 1);
                            action.clampWhenFinished = true;

                        } else {

                            action.setLoop(THREE.LoopRepeat, Infinity);
                            action.clampWhenFinished = false;

                            if (animationName === 'idle') actions.idle = action;
                            if (animationName === 'dash') actions.dash = action;

                        }

                    });

                    // jump終了イベント
                    // 25フレーム到達前に完走した場合や、入力が無いまま
                    // jumpを最後まで再生し終えた場合にここへ来る
                    // （中断済みならisJumpingは既にfalseなので何もしない）
                    mixer.addEventListener('finished', function (event) {

                        if (event.action === actions.jump && isJumping) {
                            isJumping = false;
                            updateMovementAnimation();
                        }

                    });

                    // 初期状態は idle
                    setAction('idle');

                }

                // ====================================================
                // ジャンプ追従用のルートボーン、および
                // 斬撃エフェクトの発生源となる右手首ボーンを特定する
                //
                // ・ルートボーン : スケルトン中で最初に見つかったボーン
                //   （＝一番上位の親ボーン）を、キャラクター全体の
                //   上下動の代表値として使う
                //
                // ・斬撃エフェクトの発生源 : 「右手首」らしき名前の
                //   ボーンを探す。見つからなければルートボーンに
                //   フォールバックする
                // ====================================================
                targetModel.traverse((child) => {

                    if (child.isBone && !rootBone) {
                        rootBone = child;
                    }

                    if (!slashSourceNode && child.isBone && rightWristBoneNamePattern.test(child.name)) {
                        slashSourceNode = child;
                        console.info('[斬撃エフェクト] 右手首らしき名前のボーンを検出:', child.name);
                    }

                });

                if (!slashSourceNode) {
                    slashSourceNode = rootBone;
                    console.warn('[斬撃エフェクト] 右手首らしき名前のボーンが見つからなかったため、rootBoneにフォールバックしました。');
                }

                if (rootBone) {
                    targetModel.updateMatrixWorld(true);
                    rootBone.getWorldPosition(rootBoneWorldPosition);
                    rootBoneRestY = rootBoneWorldPosition.y;
                }

                updateCameraPosition();

            },
            undefined,
            function (error) {
                console.error('ct1.glb の読み込みエラー:', error);
            }
        );


        // ============================================================
        // アニメーション切り替え
        // ============================================================
        function setAction(name) {

            if (!mixer || !actions[name]) return;

            const nextAction = actions[name];

            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().play();
                currentAction = nextAction;
            }

        }


        // ============================================================
        // パーティクル共通処理
        //
        // 衝撃波の閃光/赤黒い破片、黒っぽい上方爆発、斬撃エフェクト、
        // ダッシュの軌跡など、見た目は違えど同じ物理（速度・重力・
        // 回転・フェード）で動くパーティクルをすべてこの配列でまとめて
        // 管理する。
        // ============================================================
        const particles = [];


        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }


        // ------------------------------------------------------------
        // 白い閃光（衝撃波の発生瞬間だけ強く光るコア）
        // ------------------------------------------------------------
        function spawnFlashParticle(position, options) {

            const geometry = new THREE.SphereGeometry(options.radius, 12, 12);

            const material = new THREE.MeshBasicMaterial({
                color: options.color,
                transparent: true,
                opacity: options.startOpacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            scene.add(mesh);

            particles.push({
                kind: 'flash',
                mesh: mesh,
                elapsed: 0,
                duration: options.duration,
                maxScale: options.maxScale,
                startOpacity: options.startOpacity
            });

        }


        // ------------------------------------------------------------
        // 細かい四角（箱型）のパーティクルを一括生成する汎用関数
        //
        // 衝撃波の破片・黒い爆発・斬撃エフェクト・ダッシュの軌跡は
        // すべてこれを使う。色や個数、速度、重力、範囲（spawnSpread）
        // だけを変えることで見た目の違うエフェクトを作り出す。
        // ------------------------------------------------------------
        function spawnCubeBurst(position, params) {

            const spawnSpread = params.spawnSpread || 0;

            for (let i = 0; i < params.count; i++) {

                const size = randomRange(params.minSize, params.maxSize);

                const geometry = new THREE.BoxGeometry(
                    size,
                    size,
                    size * randomRange(0.15, 0.35)
                );

                const color = params.colorA.clone().lerp(params.colorB, Math.random());

                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                const mesh = new THREE.Mesh(geometry, material);

                const spawnPosition = position.clone();

                if (spawnSpread > 0) {
                    spawnPosition.x += randomRange(-spawnSpread, spawnSpread);
                    spawnPosition.y += randomRange(-spawnSpread * 0.4, spawnSpread);
                    spawnPosition.z += randomRange(-spawnSpread, spawnSpread);
                }

                mesh.position.copy(spawnPosition);

                mesh.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                const azimuth = Math.random() * Math.PI * 2;
                const elevation = randomRange(params.elevationMin, params.elevationMax);
                const horizontalRadius = Math.cos(elevation);

                const direction = new THREE.Vector3(
                    Math.cos(azimuth) * horizontalRadius,
                    Math.sin(elevation),
                    Math.sin(azimuth) * horizontalRadius
                );

                const speed = randomRange(params.minSpeed, params.maxSpeed);
                const velocity = direction.multiplyScalar(speed);

                const angularVelocity = new THREE.Vector3(
                    randomRange(-10, 10),
                    randomRange(-10, 10),
                    randomRange(-10, 10)
                );

                scene.add(mesh);

                particles.push({
                    kind: 'cube',
                    mesh: mesh,
                    elapsed: 0,
                    duration: randomRange(params.minDuration, params.maxDuration),
                    velocity: velocity,
                    angularVelocity: angularVelocity,
                    gravity: params.gravity,
                    startOpacity: 1.0,
                    startScale: 1.0
                });

            }

        }


        function updateParticles(delta) {

            for (let i = particles.length - 1; i >= 0; i--) {

                const effect = particles[i];
                effect.elapsed += delta;

                const t = Math.min(effect.elapsed / effect.duration, 1);

                if (effect.kind === 'flash') {

                    const scale = 1 + t * (effect.maxScale - 1);
                    effect.mesh.scale.set(scale, scale, scale);
                    effect.mesh.material.opacity = effect.startOpacity * (1 - t);

                } else {

                    effect.velocity.y -= effect.gravity * delta;
                    effect.mesh.position.addScaledVector(effect.velocity, delta);

                    effect.mesh.rotation.x += effect.angularVelocity.x * delta;
                    effect.mesh.rotation.y += effect.angularVelocity.y * delta;
                    effect.mesh.rotation.z += effect.angularVelocity.z * delta;

                    const scale = effect.startScale * (1 - t * 0.5);
                    effect.mesh.scale.set(scale, scale, scale);
                    effect.mesh.material.opacity = effect.startOpacity * (1 - t);

                }

                if (t >= 1) {
                    scene.remove(effect.mesh);
                    effect.mesh.geometry.dispose();
                    effect.mesh.material.dispose();
                    particles.splice(i, 1);
                }

            }

        }


        // ============================================================
        // 衝撃波エフェクト（赤黒い細かい四角の破片が飛び散る）＋
        // 黒っぽい四角の集合体が同じ地点から上方向へ爆発するエフェクト
        //
        // jumpの22フレーム目で1回だけ発生させる。
        // 発生位置は ct1 の前方・地面付近。
        // 発生後はjumpが中断されようが完走しようが関係なく、
        // 各パーティクルが自身の経過時間・速度だけで
        // 飛び散り～フェードアウトして消える
        // （キャラクターのアニメーション状態には依存しない）
        // ============================================================

        // ------------------------------------
        // 中心の閃光
        // ------------------------------------
        const shockwaveFlashDuration = 0.12;
        const shockwaveFlashRadius = 0.5;
        const shockwaveFlashMaxScale = 3.2;
        const shockwaveFlashMaxOpacity = 1.0;
        const shockwaveFlashColor = 0xffffff;

        // ------------------------------------
        // 不規則に飛び散る、赤黒い細かい四角の破片
        // ------------------------------------
        const shockwaveSparkCount = 55;

        const shockwaveSparkMinSpeed = 2.0;
        const shockwaveSparkMaxSpeed = 6.0;

        const shockwaveSparkMinSize = 0.08;
        const shockwaveSparkMaxSize = 0.24;

        const shockwaveSparkMinDuration = 0.4;
        const shockwaveSparkMaxDuration = 0.9;

        const shockwaveSparkGravity = 3.5;

        // 「赤黒い」表現のため、深い赤～ほぼ黒の間でランダムに混ぜる
        // （斬撃エフェクトもこの配色を流用する）
        const shockwaveSparkColorRed = new THREE.Color(0xff2200);
        const shockwaveSparkColorBlack = new THREE.Color(0x120000);

        // ------------------------------------
        // 衝撃波とは別に、同じ地点から上方向へ爆発する
        // 黒っぽい四角の集合体
        // ------------------------------------
        const blackBurstCount = 45;

        const blackBurstMinSpeed = 3.0;
        const blackBurstMaxSpeed = 7.0;

        const blackBurstMinSize = 0.1;
        const blackBurstMaxSize = 0.26;

        const blackBurstMinDuration = 0.5;
        const blackBurstMaxDuration = 1.0;

        const blackBurstGravity = 2.5;

        // ほぼ真上（elevationがπ/2に近いほど真上）に飛ばす
        const blackBurstElevationMin = 0.9;
        const blackBurstElevationMax = 1.4;

        // 集合体らしく、発生位置に少しだけばらつきを持たせる
        const blackBurstSpawnSpread = 0.2;

        // 「黒っぽい」表現のため、ごく暗い赤黒～純粋な黒の間で混ぜる
        // （ダッシュの軌跡パーティクルもこの、より暗い配色を流用する）
        const blackBurstColorDark = new THREE.Color(0x1a0000);
        const blackBurstColorBlack = new THREE.Color(0x000000);

        // ------------------------------------
        // 共通：発生位置（キャラクターの少し前方・地面付近）
        // ------------------------------------
        const shockwaveForwardOffset = 0.9;
        const shockwaveGroundOffset = 0.05;


        function getShockwaveOriginPosition() {

            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(targetModel.quaternion);
            forward.y = 0;
            forward.normalize();

            const basePosition = targetModel.position.clone()
                .addScaledVector(forward, shockwaveForwardOffset);

            basePosition.y += shockwaveGroundOffset;

            return basePosition;

        }


        function spawnJumpImpactEffects() {

            if (!targetModel) return;

            const origin = getShockwaveOriginPosition();

            // 中心の閃光
            spawnFlashParticle(origin, {
                radius: shockwaveFlashRadius,
                duration: shockwaveFlashDuration,
                maxScale: shockwaveFlashMaxScale,
                startOpacity: shockwaveFlashMaxOpacity,
                color: shockwaveFlashColor
            });

            // 赤黒い破片（衝撃波本体）
            spawnCubeBurst(origin, {
                count: shockwaveSparkCount,
                minSize: shockwaveSparkMinSize,
                maxSize: shockwaveSparkMaxSize,
                minSpeed: shockwaveSparkMinSpeed,
                maxSpeed: shockwaveSparkMaxSpeed,
                minDuration: shockwaveSparkMinDuration,
                maxDuration: shockwaveSparkMaxDuration,
                gravity: shockwaveSparkGravity,
                colorA: shockwaveSparkColorRed,
                colorB: shockwaveSparkColorBlack,
                elevationMin: -0.1,
                elevationMax: 1.0,
                spawnSpread: 0
            });

            // 黒っぽい四角の集合体（同じ地点から上方向へ爆発）
            spawnCubeBurst(origin, {
                count: blackBurstCount,
                minSize: blackBurstMinSize,
                maxSize: blackBurstMaxSize,
                minSpeed: blackBurstMinSpeed,
                maxSpeed: blackBurstMaxSpeed,
                minDuration: blackBurstMinDuration,
                maxDuration: blackBurstMaxDuration,
                gravity: blackBurstGravity,
                colorA: blackBurstColorDark,
                colorB: blackBurstColorBlack,
                elevationMin: blackBurstElevationMin,
                elevationMax: blackBurstElevationMax,
                spawnSpread: blackBurstSpawnSpread
            });

        }


        // ============================================================
        // 斬撃エフェクト
        //
        // 右手首ボーン（slashSourceNode）の位置から、衝撃波と同じ
        // 赤黒い四角のパーティクルを毎フレーム発生させる。
        // 「大袈裟」にするため、発生位置のばらつき・サイズ・範囲を
        // 実際の腕の動きよりも大きめに設定している。
        // jump中のみ発生し、各パーティクルは自身の寿命でフェードアウトする。
        // ============================================================
        const slashEffectSpawnCountPerFrame = 3;

        // 発生位置のランダムなばらつき範囲（大袈裟にするため広め）
        const slashEffectSpawnSpread = 0.55;

        const slashEffectMinSize = 0.14;
        const slashEffectMaxSize = 0.38;

        const slashEffectMinSpeed = 0.6;
        const slashEffectMaxSpeed = 2.4;

        const slashEffectMinDuration = 0.25;
        const slashEffectMaxDuration = 0.55;

        const slashEffectGravity = 1.0;

        const slashEffectElevationMin = -0.3;
        const slashEffectElevationMax = 0.9;

        const slashSourceWorldPosition = new THREE.Vector3();


        function updateSlashEffect(delta) {

            if (!isJumping || !slashSourceNode) return;

            slashSourceNode.getWorldPosition(slashSourceWorldPosition);

            spawnCubeBurst(slashSourceWorldPosition, {
                count: slashEffectSpawnCountPerFrame,
                minSize: slashEffectMinSize,
                maxSize: slashEffectMaxSize,
                minSpeed: slashEffectMinSpeed,
                maxSpeed: slashEffectMaxSpeed,
                minDuration: slashEffectMinDuration,
                maxDuration: slashEffectMaxDuration,
                gravity: slashEffectGravity,
                // 衝撃波と同じ「赤に黒を混ぜた」配色を流用
                colorA: shockwaveSparkColorRed,
                colorB: shockwaveSparkColorBlack,
                elevationMin: slashEffectElevationMin,
                elevationMax: slashEffectElevationMax,
                spawnSpread: slashEffectSpawnSpread
            });

        }


        // ============================================================
        // ダッシュ（高速移動）
        //
        // ダッシュボタン押下で、ct1が現在向いている方向へ一瞬で
        // 高速移動する。移動中はct1本体を非表示にし、代わりに
        // 軌道上へ「衝撃波の黒い爆発」と同じ形状・より暗い配色の
        // 四角パーティクルを継続的に発生させ、駆け抜けた軌跡を
        // 表現する。
        // ============================================================
        let isDashing = false;
        let dashElapsed = 0;

        const dashDuration = 0.22;   // ダッシュ全体の所要時間（秒）
        const dashDistance = 7.0;    // ダッシュで進む距離（メートル）

        const dashDirection = new THREE.Vector3();
        const dashStartPosition = new THREE.Vector3();
        const dashCurrentPosition = new THREE.Vector3();
        const dashTrailSpawnPosition = new THREE.Vector3();

        // ------------------------------------
        // 軌跡パーティクルのパラメータ
        // （衝撃波の黒い爆発より、その場に留まりやすいよう
        //   速度・重力をやや控えめにして「軌跡」らしく見せる）
        // ------------------------------------
        const dashTrailSpawnCountPerFrame = 5;
        const dashTrailSpawnSpread = 0.35;

        const dashTrailMinSize = 0.12;
        const dashTrailMaxSize = 0.32;

        const dashTrailMinSpeed = 0.2;
        const dashTrailMaxSpeed = 1.0;

        const dashTrailMinDuration = 0.35;
        const dashTrailMaxDuration = 0.7;

        const dashTrailGravity = 1.2;

        const dashTrailElevationMin = -0.15;
        const dashTrailElevationMax = 0.7;

        // 軌跡パーティクルを腰の高さあたりへオフセットする量
        const dashTrailHeightOffset = 0.9;


        function spawnDashTrailParticles(position) {

            spawnCubeBurst(position, {
                count: dashTrailSpawnCountPerFrame,
                minSize: dashTrailMinSize,
                maxSize: dashTrailMaxSize,
                minSpeed: dashTrailMinSpeed,
                maxSpeed: dashTrailMaxSpeed,
                minDuration: dashTrailMinDuration,
                maxDuration: dashTrailMaxDuration,
                gravity: dashTrailGravity,
                // 衝撃波の黒い爆発と同じ、より暗めの配色を流用
                colorA: blackBurstColorDark,
                colorB: blackBurstColorBlack,
                elevationMin: dashTrailElevationMin,
                elevationMax: dashTrailElevationMax,
                spawnSpread: dashTrailSpawnSpread
            });

        }


        function dashForward() {

            if (!targetModel) return;

            // ダッシュ中・ジャンプ中は多重発動しない
            if (isDashing || isJumping) return;

            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(targetModel.quaternion);
            forward.y = 0;
            forward.normalize();

            dashDirection.copy(forward);
            dashStartPosition.copy(targetModel.position);
            dashElapsed = 0;
            isDashing = true;

            // ダッシュ中はct1本体を隠す
            targetModel.visible = false;

        }


        function updateDash(delta) {

            if (!isDashing) return;

            dashElapsed += delta;
            const t = Math.min(dashElapsed / dashDuration, 1);

            dashCurrentPosition.copy(dashStartPosition)
                .addScaledVector(dashDirection, dashDistance * t);

            targetModel.position.copy(dashCurrentPosition);

            // 軌道上にパーティクルを発生させ続ける
            dashTrailSpawnPosition.copy(dashCurrentPosition);
            dashTrailSpawnPosition.y += dashTrailHeightOffset;
            spawnDashTrailParticles(dashTrailSpawnPosition);

            if (t >= 1) {

                isDashing = false;
                targetModel.visible = true;

                updateMovementAnimation();

            }

        }


        // ============================================================
        // カメラシェイク
        //
        // jumpの22フレーム目（インパクトのピーク）に合わせて発生させ、
        // 爽快感を出すために画面を短く揺らす
        // ============================================================
        let cameraShakeElapsed = null;
        const cameraShakeDuration = 0.35;
        const cameraShakeMagnitude = 0.12;


        function triggerCameraShake() {
            cameraShakeElapsed = 0;
        }


        function applyCameraShake(delta) {

            if (cameraShakeElapsed === null) return;

            cameraShakeElapsed += delta;
            const t = cameraShakeElapsed / cameraShakeDuration;

            if (t >= 1) {
                cameraShakeElapsed = null;
                return;
            }

            const decay = 1 - t;
            const magnitude = cameraShakeMagnitude * decay * decay;

            camera.position.x += (Math.random() * 2 - 1) * magnitude;
            camera.position.y += (Math.random() * 2 - 1) * magnitude;
            camera.position.z += (Math.random() * 2 - 1) * magnitude;

        }


        // ============================================================
        // 現在、移動入力があるかどうか
        // ============================================================
        function hasMoveInput() {
            return (
                joystickX !== 0 || joystickY !== 0 ||
                keyState.up || keyState.down || keyState.left || keyState.right
            );
        }


        // ============================================================
        // ジャンプ
        // ============================================================
        function jump() {

            if (!mixer || !actions.jump) return;

            // ジャンプ中は再度ジャンプしない
            if (isJumping) return;

            // ダッシュ中はジャンプしない
            if (isDashing) return;

            isJumping = true;
            jumpFrameCount = 0;
            jumpShockwaveSpawned = false;

            const jumpAction = actions.jump;

            if (currentAction) currentAction.fadeOut(0.1);

            jumpAction.reset().setLoop(THREE.LoopOnce, 1);
            jumpAction.clampWhenFinished = true;
            jumpAction.fadeIn(0.1).play();

            currentAction = jumpAction;

        }


        // ============================================================
        // ジャンプボタン
        // ============================================================
        const jumpButton = document.getElementById('jump-button');

        jumpButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            jump();
        }, { passive: false });


        // ============================================================
        // ダッシュボタン
        // ============================================================
        const dashButton = document.getElementById('dash-button');

        dashButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dashForward();
        }, { passive: false });


        // ============================================================
        // カメラ位置更新
        // ============================================================
        function updateCameraPosition() {

            if (!targetModel) return;

            const targetPosition = targetModel.position.clone()
                .add(new THREE.Vector3(0, targetHeightOffset + jumpHeightOffset, 0));

            const offset = new THREE.Vector3().setFromSpherical(cameraSpherical);

            camera.position.copy(targetPosition).add(offset);
            camera.lookAt(targetPosition);

        }


        // ============================================================
        // アナログスティック
        // ============================================================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickStick = document.getElementById('joystick-stick');

        let joystickPointerId = null;
        let joystickX = 0;
        let joystickY = 0;

        const joystickRadius = 52;
        const joystickDeadZone = 0.08;


        function updateJoystick(clientX, clientY) {

            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            const distance = Math.hypot(dx, dy);

            if (distance > joystickRadius) {
                dx = dx / distance * joystickRadius;
                dy = dy / distance * joystickRadius;
            }

            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

            joystickX = dx / joystickRadius;
            joystickY = dy / joystickRadius;

            const normalizedDistance = Math.hypot(joystickX, joystickY);

            if (normalizedDistance < joystickDeadZone) {
                joystickX = 0;
                joystickY = 0;
            }

        }


        function resetJoystick() {
            joystickPointerId = null;
            joystickX = 0;
            joystickY = 0;
            joystickStick.style.transform = 'translate(0px, 0px)';
        }


        function handleJoystickStart(e) {

            e.preventDefault();
            e.stopPropagation();

            if (joystickPointerId !== null) return;

            joystickPointerId = e.pointerId;

            try {
                joystickContainer.setPointerCapture(e.pointerId);
            } catch (err) {}

            updateJoystick(e.clientX, e.clientY);

        }


        function handleJoystickMove(e) {

            if (e.pointerId !== joystickPointerId) return;

            e.preventDefault();
            e.stopPropagation();

            updateJoystick(e.clientX, e.clientY);

        }


        function handleJoystickEnd(e) {

            if (e.pointerId !== joystickPointerId) return;

            e.preventDefault();
            e.stopPropagation();

            try {
                if (joystickContainer.hasPointerCapture(e.pointerId)) {
                    joystickContainer.releasePointerCapture(e.pointerId);
                }
            } catch (err) {}

            resetJoystick();

        }


        joystickContainer.addEventListener('pointerdown', handleJoystickStart, { passive: false });
        joystickContainer.addEventListener('pointermove', handleJoystickMove, { passive: false });
        joystickContainer.addEventListener('pointerup', handleJoystickEnd, { passive: false });
        joystickContainer.addEventListener('pointercancel', handleJoystickEnd, { passive: false });


        // ============================================================
        // キーボード操作
        // ============================================================
        const keyState = {
            up: false,
            down: false,
            left: false,
            right: false
        };


        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = true;
        });


        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = false;
        });


        // ============================================================
        // カメラ操作
        // ============================================================
        let isCameraDragging = false;
        let cameraPointerId = null;
        let previousTouchX = 0;
        let previousTouchY = 0;


        function handleRightScreenStart(e) {

            if (e.target.closest('#joystick-container')) return;
            if (e.target.closest('#jump-button')) return;
            if (e.target.closest('#dash-button')) return;
            if (isCameraDragging) return;

            if (e.clientX >= window.innerWidth / 2) {

                e.preventDefault();

                isCameraDragging = true;
                cameraPointerId = e.pointerId;
                previousTouchX = e.clientX;
                previousTouchY = e.clientY;

                try {
                    renderer.domElement.setPointerCapture(e.pointerId);
                } catch (err) {}

            }

        }


        function handleRightScreenMove(e) {

            if (!isCameraDragging) return;
            if (e.pointerId !== cameraPointerId) return;

            e.preventDefault();

            const deltaX = e.clientX - previousTouchX;
            const deltaY = e.clientY - previousTouchY;

            cameraSpherical.theta -= deltaX * cameraTouchSensitivity;
            cameraSpherical.phi -= deltaY * cameraTouchSensitivity;

            cameraSpherical.phi = Math.max(
                minPolarAngle,
                Math.min(maxPolarAngle, cameraSpherical.phi)
            );

            previousTouchX = e.clientX;
            previousTouchY = e.clientY;

        }


        function handleRightScreenEnd(e) {

            if (!isCameraDragging) return;
            if (e.pointerId !== cameraPointerId) return;

            e.preventDefault();

            isCameraDragging = false;

            try {
                if (renderer.domElement.hasPointerCapture(e.pointerId)) {
                    renderer.domElement.releasePointerCapture(e.pointerId);
                }
            } catch (err) {}

            cameraPointerId = null;

        }


        window.addEventListener('pointerdown', handleRightScreenStart, { passive: false });
        window.addEventListener('pointermove', handleRightScreenMove, { passive: false });
        window.addEventListener('pointerup', handleRightScreenEnd, { passive: false });
        window.addEventListener('pointercancel', handleRightScreenEnd, { passive: false });


        // ============================================================
        // 移動アニメーション更新
        //
        // jumpが中断／完走してisJumpingがfalseになった直後や、
        // ダッシュが終了した直後に呼ばれ、その時点の入力状態に
        // 応じてdash / idleへ切り替える
        // ============================================================
        function updateMovementAnimation() {

            if (hasMoveInput()) {
                if (actions.dash) setAction('dash');
            } else {
                if (actions.idle) setAction('idle');
            }

        }


        // ============================================================
        // キャラクター移動
        // ============================================================
        function updateModelMovement(delta) {

            if (!targetModel) return;

            // ダッシュ中は通常の移動処理を行わない
            // （位置更新はupdateDashが専任で行う）
            if (isDashing) return;

            let moveX = joystickX;
            let moveY = joystickY;

            let currentSpeed = 0;

            let keyboardX = 0;
            let keyboardY = 0;

            if (keyState.right) keyboardX += 1;
            if (keyState.left) keyboardX -= 1;
            if (keyState.up) keyboardY -= 1;
            if (keyState.down) keyboardY += 1;

            if (keyboardX !== 0 || keyboardY !== 0) {

                const length = Math.hypot(keyboardX, keyboardY);
                moveX = keyboardX / length;
                moveY = keyboardY / length;
                currentSpeed = maxMoveSpeed;

            } else {

                if (moveX !== 0 || moveY !== 0) {
                    currentSpeed = maxMoveSpeed;
                } else {
                    currentSpeed = 0;
                }

            }

            const isMoving = currentSpeed > 0;

            // jump中は移動を完全に禁止せず、低速での移動のみ許可する
            if (isJumping) {
                currentSpeed *= jumpMoveSpeedFactor;
            }

            // jump中はここでdash/idleへ切り替えない
            if (!isJumping) {

                if (isMoving) {
                    if (actions.dash) setAction('dash');
                } else {
                    if (actions.idle) setAction('idle');
                }

            }

            // 実際の移動
            if (isMoving) {

                const cameraForward = new THREE.Vector3();
                camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDirection = new THREE.Vector3();
                moveDirection
                    .addScaledVector(cameraRight, moveX)
                    .addScaledVector(cameraForward, -moveY);

                if (moveDirection.lengthSq() > 0) {
                    moveDirection.normalize();
                }

                targetModel.position.addScaledVector(moveDirection, currentSpeed * delta);

                // 移動方向へキャラクターを向ける
                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);

                const targetQuaternion = new THREE.Quaternion();
                targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);

                targetModel.quaternion.slerp(targetQuaternion, rotationSpeed * delta);

            }

        }


        // ============================================================
        // メインループ
        // ============================================================
        function animate() {

            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateModelMovement(delta);
            updateDash(delta);

            // 衝撃波・黒い爆発・斬撃エフェクト・ダッシュの軌跡はどれも、
            // 常に自身の経過時間だけで更新する
            updateParticles(delta);

            // 斬撃エフェクトの新規発生はisJumping中のみ
            updateSlashEffect(delta);

            if (mixer) {

                mixer.update(delta);

                // jumpのフレーム数を確認し、25フレーム以降かつ
                // 移動入力があればdashへ中断する
                // （戦闘のリズムを崩さないため）
                //
                // 入力が無ければ中断せず、jumpを最後まで再生させ、
                // 'finished' イベント（アニメーション完走）でidleへ戻す
                if (isJumping && actions.jump) {

                    jumpFrameCount = Math.floor(actions.jump.time * animationFPS);

                    // 22フレーム目で衝撃波・黒い爆発・カメラシェイクを発生
                    // （1回のjumpにつき1回だけ）
                    if (!jumpShockwaveSpawned && jumpFrameCount >= shockwaveFrame) {
                        spawnJumpImpactEffects();
                        triggerCameraShake();
                        jumpShockwaveSpawned = true;
                    }

                    if (jumpFrameCount >= jumpTransitionFrame && hasMoveInput()) {
                        isJumping = false;
                        updateMovementAnimation();
                    }

                }

            }

            // ルートボーンの上下動をジャンプの高さオフセットとして
            // 反映する（jump中にct1が飛び上がる分、カメラも追従する）
            if (rootBone) {

                targetModel.updateMatrixWorld(true);
                rootBone.getWorldPosition(rootBoneWorldPosition);

                jumpHeightOffset = rootBoneWorldPosition.y - rootBoneRestY;

            }

            updateCameraPosition();
            applyCameraShake(delta);

            renderer.render(scene, camera);

        }

        animate();


        // ============================================================
        // リサイズ
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
