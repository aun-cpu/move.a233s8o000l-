<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ct1.glb Test Viewer</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #202020;
}

canvas {
    display: block;
}

#info {
    position: fixed;
    left: 10px;
    top: 10px;
    z-index: 10;
    padding: 10px 12px;
    max-width: calc(100% - 20px);
    color: white;
    background: rgba(0, 0, 0, 0.75);
    font: 13px/1.5 monospace;
    white-space: pre-wrap;
    border-radius: 6px;
}
</style>
</head>

<body>

<div id="info">ct1.glb 読み込み開始...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

'use strict';

const info = document.getElementById('info');

function log(text) {
    console.log(text);
    info.textContent += '\n' + text;
}

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// 明るさを確保
scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2.5
    )
);

const keyLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

keyLight.position.set(
    5,
    10,
    8
);

scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(
    0xffffff,
    2
);

fillLight.position.set(
    -5,
    5,
    -8
);

scene.add(fillLight);


// 床
const grid = new THREE.GridHelper(
    10,
    20,
    0x666666,
    0x333333
);

scene.add(grid);


// XYZ軸
const axes = new THREE.AxesHelper(2);

scene.add(axes);


const loader = new THREE.GLTFLoader();


loader.load(

    './ct1.glb',

    function(gltf) {

        log('✓ ct1.glb 読み込み成功');

        const model = gltf.scene;

        scene.add(model);


        let meshCount = 0;
        let skinnedMeshCount = 0;
        let boneCount = 0;
        let materialCount = 0;


        model.traverse(function(obj) {

            obj.visible = true;


            if (obj.isMesh) {

                meshCount++;


                if (obj.isSkinnedMesh) {
                    skinnedMeshCount++;
                }


                // 表示確認を最優先するため、
                // 元のマテリアルを使わず単純な白色にする
                obj.material =
                    new THREE.MeshBasicMaterial({

                        color: 0xffffff,

                        side: THREE.DoubleSide

                    });


                obj.frustumCulled = false;


                if (obj.geometry) {

                    obj.geometry.computeBoundingBox();

                }

            }


            if (obj.isBone) {

                boneCount++;

            }


            if (obj.material) {

                materialCount++;

            }

        });


        log(
            'Mesh数: ' +
            meshCount
        );


        log(
            'SkinnedMesh数: ' +
            skinnedMeshCount
        );


        log(
            'Bone数: ' +
            boneCount
        );


        log(
            'Animation数: ' +
            gltf.animations.length
        );


        if (gltf.animations.length) {

            log(
                'Animation: ' +
                gltf.animations
                    .map(a => a.name)
                    .join(', ')
            );

        }


        // モデル全体のBoundingBox
        const box =
            new THREE.Box3()
                .setFromObject(model);


        const size =
            box.getSize(
                new THREE.Vector3()
            );


        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        log(
            'BoundingBox size: ' +

            size.x.toFixed(3) +
            ' / ' +

            size.y.toFixed(3) +
            ' / ' +

            size.z.toFixed(3)
        );


        log(
            'BoundingBox center: ' +

            center.x.toFixed(3) +
            ' / ' +

            center.y.toFixed(3) +
            ' / ' +

            center.z.toFixed(3)
        );


        // モデルを原点へ移動
        model.position.sub(center);


        // モデルサイズからカメラ距離を決定
        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        camera.position.set(

            maxSize * 1.8,

            maxSize * 0.8,

            maxSize * 1.8

        );


        camera.lookAt(
            0,
            maxSize * 0.35,
            0
        );


        // アニメーション
        let mixer = null;


        if (gltf.animations.length > 0) {

            mixer =
                new THREE.AnimationMixer(
                    model
                );


            const idle =
                gltf.animations.find(
                    a => a.name === 'idle'
                );


            const action =
                idle ||
                gltf.animations[0];


            if (action) {

                const animationAction =
                    mixer.clipAction(action);

                animationAction.reset();
                animationAction.play();

                log(
                    '再生Animation: ' +
                    action.name
                );

            }

        }


        // Mesh情報
        model.traverse(function(obj) {

            if (obj.isMesh) {

                log(
                    'Mesh: ' +
                    obj.name +
                    ' / geometry=' +
                    (
                        obj.geometry
                        ? 'OK'
                        : 'NONE'
                    )
                );

            }

        });


        window.__mixer = mixer;
        window.__model = model;


        info.style.background =
            'rgba(0, 80, 0, .8)';

    },


    function(xhr) {

        if (xhr.total) {

            const percent =
                (
                    xhr.loaded /
                    xhr.total *
                    100
                ).toFixed(1);


            info.textContent =
                'ct1.glb 読み込み中... ' +
                percent +
                '%';

        }

    },


    function(error) {

        console.error(
            'ct1.glb 読み込み失敗:',
            error
        );


        info.textContent =
            '✗ ct1.glb 読み込み失敗\n\n' +
            'Consoleに詳細なエラーがあります。\n' +
            String(error);


        info.style.background =
            'rgba(100, 0, 0, .85)';

    }

);


const clock = new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if (window.__mixer) {

        window.__mixer.update(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


window.addEventListener(
    'resize',
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
