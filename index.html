<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Analog Stick & Camera Control</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #1a1a1a;
        touch-action: none;
    }
    #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }
    #joystick-container {
        position: absolute;
        left: 30px;
        bottom: 30px;
        width: 150px;
        height: 150px;
        z-index: 20;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #joystick-base {
        position: absolute;
        left: 0;
        top: 0;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.35);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #joystick-stick {
        position: absolute;
        left: 52px;
        top: 52px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.65);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        transform: translate(0px, 0px);
    }
    #jump-button {
        position: absolute;
        right: 20px;
        bottom: 81px;
        width: 56px;
        height: 56px;
        z-index: 20;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: rgba(255, 255, 255, 0.9);
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #jump-button:active {
        background: rgba(255, 255, 255, 0.35);
        transform: scale(0.94);
    }
    #dash-button {
        position: absolute;
        right: 20px;
        bottom: 15px;
        width: 56px;
        height: 56px;
        z-index: 20;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: rgba(255, 255, 255, 0.9);
        font-size: 22px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #dash-button:active {
        background: rgba(255, 255, 255, 0.35);
        transform: scale(0.94);
    }
    #at-button {
        position: absolute;
        right: 91px;
        bottom: 31px;
        width: 90px;
        height: 90px;
        z-index: 20;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: rgba(255, 255, 255, 0.9);
        font-size: 28px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #at-button:active {
        background: rgba(255, 255, 255, 0.35);
        transform: scale(0.94);
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="joystick-container">
    <div id="joystick-base"></div>
    <div id="joystick-stick"></div>
</div>
<div id="jump-button">↑</div>
<div id="dash-button">⏫</div>
<div id="at-button">AT</div>
<script>
    // ============================================================
    // Three.js 基本設定
    // ============================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    // ============================================================
    // ライト
    // ============================================================
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.6);
    dirLight.position.set(5, 10, 7.5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
    fillLight.position.set(-5, 5, -7);
    scene.add(fillLight);
    // ============================================================
    // 環境マップ
    // ============================================================
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const environmentScene = new THREE.Scene();
    environmentScene.background = new THREE.Color(0x202020);
    const environmentLight = new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2
    );
    environmentScene.add(environmentLight);
    const environmentTarget =
        pmremGenerator.fromScene(environmentScene);
    scene.environment = environmentTarget.texture;
    // ============================================================
    // カメラ設定
    // ============================================================
    const targetHeightOffset = 1.5;
    const cameraDistance = 1.6;
    let cameraSpherical = new THREE.Spherical(
        cameraDistance,
        Math.PI / 2.2,
        0
    );
    const minPolarAngle = 0.1;
    const maxPolarAngle = Math.PI / 2 - 0.05;
    // ============================================================
    // モデル・アニメーション（ct1）
    // ============================================================
    let targetModel = null;
    let bgModel = null;
    let mixer = null;
    let actions = {};
    let currentAction = null;
    let rootBone = null;
    let slashSourceNode = null;
    const rightWristBoneNamePattern =
        /(right.*hand|right.*wrist|r[_\.]?hand\b|hand[_\.]?r\b|wrist.*r\b|r.*wrist|righthand|rightwrist|右手首|右手首関節|みぎてくび)/i;
    let rootBoneRestY = 0;
    let jumpHeightOffset = 0;
    const rootBoneWorldPosition = new THREE.Vector3();
    let isJumping = false;
    let jumpFrameCount = 0;
    const jumpTransitionFrame = 25;
    const animationFPS = 30;
    const shockwaveFrame = 22;
    let jumpShockwaveSpawned = false;
    // ------------------------------------------------------------
    // ct1のAT（at1）攻撃
    // ------------------------------------------------------------
    let isAttacking1 = false;
    let isAttacking2 = false;
    let at1FrameCount = 0;
    let at2FrameCount = 0;
    let at1HitApplied = false;
    let at2HitApplied = false;
    // at1/at2の指定フレームで、ct1の現在の向きへ1だけ移動するためのフラグ
    let at1ForwardStepApplied = false;
    let at2ForwardStepApplied = false;
    // at1/at2の前進ステップを瞬間移動ではなく滑らかに行うための状態
    let at1StepActive = false;
    let at1StepElapsed = 0;
    let at1StepMovedDistance = 0;
    let at1StepTotalDistance = 0;
    const at1StepDuration = 0.12;
    const at1StepDirection = new THREE.Vector3();
    let at2StepActive = false;
    let at2StepElapsed = 0;
    let at2StepMovedDistance = 0;
    let at2StepTotalDistance = 0;
    const at2StepDuration = 0.12;
    const at2StepDirection = new THREE.Vector3();
    const at1HitFrameStart = 11;
    const at1HitFrameEnd = 15;
    const at2HitFrame = 10;
    // ★ at1のみ1.5倍速
    const at1PlaybackSpeed = 1.5;
    const clock = new THREE.Clock();
    // ============================================================
    // 移動・カメラ設定
    // ============================================================
    const maxMoveSpeed = 4.0;
    const jumpMoveSpeedFactor = 0.3;
    const atAttackMoveSpeedFactor = jumpMoveSpeedFactor;
    const atAttackForwardStepDistance = 1.0;
    const rotationSpeed = 10.0;
    const cameraTouchSensitivity = 0.005;
    // ============================================================
    // GLTF Loader
    // ============================================================
    const loader = new THREE.GLTFLoader();
    // ============================================================
    // mg.glb（敵キャラクター）の設定
    // ============================================================
    let mgModel = null;
    let mgMixer = null;
    let mgActions = {};
    let currentMgAction = null;
    let currentMgAttackType = null;
    const mgMoveSpeed = 1.0;
    const mgRotationSpeed = 5.0;
    const mgAttackDistance = 2.0;
    const mgAttackTriggerDistance = 3.0;
    const mgJumpAttack2TriggerDistance = 5.0;
    let mgIsMoving = false;
    let mgIsAttacking = false;
    let mgAttackTriggered = false;
    const mgMoveDirection = new THREE.Vector3();
    const mgTargetPosition = new THREE.Vector3();
    let mgAttackFrameCount = 0;
    // ------------------------------------------------------------
    // mgの「左1」「右1」ボーン
    // ------------------------------------------------------------
    let mgLeftBone1 = null;
    let mgRightBone1 = null;
    const mgFixedBoneAngleLeft =
        THREE.MathUtils.degToRad(130);
    const mgFixedBoneAngleRight =
        THREE.MathUtils.degToRad(-130);
    // ------------------------------------------------------------
    // ct1側のmg接近制限
    // ------------------------------------------------------------
    const ct1MinDistanceToMg = 1.8;
    // ------------------------------------------------------------
    // mg attack1 / attack2 当たり判定
    // ------------------------------------------------------------
    const mgAttackHitboxForwardOffset = 1.2;
    const mgAttackHitboxRadius = 2;
    const ct1HitboxRadius = 0.6;
    const mgAttackHitFrameStart = 23;
    const mgAttackHitFrameEnd = 27;
    const mgAttack2HitFrame = 15;
    let mgAttackHitApplied = false;
    const mgAttackForward = new THREE.Vector3();
    const mgAttackHitPosition = new THREE.Vector3();
    // ------------------------------------------------------------
    // ct1ノックバック
    // ------------------------------------------------------------
    let isCt1Knockback = false;
    let ct1KnockbackElapsed = 0;
    const ct1KnockbackVelocity = new THREE.Vector3();
    const ct1KnockbackDuration = 0.5;
    const ct1KnockbackStrength = 14.0;
    const ct1KnockbackDamping = 3.0;
    // ------------------------------------------------------------
    // ct1ジャンプ攻撃
    // ------------------------------------------------------------
    const ct1ApproxHeight = 1.8;
    const mgHitboxHeightMultiplier = 2.5;
    const mgHitboxHeight =
        ct1ApproxHeight * mgHitboxHeightMultiplier;
    const mgBodyRadius = ct1MinDistanceToMg;
    const ct1AttackHitboxRadius = 1.5;
    const ct1AttackForwardOffset = 0.1;
    const ct1AttackVerticalMargin = 1.0;
    const jumpAttackFrame = 22;
    const mgWarpDistance = 8;
    let jumpAttackHitApplied = false;
    // ------------------------------------------------------------
    // ジャンプ攻撃ヒット演出
    // ------------------------------------------------------------
    const jumpHitImpactFlashColor = 0xffffff;
    const jumpHitImpactFlashDuration = 0.15;
    const jumpHitImpactFlashRadius = 0.5;
    const jumpHitImpactFlashMaxScale = 3.5;
    const jumpHitImpactBurstCount = 45;
    const jumpHitImpactMinSize = 0.12;
    const jumpHitImpactMaxSize = 0.5;
    const jumpHitImpactMinSpeed = 2.5;
    const jumpHitImpactMaxSpeed = 6.5;
    const jumpHitImpactMinDuration = 0.4;
    const jumpHitImpactMaxDuration = 0.8;
    const jumpHitImpactGravity = 3.0;
    const jumpHitImpactColorA =
        new THREE.Color(0xffffff);
    const jumpHitImpactColorB =
        new THREE.Color(0xffe066);
    // ------------------------------------------------------------
    // mg距離ワープ
    // ------------------------------------------------------------
    const mgMaxDistanceFromCt1 = 12.0;
    const mgWarpToFrontDistance = 4.0;
    // ------------------------------------------------------------
    // ノックバックフラッシュ
    // ------------------------------------------------------------
    const knockbackFlashColor = 0xffe200;
    const knockbackFlashDuration = 0.15;
    const knockbackFlashRadius = 0.4;
    const knockbackFlashMaxScale = 3.0;
    // ------------------------------------------------------------
    // attack2衝撃波
    // ------------------------------------------------------------
    const mgAttack2ShockwaveFlashColor = 0xffe200;
    const mgAttack2ShockwaveFlashDuration = 0.22;
    const mgAttack2ShockwaveFlashRadius = 0.9;
    const mgAttack2ShockwaveFlashMaxScale = 6.0;
    // ------------------------------------------------------------
    // attack1 三日月エフェクト
    // ------------------------------------------------------------
    const mgCrescentFrame = 20;
    let mgCrescentSpawned = false;
    const mgAttackShakeFrame = 25;
    let mgAttackShakeSpawned = false;
    const mgCrescentArcSteps = 60;
    const mgCrescentArcAngleRange = Math.PI * 0.55;
    const mgCrescentRadius = 2.7;
    const mgCrescentRadiusVariance = 0.4;
    const mgCrescentHeight = 1.7;
    const mgCrescentCubeMinSize = 0.16;
    const mgCrescentCubeMaxSize = 0.46;
    const mgCrescentOutwardSpeed = 2.6;
    const mgCrescentGravity = 1.0;
    const mgCrescentMinDuration = 0.5;
    const mgCrescentMaxDuration = 0.95;
    const mgCrescentColorWhite =
        new THREE.Color(0xffffff);
    const mgCrescentColorYellow =
        new THREE.Color(0xffe200);
    const mgCrescentFlashDuration = 0.15;
    const mgCrescentFlashRadius = 0.6;
    const mgCrescentFlashMaxScale = 4.0;
    const mgCrescentFlashColor = 0xfff2a0;
    // ============================================================
    // bg.glb
    // ============================================================
    loader.load(
        './bg.glb',
        function (gltf) {
            bgModel = gltf.scene;
            bgModel.scale.set(2, 2, 2);
            bgModel.traverse((child) => {
                if (!child.isMesh) return;
                const oldMaterial = child.material;
                const materials =
                    Array.isArray(oldMaterial)
                        ? oldMaterial
                        : [oldMaterial];
                const newMaterials = materials.map((material) => {
                    return new THREE.MeshBasicMaterial({
                        wireframe: true,
                        transparent: material.transparent,
                        opacity: material.opacity,
                        map: material.map || null,
                        vertexColors: material.vertexColors
                    });
                });
                child.material =
                    Array.isArray(oldMaterial)
                        ? newMaterials
                        : newMaterials[0];
                child.receiveShadow = true;
            });
            scene.add(bgModel);
        },
        undefined,
        function (error) {
            console.error(
                'bg.glb の読み込みエラー:',
                error
            );
        }
    );
    // ============================================================
    // ct1.glb
    // ============================================================
    loader.load(
        './ct1.glb',
        function (gltf) {
            targetModel = gltf.scene;
            targetModel.rotation.y = Math.PI;
            targetModel.traverse((child) => {
                if (!child.isMesh) return;
                const materials =
                    Array.isArray(child.material)
                        ? child.material
                        : [child.material];
                materials.forEach((material) => {
                    if (!material) return;
                    if (material.color) {
                        material.color.multiplyScalar(0.4);
                    }
                    material.metalness = 0.0;
                    material.roughness = 0.95;
                    material.envMapIntensity = 0.08;
                    if (material.map) {
                        material.map.encoding =
                            THREE.sRGBEncoding;
                        material.map.anisotropy =
                            renderer.capabilities.getMaxAnisotropy();
                        material.map.needsUpdate = true;
                    }
                    material.needsUpdate = true;
                });
                child.castShadow = true;
                child.receiveShadow = true;
            });
            scene.add(targetModel);
            const ct1InitialPosition =
                targetModel.position.clone();
            const ct1InitialQuaternion =
                targetModel.quaternion.clone();
            // ====================================================
            // mg.glb
            // ====================================================
            loader.load(
                './mg.glb',
                function (mgGltf) {
                    mgModel = mgGltf.scene;
                    mgModel.scale.set(2.5, 2.5, 2.5);
                    mgModel.traverse((child) => {
                        if (!child.isBone) return;
                        if (child.name === '左1') {
                            mgLeftBone1 = child;
                            console.info(
                                '[mg] 左1ボーンを検出:',
                                child.name
                            );
                        }
                        if (child.name === '右1') {
                            mgRightBone1 = child;
                            console.info(
                                '[mg] 右1ボーンを検出:',
                                child.name
                            );
                        }
                    });
                    if (!mgLeftBone1) {
                        console.warn(
                            '[mg] 左1ボーンが見つかりませんでした。'
                        );
                    }
                    if (!mgRightBone1) {
                        console.warn(
                            '[mg] 右1ボーンが見つかりませんでした。'
                        );
                    }
                    mgModel.traverse((child) => {
                        if (!child.isMesh) return;
                        const mgMaterials =
                            Array.isArray(child.material)
                                ? child.material
                                : [child.material];
                        mgMaterials.forEach((material) => {
                            if (!material) return;
                            if (material.color) {
                                material.color.multiplyScalar(0.45);
                                material.color.multiply(
                                    new THREE.Color(0xfff0a0)
                                );
                            }
                            material.metalness = 0.0;
                            material.roughness = 0.95;
                            material.envMapIntensity = 0.08;
                            material.transparent = true;
                            material.opacity = 0.99;
                            if (material.map) {
                                material.map.encoding =
                                    THREE.sRGBEncoding;
                                material.map.anisotropy =
                                    renderer.capabilities.getMaxAnisotropy();
                                material.map.needsUpdate = true;
                            }
                            material.needsUpdate = true;
                        });
                        child.castShadow = true;
                        child.receiveShadow = true;
                    });
                    const mgForward =
                        new THREE.Vector3(0, 0, 1);
                    mgForward.applyQuaternion(
                        ct1InitialQuaternion
                    );
                    mgForward.y = 0;
                    if (mgForward.lengthSq() > 0) {
                        mgForward.normalize();
                    }
                    mgModel.position
                        .copy(ct1InitialPosition)
                        .addScaledVector(mgForward, 7.0);
                    mgModel.quaternion.copy(
                        ct1InitialQuaternion
                    );
                    const mgRotationOffset =
                        new THREE.Quaternion();
                    mgRotationOffset.setFromAxisAngle(
                        new THREE.Vector3(0, 1, 0),
                        Math.PI
                    );
                    mgModel.quaternion.multiply(
                        mgRotationOffset
                    );
                    scene.add(mgModel);
                    // ================================================
                    // mgアニメーション
                    // ================================================
                    if (
                        mgGltf.animations &&
                        mgGltf.animations.length > 0
                    ) {
                        mgMixer =
                            new THREE.AnimationMixer(mgModel);
                        mgGltf.animations.forEach((clip) => {
                            const action =
                                mgMixer.clipAction(clip);
                            const animationName =
                                clip.name.trim().toLowerCase();
                            if (animationName === 'walk') {
                                mgActions.walk = action;
                                action.setLoop(
                                    THREE.LoopRepeat,
                                    Infinity
                                );
                                action.clampWhenFinished = false;
                            }
                            if (animationName === 'attack1') {
                                mgActions.attack1 = action;
                                action.setLoop(
                                    THREE.LoopOnce,
                                    1
                                );
                                action.clampWhenFinished = true;
                            }
                            if (animationName === 'attack2') {
                                mgActions.attack2 = action;
                                action.setLoop(
                                    THREE.LoopOnce,
                                    1
                                );
                                action.clampWhenFinished = true;
                            }
                        });
                        if (!mgActions.attack1) {
                            console.warn(
                                '[mg] attack1アニメーションが見つかりません。'
                            );
                        }
                        if (!mgActions.attack2) {
                            console.warn(
                                '[mg] attack2アニメーションが見つかりません。'
                            );
                        }
                        mgMixer.addEventListener(
                            'finished',
                            function (event) {
                                if (
                                    event.action === mgActions.attack1 ||
                                    event.action === mgActions.attack2
                                ) {
                                    mgIsAttacking = false;
                                    currentMgAttackType = null;
                                    mgAttackTriggered = false;
                                }
                            }
                        );
                    } else {
                        console.warn(
                            '[mg] アニメーションがありません。'
                        );
                    }
                },
                undefined,
                function (error) {
                    console.error(
                        'mg.glb の読み込みエラー:',
                        error
                    );
                }
            );
            // ====================================================
            // ct1アニメーション
            // ====================================================
            if (
                gltf.animations &&
                gltf.animations.length > 0
            ) {
                mixer =
                    new THREE.AnimationMixer(targetModel);
                gltf.animations.forEach((clip) => {
                    const action =
                        mixer.clipAction(clip);
                    const animationName =
                        clip.name.trim().toLowerCase();
                    if (animationName === 'jump') {
                        actions.jump = action;
                        action.setLoop(
                            THREE.LoopOnce,
                            1
                        );
                        action.clampWhenFinished = true;
                    } else if (animationName === 'at1') {
                        actions.at1 = action;
                        action.setLoop(
                            THREE.LoopOnce,
                            1
                        );
                        action.clampWhenFinished = true;
                        // ★ at1を1.5倍速に設定
                        action.setEffectiveTimeScale(
                            at1PlaybackSpeed
                        );
                    } else if (animationName === 'at2') {
                        actions.at2 = action;
                        action.setLoop(
                            THREE.LoopOnce,
                            1
                        );
                        action.clampWhenFinished = true;
                    } else if (animationName === 'hit') {
                        actions.hit = action;
                        action.setLoop(
                            THREE.LoopOnce,
                            1
                        );
                        action.clampWhenFinished = true;
                    } else {
                        action.setLoop(
                            THREE.LoopRepeat,
                            Infinity
                        );
                        action.clampWhenFinished = false;
                        if (animationName === 'idle') {
                            actions.idle = action;
                        }
                        if (animationName === 'dash') {
                            actions.dash = action;
                        }
                    }
                });
                if (!actions.at2) {
                    console.warn(
                        '[ct1] at2アニメーションが見つかりません。'
                    );
                }
                mixer.addEventListener(
                    'finished',
                    function (event) {
                        if (
                            event.action === actions.jump &&
                            isJumping
                        ) {
                            isJumping = false;
                            updateMovementAnimation();
                        }
                        if (
                            event.action === actions.at1 &&
                            isAttacking1
                        ) {
                            isAttacking1 = false;
                            updateMovementAnimation();
                        }
                        if (
                            event.action === actions.at2 &&
                            isAttacking2
                        ) {
                            isAttacking2 = false;
                            updateMovementAnimation();
                        }
                    }
                );
                setAction('idle');
            }
            // ====================================================
            // ボーン検出
            // ====================================================
            targetModel.traverse((child) => {
                if (child.isBone && !rootBone) {
                    rootBone = child;
                }
                if (
                    !slashSourceNode &&
                    child.isBone &&
                    rightWristBoneNamePattern.test(child.name)
                ) {
                    slashSourceNode = child;
                    console.info(
                        '[斬撃エフェクト] 右手首らしき名前のボーンを検出:',
                        child.name
                    );
                }
            });
            if (!slashSourceNode) {
                slashSourceNode = rootBone;
                console.warn(
                    '[斬撃エフェクト] 右手首らしき名前のボーンが見つからなかったため、rootBoneにフォールバックしました。'
                );
            }
            if (rootBone) {
                targetModel.updateMatrixWorld(true);
                rootBone.getWorldPosition(
                    rootBoneWorldPosition
                );
                rootBoneRestY =
                    rootBoneWorldPosition.y;
            }
            updateCameraPosition();
        },
        undefined,
        function (error) {
            console.error(
                'ct1.glb の読み込みエラー:',
                error
            );
        }
    );
    // ============================================================
    // ct1 アニメーション切り替え
    // ============================================================
    function setAction(name) {
        if (!mixer || !actions[name]) return;
        const nextAction = actions[name];
        if (currentAction !== nextAction) {
            if (currentAction) {
                currentAction.fadeOut(0.2);
            }
            nextAction.reset().play();
            // ★ at1は常に1.5倍速を維持
            if (name === 'at1') {
                nextAction.setEffectiveTimeScale(
                    at1PlaybackSpeed
                );
            }
            currentAction = nextAction;
        }
    }
    // ============================================================
    // mg アニメーション切り替え
    // ============================================================
    function setMgAction(name) {
        if (!mgMixer || !mgActions[name]) return;
        const nextAction = mgActions[name];
        if (currentMgAction !== nextAction) {
            if (currentMgAction) {
                currentMgAction.fadeOut(0.2);
            }
            nextAction.reset().play();
            currentMgAction = nextAction;
        }
    }
    function stopMgAnimation() {
        if (!currentMgAction) return;
        currentMgAction.fadeOut(0.2);
        currentMgAction = null;
    }
    // ============================================================
    // mg attack1
    // ============================================================
    function playMgAttack1() {
        if (!mgMixer || !mgActions.attack1) {
            console.warn(
                '[mg] attack1を再生できません。'
            );
            return;
        }
        if (mgIsAttacking) return;
        mgIsAttacking = true;
        mgIsMoving = false;
        currentMgAttackType = 'attack1';
        mgAttackHitApplied = false;
        mgCrescentSpawned = false;
        mgAttackShakeSpawned = false;
        mgAttackFrameCount = 0;
        if (currentMgAction) {
            currentMgAction.fadeOut(0.1);
        }
        const attackAction =
            mgActions.attack1;
        attackAction
            .reset()
            .setLoop(THREE.LoopOnce, 1);
        attackAction.clampWhenFinished = true;
        attackAction
            .fadeIn(0.1)
            .play();
        currentMgAction = attackAction;
    }
    // ============================================================
    // mg attack2
    // ============================================================
    function playMgAttack2() {
        if (!mgMixer || !mgActions.attack2) {
            console.warn(
                '[mg] attack2を再生できません。attack1で代用します。'
            );
            playMgAttack1();
            return;
        }
        if (mgIsAttacking) return;
        mgIsAttacking = true;
        mgIsMoving = false;
        currentMgAttackType = 'attack2';
        mgAttackHitApplied = false;
        mgCrescentSpawned = false;
        mgAttackShakeSpawned = false;
        mgAttackFrameCount = 0;
        if (currentMgAction) {
            currentMgAction.fadeOut(0.1);
        }
        const attackAction =
            mgActions.attack2;
        attackAction
            .reset()
            .setLoop(THREE.LoopOnce, 1);
        attackAction.clampWhenFinished = true;
        attackAction
            .fadeIn(0.1)
            .play();
        currentMgAction = attackAction;
    }
    // ============================================================
    // mg 移動・攻撃
    // ============================================================
    function updateMgMovement(delta) {
        if (!mgModel || !targetModel) return;
        mgTargetPosition.copy(
            targetModel.position
        );
        mgMoveDirection.subVectors(
            mgTargetPosition,
            mgModel.position
        );
        mgMoveDirection.y = 0;
        const distance =
            mgMoveDirection.length();
        if (
            !mgAttackTriggered &&
            !mgIsAttacking &&
            distance <= mgAttackTriggerDistance
        ) {
            mgAttackTriggered = true;
            playMgAttack1();
        }
        if (mgIsAttacking) {
            mgIsMoving = false;
            return;
        }
        if (distance <= mgAttackDistance) {
            mgIsMoving = false;
            stopMgAnimation();
            return;
        }
        if (distance > mgAttackTriggerDistance) {
            mgAttackTriggered = false;
        }
        mgIsMoving = true;
        mgMoveDirection.normalize();
        const allowedMoveAmount =
            Math.max(
                distance - mgAttackDistance,
                0
            );
        const moveAmount =
            mgMoveSpeed * delta;
        if (moveAmount >= allowedMoveAmount) {
            mgModel.position.addScaledVector(
                mgMoveDirection,
                allowedMoveAmount
            );
        } else {
            mgModel.position.addScaledVector(
                mgMoveDirection,
                moveAmount
            );
        }
        const targetAngle =
            Math.atan2(
                mgMoveDirection.x,
                mgMoveDirection.z
            );
        const targetQuaternion =
            new THREE.Quaternion();
        targetQuaternion.setFromAxisAngle(
            new THREE.Vector3(0, 1, 0),
            targetAngle
        );
        mgModel.quaternion.slerp(
            targetQuaternion,
            Math.min(
                mgRotationSpeed * delta,
                1
            )
        );
        if (mgActions.walk) {
            setMgAction('walk');
        }
    }
    // ============================================================
    // ct1距離制限
    // ============================================================
    function clampCt1DistanceFromMg() {
        if (!targetModel || !mgModel) return;
        const dx =
            targetModel.position.x -
            mgModel.position.x;
        const dz =
            targetModel.position.z -
            mgModel.position.z;
        const distance =
            Math.hypot(dx, dz);
        if (
            distance >= ct1MinDistanceToMg
        ) {
            return;
        }
        if (distance > 0.0001) {
            const pushScale =
                ct1MinDistanceToMg /
                distance;
            targetModel.position.x =
                mgModel.position.x +
                dx * pushScale;
            targetModel.position.z =
                mgModel.position.z +
                dz * pushScale;
        } else {
            targetModel.position.x =
                mgModel.position.x +
                ct1MinDistanceToMg;
            targetModel.position.z =
                mgModel.position.z;
        }
    }
    // ============================================================
    // mg攻撃ヒット判定
    // ============================================================
    function updateMgAttackHit(delta) {
        if (!mgModel || !targetModel) return;
        if (!mgIsAttacking) return;
        if (mgAttackHitApplied) return;
        let hitFrameActive = false;
        if (
            currentMgAttackType === 'attack1'
        ) {
            hitFrameActive =
                mgAttackFrameCount >=
                mgAttackHitFrameStart &&
                mgAttackFrameCount <=
                mgAttackHitFrameEnd;
        } else if (
            currentMgAttackType === 'attack2'
        ) {
            hitFrameActive =
                mgAttackFrameCount ===
                mgAttack2HitFrame;
        }
        if (!hitFrameActive) return;
        if (
            isDashing ||
            !targetModel.visible
        ) {
            return;
        }
        mgAttackForward.set(0, 0, 1);
        mgAttackForward.applyQuaternion(
            mgModel.quaternion
        );
        mgAttackForward.y = 0;
        if (mgAttackForward.lengthSq() > 0) {
            mgAttackForward.normalize();
        }
        mgAttackHitPosition
            .copy(mgModel.position)
            .addScaledVector(
                mgAttackForward,
                mgAttackHitboxForwardOffset
            );
        const dx =
            targetModel.position.x -
            mgAttackHitPosition.x;
        const dz =
            targetModel.position.z -
            mgAttackHitPosition.z;
        const distance =
            Math.hypot(dx, dz);
        if (
            distance <=
            mgAttackHitboxRadius +
            ct1HitboxRadius
        ) {
            mgAttackHitApplied = true;
            applyCt1Knockback(dx, dz);
            const flashPosition =
                mgAttackHitPosition.clone();
            flashPosition.y += 1.0;
            if (
                currentMgAttackType ===
                'attack2'
            ) {
                spawnFlashParticle(
                    flashPosition,
                    {
                        radius:
                            mgAttack2ShockwaveFlashRadius,
                        duration:
                            mgAttack2ShockwaveFlashDuration,
                        maxScale:
                            mgAttack2ShockwaveFlashMaxScale,
                        startOpacity: 1.0,
                        color:
                            mgAttack2ShockwaveFlashColor
                    }
                );
                triggerCameraShake();
            } else {
                spawnFlashParticle(
                    flashPosition,
                    {
                        radius:
                            knockbackFlashRadius,
                        duration:
                            knockbackFlashDuration,
                        maxScale:
                            knockbackFlashMaxScale,
                        startOpacity: 1.0,
                        color:
                            knockbackFlashColor
                    }
                );
            }
        }
    }
    // ============================================================
    // ct1ノックバック
    // ============================================================
    function applyCt1Knockback(
        dirX,
        dirZ
    ) {
        const knockDir =
            new THREE.Vector3(
                dirX,
                0,
                dirZ
            );
        if (knockDir.lengthSq() > 0) {
            knockDir.normalize();
        }
        if (isDashing) {
            isDashing = false;
            targetModel.visible = true;
        }
        if (isJumping) {
            isJumping = false;
        }
        if (isAttacking1) {
            isAttacking1 = false;
        }
        if (isAttacking2) {
            isAttacking2 = false;
        }
        cancelAtForwardSteps();
        if (actions.hit) {
            setAction('hit');
        } else {
            setAction('idle');
        }
        ct1KnockbackVelocity
            .copy(knockDir)
            .multiplyScalar(
                ct1KnockbackStrength
            );
        ct1KnockbackElapsed = 0;
        isCt1Knockback = true;
    }
    function updateCt1Knockback(delta) {
        if (
            !isCt1Knockback ||
            !targetModel
        ) {
            return;
        }
        if (isDashing) {
            isCt1Knockback = false;
            ct1KnockbackVelocity.set(
                0,
                0,
                0
            );
            return;
        }
        ct1KnockbackElapsed += delta;
        targetModel.position.addScaledVector(
            ct1KnockbackVelocity,
            delta
        );
        const damping =
            Math.max(
                0,
                1 -
                ct1KnockbackDamping *
                delta
            );
        ct1KnockbackVelocity.multiplyScalar(
            damping
        );
        if (
            ct1KnockbackElapsed >=
            ct1KnockbackDuration
        ) {
            isCt1Knockback = false;
            ct1KnockbackVelocity.set(
                0,
                0,
                0
            );
            updateMovementAnimation();
        }
    }
    // ============================================================
    // ct1ジャンプ攻撃
    // ============================================================
    function updateCt1JumpAttackHit() {
        if (!mgModel || !targetModel) return;
        if (!isJumping) return;
        if (jumpAttackHitApplied) return;
        if (
            jumpFrameCount !==
            jumpAttackFrame
        ) {
            return;
        }
        const forward =
            new THREE.Vector3(0, 0, 1);
        forward.applyQuaternion(
            targetModel.quaternion
        );
        forward.y = 0;
        if (forward.lengthSq() > 0) {
            forward.normalize();
        }
        const attackPosition =
            targetModel.position.clone();
        attackPosition.y += jumpHeightOffset;
        attackPosition.addScaledVector(
            forward,
            ct1AttackForwardOffset
        );
        const dx =
            attackPosition.x -
            mgModel.position.x;
        const dz =
            attackPosition.z -
            mgModel.position.z;
        const horizontalDistance =
            Math.hypot(dx, dz);
        if (
            horizontalDistance >
            ct1AttackHitboxRadius +
            mgBodyRadius
        ) {
            return;
        }
        const relativeHeight =
            attackPosition.y -
            mgModel.position.y;
        if (
            relativeHeight <
            -ct1AttackVerticalMargin ||
            relativeHeight >
            mgHitboxHeight +
            ct1AttackVerticalMargin
        ) {
            return;
        }
        jumpAttackHitApplied = true;
        spawnJumpHitImpactEffect(
            attackPosition
        );
        warpMgAwayFromCt1();
    }
    // ============================================================
    // at1/at2 前進ステップ（滑らかな移動）
    // ============================================================
    function startAtForwardStep(kind, distance) {
        if (!targetModel) return;
        const direction =
            kind === 'at1'
                ? at1StepDirection
                : at2StepDirection;
        direction.set(0, 0, 1);
        direction.applyQuaternion(
            targetModel.quaternion
        );
        direction.y = 0;
        if (direction.lengthSq() > 0) {
            direction.normalize();
        }
        if (kind === 'at1') {
            at1StepTotalDistance = distance;
            at1StepMovedDistance = 0;
            at1StepElapsed = 0;
            at1StepActive = true;
        } else {
            at2StepTotalDistance = distance;
            at2StepMovedDistance = 0;
            at2StepElapsed = 0;
            at2StepActive = true;
        }
    }
    // イーズアウトで加速の少ない自然な前進にする
    function easeOutQuad(t) {
        return 1 - (1 - t) * (1 - t);
    }
    function updateAtForwardSteps(delta) {
        if (!targetModel) return;
        if (at1StepActive) {
            at1StepElapsed += delta;
            const t =
                Math.min(
                    at1StepElapsed /
                        at1StepDuration,
                    1
                );
            const targetDistance =
                at1StepTotalDistance *
                easeOutQuad(t);
            const deltaDistance =
                targetDistance -
                at1StepMovedDistance;
            targetModel.position.addScaledVector(
                at1StepDirection,
                deltaDistance
            );
            at1StepMovedDistance =
                targetDistance;
            if (t >= 1) {
                at1StepActive = false;
            }
        }
        if (at2StepActive) {
            at2StepElapsed += delta;
            const t =
                Math.min(
                    at2StepElapsed /
                        at2StepDuration,
                    1
                );
            const targetDistance =
                at2StepTotalDistance *
                easeOutQuad(t);
            const deltaDistance =
                targetDistance -
                at2StepMovedDistance;
            targetModel.position.addScaledVector(
                at2StepDirection,
                deltaDistance
            );
            at2StepMovedDistance =
                targetDistance;
            if (t >= 1) {
                at2StepActive = false;
            }
        }
    }
    function cancelAtForwardSteps() {
        at1StepActive = false;
        at2StepActive = false;
    }
    // ============================================================
    // ct1 AT攻撃ヒット判定
    // ============================================================
    function updateCt1At1Hit() {
        if (!mgModel || !targetModel) return;
        if (!isAttacking1) return;
        if (at1HitApplied) return;
        const hitFrameActive =
            at1FrameCount >= at1HitFrameStart &&
            at1FrameCount <= at1HitFrameEnd;
        if (!hitFrameActive) return;
        const forward =
            new THREE.Vector3(0, 0, 1);
        forward.applyQuaternion(
            targetModel.quaternion
        );
        forward.y = 0;
        if (forward.lengthSq() > 0) {
            forward.normalize();
        }
        const attackPosition =
            targetModel.position.clone();
        attackPosition.y +=
            targetHeightOffset * 0.5;
        attackPosition.addScaledVector(
            forward,
            ct1AttackForwardOffset
        );
        const dx =
            attackPosition.x -
            mgModel.position.x;
        const dz =
            attackPosition.z -
            mgModel.position.z;
        const horizontalDistance =
            Math.hypot(dx, dz);
        if (
            horizontalDistance >
            ct1AttackHitboxRadius +
            mgBodyRadius
        ) {
            return;
        }
        const relativeHeight =
            attackPosition.y -
            mgModel.position.y;
        if (
            relativeHeight <
            -ct1AttackVerticalMargin ||
            relativeHeight >
            mgHitboxHeight +
            ct1AttackVerticalMargin
        ) {
            return;
        }
        at1HitApplied = true;
        spawnJumpHitImpactEffect(
            attackPosition
        );
        warpMgAwayFromCt1();
    }
    // ============================================================
    // ct1 AT2攻撃ヒット判定
    // ============================================================
    function updateCt1At2Hit() {
        if (!mgModel || !targetModel) return;
        if (!isAttacking2) return;
        if (at2HitApplied) return;
        if (at2FrameCount !== at2HitFrame) return;

        const forward =
            new THREE.Vector3(0, 0, 1);
        forward.applyQuaternion(
            targetModel.quaternion
        );
        forward.y = 0;
        if (forward.lengthSq() > 0) {
            forward.normalize();
        }

        const attackPosition =
            targetModel.position.clone();
        attackPosition.y +=
            targetHeightOffset * 0.5;
        attackPosition.addScaledVector(
            forward,
            ct1AttackForwardOffset
        );

        const dx =
            attackPosition.x -
            mgModel.position.x;
        const dz =
            attackPosition.z -
            mgModel.position.z;
        const horizontalDistance =
            Math.hypot(dx, dz);

        if (
            horizontalDistance >
            ct1AttackHitboxRadius +
            mgBodyRadius
        ) {
            return;
        }

        const relativeHeight =
            attackPosition.y -
            mgModel.position.y;
        if (
            relativeHeight <
            -ct1AttackVerticalMargin ||
            relativeHeight >
            mgHitboxHeight +
            ct1AttackVerticalMargin
        ) {
            return;
        }

        at2HitApplied = true;
        spawnJumpHitImpactEffect(
            attackPosition
        );
        warpMgAwayFromCt1();
    }
    // ============================================================
    // ジャンプ攻撃ヒット演出
    // ============================================================
    function spawnJumpHitImpactEffect(
        attackPosition
    ) {
        if (!mgModel) return;
        const impactDirection =
            new THREE.Vector3(
                attackPosition.x -
                mgModel.position.x,
                0,
                attackPosition.z -
                mgModel.position.z
            );
        if (
            impactDirection.lengthSq() >
            0.0001
        ) {
            impactDirection.normalize();
        } else {
            impactDirection.set(
                0,
                0,
                1
            );
        }
        const impactPosition =
            mgModel.position.clone()
                .addScaledVector(
                    impactDirection,
                    mgBodyRadius
                );
        impactPosition.y =
            THREE.MathUtils.clamp(
                attackPosition.y,
                mgModel.position.y,
                mgModel.position.y +
                mgHitboxHeight
            );
        spawnFlashParticle(
            impactPosition,
            {
                radius:
                    jumpHitImpactFlashRadius,
                duration:
                    jumpHitImpactFlashDuration,
                maxScale:
                    jumpHitImpactFlashMaxScale,
                startOpacity: 1.0,
                color:
                    jumpHitImpactFlashColor
            }
        );
        spawnCubeBurst(
            impactPosition,
            {
                count:
                    jumpHitImpactBurstCount,
                minSize:
                    jumpHitImpactMinSize,
                maxSize:
                    jumpHitImpactMaxSize,
                minSpeed:
                    jumpHitImpactMinSpeed,
                maxSpeed:
                    jumpHitImpactMaxSpeed,
                minDuration:
                    jumpHitImpactMinDuration,
                maxDuration:
                    jumpHitImpactMaxDuration,
                gravity:
                    jumpHitImpactGravity,
                colorA:
                    jumpHitImpactColorA,
                colorB:
                    jumpHitImpactColorB,
                elevationMin: -0.1,
                elevationMax: 1.0,
                spawnSpread: 0.3
            }
        );
    }
    // ============================================================
    // mgワープ
    // ============================================================
    function warpMgAwayFromCt1() {
        if (!mgModel || !targetModel) return;
        const dx =
            mgModel.position.x -
            targetModel.position.x;
        const dz =
            mgModel.position.z -
            targetModel.position.z;
        const warpDirection =
            new THREE.Vector3(
                dx,
                0,
                dz
            );
        if (
            warpDirection.lengthSq() <
            0.0001
        ) {
            warpDirection
                .set(0, 0, 1)
                .applyQuaternion(
                    targetModel.quaternion
                );
            warpDirection.y = 0;
        }
        if (warpDirection.lengthSq() > 0) {
            warpDirection.normalize();
        }
        mgModel.position
            .copy(targetModel.position)
            .addScaledVector(
                warpDirection,
                mgWarpDistance
            );
        const targetAngle =
            Math.atan2(
                -warpDirection.x,
                -warpDirection.z
            );
        mgModel.quaternion.setFromAxisAngle(
            new THREE.Vector3(0, 1, 0),
            targetAngle
        );
        mgIsAttacking = false;
        mgAttackTriggered = false;
        currentMgAttackType = null;
        stopMgAnimation();
        const flashPosition =
            mgModel.position.clone();
        flashPosition.y += 1.2;
        spawnFlashParticle(
            flashPosition,
            {
                radius:
                    knockbackFlashRadius,
                duration:
                    knockbackFlashDuration,
                maxScale:
                    knockbackFlashMaxScale * 1.3,
                startOpacity: 1.0,
                color: 0x66ccff
            }
        );
    }
    // ============================================================
    // mg距離ワープ
    // ============================================================
    function updateMgDistanceWarp() {
        if (!mgModel || !targetModel) return;
        if (mgIsAttacking) return;
        const dx =
            mgModel.position.x -
            targetModel.position.x;
        const dz =
            mgModel.position.z -
            targetModel.position.z;
        const distance =
            Math.hypot(dx, dz);
        if (
            distance <=
            mgMaxDistanceFromCt1
        ) {
            return;
        }
        warpMgInFrontOfCt1();
    }
    function warpMgInFrontOfCt1() {
        if (!mgModel || !targetModel) return;
        const forward =
            new THREE.Vector3(0, 0, 1);
        forward.applyQuaternion(
            targetModel.quaternion
        );
        forward.y = 0;
        if (forward.lengthSq() > 0) {
            forward.normalize();
        }
        mgModel.position
            .copy(targetModel.position)
            .addScaledVector(
                forward,
                mgWarpToFrontDistance
            );
        const targetAngle =
            Math.atan2(
                -forward.x,
                -forward.z
            );
        mgModel.quaternion.setFromAxisAngle(
            new THREE.Vector3(0, 1, 0),
            targetAngle
        );

        mgAttackTriggered = false;
        currentMgAttackType = null;

            mgModel.position.clone();

            flashPosition,
            {
                radius:
                    knockbackFlashRadius,
                duration:
                    knockbackFlashDuration,
                maxScale:
                    knockbackFlashMaxScale * 1.3,

                color: 0x66ccff
            }
        );

    // ============================================================
    // パーティクル
    // ============================================================
    const particles = [];
    function randomRange(min, max) {
        return min +
            Math.random() *
            (max - min);
    }
    function spawnFlashParticle(
        position,
        options
    ) {
        const geometry =
            new THREE.SphereGeometry(
                options.radius,
                12,
                12
            );
        const material =
            new THREE.MeshBasicMaterial({
                color: options.color,
                transparent: true,
                opacity:
                    options.startOpacity,
                depthWrite: false,
                blending:
                    THREE.AdditiveBlending
            });
        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );
        mesh.position.copy(position);
        scene.add(mesh);
        particles.push({
            kind: 'flash',
            mesh: mesh,
            elapsed: 0,
            duration:
                options.duration,
            maxScale:
                options.maxScale,
            startOpacity:
                options.startOpacity
        });
    }
    function spawnCubeBurst(
        position,
        params
    ) {
        const spawnSpread =
            params.spawnSpread || 0;
        for (
            let i = 0;
            i < params.count;
            i++
        ) {
            const size =
                randomRange(
                    params.minSize,
                    params.maxSize
                );
            const geometry =
                new THREE.BoxGeometry(
                    size,
                    size,
                    size *
                    randomRange(

    function updateParticles(delta) {
        for (
            let i = particles.length - 1;
            i >= 0;
            i--
        ) {
            const effect =
                particles[i];
            effect.elapsed += delta;
            const t =
                Math.min(
                    effect.elapsed /
                        effect.duration,
                    1
                );
            if (
                effect.kind === 'flash'
            ) {
                const scale =
                    1 +
                    t *
                    (
                        effect.maxScale -
                        1
                    );
                effect.mesh.scale.set(
                    scale,
                    scale,
                    scale
                );
                effect.mesh.material.opacity =
                    effect.startOpacity *
                    (1 - t);
            } else {
                effect.velocity.y -=
                    effect.gravity *
                    delta;
                effect.mesh.position
                    .addScaledVector(
                        effect.velocity,
                        delta
                    );
                effect.mesh.rotation.x +=
                    effect.angularVelocity.x *
                    delta;
                effect.mesh.rotation.y +=
                    effect.angularVelocity.y *
                    delta;
                effect.mesh.rotation.z +=
                    effect.angularVelocity.z *
                    delta;
                const scale =
                    effect.startScale *
                    (1 - t * 0.5);
                effect.mesh.scale.set(
                    scale,
                    scale,
                    scale
                );
                effect.mesh.material.opacity =
                    effect.startOpacity *
                    (1 - t);
            }
            if (t >= 1) {
                scene.remove(
                    effect.mesh
                );
                effect.mesh.geometry.dispose();
                effect.mesh.material.dispose();
                particles.splice(i, 1);
            }
        }
    }

    function applyCameraShake(delta) {
        if (
            cameraShakeElapsed === null
        ) {
            return;

        cameraShakeElapsed += delta;
        const t =
            cameraShakeElapsed /
            cameraShakeDuration;
        if (t >= 1) {
            cameraShakeElapsed = null;
            return;
        }
        const decay = 1 - t;
        const magnitude =
            cameraShakeMagnitude *
            decay *
            decay;
        camera.position.x +=
            (
                Math.random() * 2 - 1
            ) *
            magnitude;
        camera.position.y +=
            (
                Math.random() * 2 - 1
            ) *
            magnitude;
        camera.position.z +=
