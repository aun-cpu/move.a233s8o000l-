<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Analog Stick & Camera Control</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #joystick-container {
            position: absolute;
            left: 30px;
            bottom: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-base {
            position: absolute;
            left: 0;
            top: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-stick {
            position: absolute;
            left: 52px;
            top: 52px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.65);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transform: translate(0px, 0px);
        }

        #jump-button {
            position: absolute;
            right: 35px;
            bottom: 75px;
            width: 90px;
            height: 90px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #jump-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }

        #dash-button {
            position: absolute;
            right: 20px;
            bottom: 15px;
            width: 56px;
            height: 56px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #dash-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="joystick-container">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>

    <div id="jump-button">↑</div>

    <div id="dash-button">⏫</div>

    <script>

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.outputEncoding =
            THREE.sRGBEncoding;

        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;

        renderer.toneMappingExposure = 1.15;

        document
            .getElementById('canvas-container')
            .appendChild(renderer.domElement);


        scene.add(
            new THREE.AmbientLight(
                0xffffff,
                1.2
            )
        );


        const dirLight =
            new THREE.DirectionalLight(
                0xffffff,
                3
            );

        dirLight.position.set(
            5,
            10,
            7.5
        );

        scene.add(dirLight);


        const fillLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );

        fillLight.position.set(
            -5,
            5,
            -7
        );

        scene.add(fillLight);


        const pmremGenerator =
            new THREE.PMREMGenerator(renderer);


        const environmentScene =
            new THREE.Scene();

        environmentScene.background =
            new THREE.Color(0x202020);


        const environmentLight =
            new THREE.HemisphereLight(
                0xffffff,
                0x222222,
                2
            );

        environmentScene.add(
            environmentLight
        );


        const environmentTarget =
            pmremGenerator.fromScene(
                environmentScene
            );

        scene.environment =
            environmentTarget.texture;


        const targetHeightOffset = 1.5;

        const cameraDistance = 1.6;


        let cameraSpherical =
            new THREE.Spherical(
                cameraDistance,
                Math.PI / 2.2,
                0
            );


        const minPolarAngle = 0.1;

        const maxPolarAngle =
            Math.PI / 2 - 0.05;


        let targetModel = null;

        let bgModel = null;

        let mgModel = null;

        let mixer = null;

        let mgMixer = null;


        let actions = {};

        let mgActions = {};

        let currentAction = null;

        let currentMgAction = null;


        let rootBone = null;


        let slashSourceNode = null;


        const rightWristBoneNamePattern =
            /(right.*hand|right.*wrist|r[_\.]?hand\b|hand[_\.]?r\b|wrist.*r\b|r.*wrist|righthand|rightwrist|右手首|右手首関節|みぎてくび)/i;


        let rootBoneRestY = 0;

        let jumpHeightOffset = 0;


        const rootBoneWorldPosition =
            new THREE.Vector3();


        let isJumping = false;

        let jumpFrameCount = 0;


        const jumpTransitionFrame = 25;

        const animationFPS = 30;

        const shockwaveFrame = 22;

        let jumpShockwaveSpawned = false;


        const clock =
            new THREE.Clock();


        const maxMoveSpeed = 4.0;

        const jumpMoveSpeedFactor = 0.3;

        const rotationSpeed = 10.0;

        const cameraTouchSensitivity = 0.005;


        const loader =
            new THREE.GLTFLoader();


        // ============================================================
        // mg.glb 移動・攻撃設定
        // ============================================================

        const mgMoveSpeed = 1.0;

        const mgStopDistance = 0.15;

        const mgRotationSpeed = 5.0;

        // ct1からこの距離以内に入ったらattack1
        const mgAttackDistance = 3.0;

        let mgIsMoving = false;

        let mgIsAttacking = false;

        // 3以内に入った瞬間を一度だけ検出するためのフラグ
        let mgAttackTriggered = false;


        const mgMoveDirection =
            new THREE.Vector3();

        const mgTargetPosition =
            new THREE.Vector3();

        const mgCurrentDirection =
            new THREE.Vector3();


        // ============================================================
        // bg.glb
        // ============================================================

        loader.load(
            './bg.glb',

            function (gltf) {

                bgModel =
                    gltf.scene;

                bgModel.scale.set(
                    2,
                    2,
                    2
                );


                bgModel.traverse(
                    (child) => {

                        if (!child.isMesh) return;


                        const oldMaterial =
                            child.material;


                        const materials =
                            Array.isArray(oldMaterial)
                                ? oldMaterial
                                : [oldMaterial];


                        const newMaterials =
                            materials.map(
                                (material) => {

                                    return new THREE.MeshBasicMaterial({

                                        wireframe: true,

                                        transparent:
                                            material.transparent,

                                        opacity:
                                            material.opacity,

                                        map:
                                            material.map || null,

                                        vertexColors:
                                            material.vertexColors

                                    });

                                }
                            );


                        child.material =
                            Array.isArray(oldMaterial)
                                ? newMaterials
                                : newMaterials[0];

                    }
                );


                scene.add(
                    bgModel
                );

            },

            undefined,

            function (error) {

                console.error(
                    'bg.glb の読み込みエラー:',
                    error
                );

            }
        );


        // ============================================================
        // ct1.glb
        // ============================================================

        loader.load(
            './ct1.glb',

            function (gltf) {

                targetModel =
                    gltf.scene;


                targetModel.rotation.y =
                    Math.PI;


                targetModel.traverse(
                    (child) => {

                        if (!child.isMesh) return;


                        const materials =
                            Array.isArray(child.material)
                                ? child.material
                                : [child.material];


                        materials.forEach(
                            (material) => {

                                if (!material) return;


                                if (material.color) {

                                    material.color
                                        .multiplyScalar(0.55);

                                }


                                material.metalness =
                                    0.05;

                                material.roughness =
                                    0.85;

                                material.envMapIntensity =
                                    0.15;


                                if (material.map) {

                                    material.map.encoding =
                                        THREE.sRGBEncoding;

                                    material.map.needsUpdate =
                                        true;

                                }


                                material.needsUpdate =
                                    true;

                            }
                        );

                    }
                );


                scene.add(
                    targetModel
                );


                const ct1InitialPosition =
                    targetModel.position.clone();


                const ct1InitialQuaternion =
                    targetModel.quaternion.clone();


                // ====================================================
                // mg.glb
                // ====================================================

                loader.load(
                    './mg.glb',

                    function (mgGltf) {

                        mgModel =
                            mgGltf.scene;


                        // ====================================================
                        // mg.glbを2.5倍
                        // ====================================================

                        mgModel.scale.set(
                            2.5,
                            2.5,
                            2.5
                        );


                        // ====================================================
                        // 初期位置
                        // ct1から7.0離れた位置
                        // ====================================================

                        const mgForward =
                            new THREE.Vector3(
                                0,
                                0,
                                1
                            );


                        mgForward.applyQuaternion(
                            ct1InitialQuaternion
                        );


                        mgForward.y = 0;


                        if (
                            mgForward.lengthSq() > 0
                        ) {

                            mgForward.normalize();

                        }


                        mgModel.position
                            .copy(
                                ct1InitialPosition
                            )
                            .addScaledVector(
                                mgForward,
                                7.0
                            );


                        mgModel.quaternion.copy(
                            ct1InitialQuaternion
                        );


                        const mgRotationOffset =
                            new THREE.Quaternion();


                        mgRotationOffset.setFromAxisAngle(
                            new THREE.Vector3(
                                0,
                                1,
                                0
                            ),
                            Math.PI
                        );


                        mgModel.quaternion.multiply(
                            mgRotationOffset
                        );


                        scene.add(
                            mgModel
                        );


                        // ====================================================
                        // mg.glbのアニメーション
                        // ====================================================

                        if (
                            mgGltf.animations &&
                            mgGltf.animations.length > 0
                        ) {

                            mgMixer =
                                new THREE.AnimationMixer(
                                    mgModel
                                );


                            mgGltf.animations.forEach(
                                (clip) => {

                                    const action =
                                        mgMixer.clipAction(
                                            clip
                                        );


                                    const animationName =
                                        clip.name
                                            .trim()
                                            .toLowerCase();


                                    if (
                                        animationName ===
                                        'walk'
                                    ) {

                                        mgActions.walk =
                                            action;


                                        action.setLoop(
                                            THREE.LoopRepeat,
                                            Infinity
                                        );


                                        action.clampWhenFinished =
                                            false;


                                        console.info(
                                            '[mg] walkアニメーションを検出:',
                                            clip.name
                                        );

                                    }


                                    // ====================================================
                                    // attack1を検出
                                    // ====================================================

                                    if (
                                        animationName ===
                                        'attack1'
                                    ) {

                                        mgActions.attack1 =
                                            action;


                                        action.setLoop(
                                            THREE.LoopOnce,
                                            1
                                        );


                                        action.clampWhenFinished =
                                            true;


                                        console.info(
                                            '[mg] attack1アニメーションを検出:',
                                            clip.name
                                        );

                                    }

                                }
                            );


                            console.info(
                                '[mg] アニメーション数:',
                                mgGltf.animations.length
                            );


                            if (
                                !mgActions.attack1
                            ) {

                                console.warn(
                                    '[mg] attack1アニメーションが見つかりません。'
                                );

                            }


                            // ====================================================
                            // mg attack1終了イベント
                            // ====================================================

                            mgMixer.addEventListener(
                                'finished',
                                function (event) {

                                    if (
                                        event.action ===
                                        mgActions.attack1
                                    ) {

                                        mgIsAttacking =
                                            false;

                                        // 攻撃終了時点で3以内なら
                                        // attack1を再発動しない
                                        if (
                                            mgModel &&
                                            targetModel
                                        ) {

                                            const dx =
                                                targetModel.position.x -
                                                mgModel.position.x;

                                            const dz =
                                                targetModel.position.z -
                                                mgModel.position.z;

                                            const distance =
                                                Math.hypot(
                                                    dx,
                                                    dz
                                                );


                                            if (
                                                distance >
                                                mgAttackDistance
                                            ) {

                                                mgAttackTriggered =
                                                    false;

                                            }

                                        }


                                        console.info(
                                            '[mg] attack1終了'
                                        );

                                    }

                                }
                            );

                        } else {

                            console.warn(
                                '[mg] アニメーションがありません。'
                            );

                        }

                    },

                    undefined,

                    function (error) {

                        console.error(
                            'mg.glb の読み込みエラー:',
                            error
                        );

                    }
                );


                // ====================================================
                // ct1アニメーション
                // ====================================================

                if (
                    gltf.animations &&
                    gltf.animations.length > 0
                ) {

                    mixer =
                        new THREE.AnimationMixer(
                            targetModel
                        );


                    gltf.animations.forEach(
                        (clip) => {

                            const action =
                                mixer.clipAction(
                                    clip
                                );


                            const animationName =
                                clip.name
                                    .trim()
                                    .toLowerCase();


                            if (
                                animationName ===
                                'jump'
                            ) {

                                actions.jump =
                                    action;


                                action.setLoop(
                                    THREE.LoopOnce,
                                    1
                                );


                                action.clampWhenFinished =
                                    true;

                            } else {

                                action.setLoop(
                                    THREE.LoopRepeat,
                                    Infinity
                                );


                                action.clampWhenFinished =
                                    false;


                                if (
                                    animationName ===
                                    'idle'
                                ) {

                                    actions.idle =
                                        action;

                                }


                                if (
                                    animationName ===
                                    'dash'
                                ) {

                                    actions.dash =
                                        action;

                                }

                            }

                        }
                    );


                    mixer.addEventListener(
                        'finished',
                        function (event) {

                            if (
                                event.action ===
                                    actions.jump &&
                                isJumping
                            ) {

                                isJumping =
                                    false;

                                updateMovementAnimation();

                            }

                        }
                    );


                    setAction(
                        'idle'
                    );

                }


                // ====================================================
                // ボーン検出
                // ====================================================

                targetModel.traverse(
                    (child) => {

                        if (
                            child.isBone &&
                            !rootBone
                        ) {

                            rootBone =
                                child;

                        }


                        if (
                            !slashSourceNode &&
                            child.isBone &&
                            rightWristBoneNamePattern.test(
                                child.name
                            )
                        ) {

                            slashSourceNode =
                                child;


                            console.info(
                                '[斬撃エフェクト] 右手首らしき名前のボーンを検出:',
                                child.name
                            );

                        }

                    }
                );


                if (!slashSourceNode) {

                    slashSourceNode =
                        rootBone;


                    console.warn(
                        '[斬撃エフェクト] 右手首らしき名前のボーンが見つからなかったため、rootBoneにフォールバックしました。'
                    );

                }


                if (rootBone) {

                    targetModel.updateMatrixWorld(
                        true
                    );


                    rootBone.getWorldPosition(
                        rootBoneWorldPosition
                    );


                    rootBoneRestY =
                        rootBoneWorldPosition.y;

                }


                updateCameraPosition();

            },

            undefined,

            function (error) {

                console.error(
                    'ct1.glb の読み込みエラー:',
                    error
                );

            }
        );


        // ============================================================
        // ct1 アニメーション切り替え
        // ============================================================

        function setAction(name) {

            if (
                !mixer ||
                !actions[name]
            ) return;


            const nextAction =
                actions[name];


            if (
                currentAction !==
                nextAction
            ) {

                if (currentAction) {

                    currentAction.fadeOut(
                        0.2
                    );

                }


                nextAction
                    .reset()
                    .play();


                currentAction =
                    nextAction;

            }

        }


        // ============================================================
        // mg アニメーション切り替え
        // ============================================================

        function setMgAction(name) {

            if (
                !mgMixer ||
                !mgActions[name]
            ) return;


            const nextAction =
                mgActions[name];


            if (
                currentMgAction !==
                nextAction
            ) {

                if (currentMgAction) {

                    currentMgAction.fadeOut(
                        0.2
                    );

                }


                nextAction
                    .reset()
                    .play();


                currentMgAction =
                    nextAction;

            }

        }


        function stopMgAnimation() {

            if (!currentMgAction) return;


            currentMgAction.fadeOut(
                0.2
            );


            currentMgAction =
                null;

        }


        // ============================================================
        // mg attack1
        // ============================================================

        function playMgAttack1() {

            if (
                !mgMixer ||
                !mgActions.attack1
            ) {

                console.warn(
                    '[mg] attack1を再生できません。'
                );

                return;

            }


            if (mgIsAttacking) return;


            mgIsAttacking =
                true;


            mgIsMoving =
                false;


            // walk等を停止
            if (currentMgAction) {

                currentMgAction.fadeOut(
                    0.1
                );

            }


            const attackAction =
                mgActions.attack1;


            attackAction
                .reset()
                .setLoop(
                    THREE.LoopOnce,
                    1
                );


            attackAction.clampWhenFinished =
                true;


            attackAction
                .fadeIn(0.1)
                .play();


            currentMgAction =
                attackAction;


            console.info(
                '[mg] attack1再生'
            );

        }


        // ============================================================
        // mg → ct1 移動
        // ============================================================

        function updateMgMovement(delta) {

            if (
                !mgModel ||
                !targetModel
            ) return;


            mgTargetPosition.copy(
                targetModel.position
            );


            mgMoveDirection
                .subVectors(
                    mgTargetPosition,
                    mgModel.position
                );


            // Y方向は無視して地面上だけを移動
            mgMoveDirection.y = 0;


            const distance =
                mgMoveDirection.length();


            // ========================================================
            // 3以内に入ったらattack1
            // ========================================================

            if (
                distance <=
                mgAttackDistance
            ) {

                // 3以内に入った瞬間だけ発動
                if (
                    !mgAttackTriggered &&
                    !mgIsAttacking
                ) {

                    mgAttackTriggered =
                        true;

                    playMgAttack1();

                }


                // 攻撃中は移動しない
                if (
                    mgIsAttacking
                ) {

                    mgIsMoving =
                        false;

                    return;

                }

            } else {

                // 3以上離れたら、次回侵入時に再び攻撃可能
                mgAttackTriggered =
                    false;

            }


            // ========================================================
            // ct1に十分近づいたら停止
            // ========================================================

            if (
                distance <=
                mgStopDistance
            ) {

                mgIsMoving = false;

                stopMgAnimation();

                return;

            }


            mgIsMoving = true;


            mgMoveDirection.normalize();


            // ========================================================
            // mgをct1方向へ移動
            // ========================================================

            const moveAmount =
                mgMoveSpeed * delta;


            if (
                moveAmount >=
                distance
            ) {

                mgModel.position.x =
                    mgTargetPosition.x;

                mgModel.position.z =
                    mgTargetPosition.z;

            } else {

                mgModel.position.addScaledVector(
                    mgMoveDirection,
                    moveAmount
                );

            }


            // ========================================================
            // 移動方向を向く
            // ========================================================

            const targetAngle =
                Math.atan2(
                    mgMoveDirection.x,
                    mgMoveDirection.z
                );


            const targetQuaternion =
                new THREE.Quaternion();


            targetQuaternion.setFromAxisAngle(
                new THREE.Vector3(
                    0,
                    1,
                    0
                ),
                targetAngle
            );


            mgModel.quaternion.slerp(
                targetQuaternion,
                Math.min(
                    mgRotationSpeed * delta,
                    1
                )
            );


            // ========================================================
            // 移動中はwalkをループ
            // ========================================================

            if (
                mgActions.walk
            ) {

                setMgAction(
                    'walk'
                );

            }

        }


        // ============================================================
        // パーティクル
        // ============================================================

        const particles = [];


        function randomRange(
            min,
            max
        ) {

            return (
                min +
                Math.random() *
                (max - min)
            );

        }


        function spawnFlashParticle(
            position,
            options
        ) {

            const geometry =
                new THREE.SphereGeometry(
                    options.radius,
                    12,
                    12
                );


            const material =
                new THREE.MeshBasicMaterial({

                    color:
                        options.color,

                    transparent:
                        true,

                    opacity:
                        options.startOpacity,

                    depthWrite:
                        false,

                    blending:
                        THREE.AdditiveBlending

                });


            const mesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            mesh.position.copy(
                position
            );


            scene.add(
                mesh
            );


            particles.push({

                kind:
                    'flash',

                mesh:
                    mesh,

                elapsed:
                    0,

                duration:
                    options.duration,

                maxScale:
                    options.maxScale,

                startOpacity:
                    options.startOpacity

            });

        }


        function spawnCubeBurst(
            position,
            params
        ) {

            const spawnSpread =
                params.spawnSpread || 0;


            for (
                let i = 0;
                i < params.count;
                i++
            ) {

                const size =
                    randomRange(
                        params.minSize,
                        params.maxSize
                    );


                const geometry =
                    new THREE.BoxGeometry(

                        size,
                        size,
                        size *
                            randomRange(
                                0.15,
                                0.35
                            )

                    );


                const color =
                    params.colorA
                        .clone()
                        .lerp(
                            params.colorB,
                            Math.random()
                        );


                const material =
                    new THREE.MeshBasicMaterial({

                        color:
                            color,

                        transparent:
                            true,

                        opacity:
                            1.0,

                        side:
                            THREE.DoubleSide,

                        depthWrite:
                            false,

                        blending:
                            THREE.AdditiveBlending

                    });


                const mesh =
                    new THREE.Mesh(
                        geometry,
                        material
                    );


                const spawnPosition =
                    position.clone();


                if (
                    spawnSpread > 0
                ) {

                    spawnPosition.x +=
                        randomRange(
                            -spawnSpread,
                            spawnSpread
                        );


                    spawnPosition.y +=
                        randomRange(
                            -spawnSpread * 0.4,
                            spawnSpread
                        );


                    spawnPosition.z +=
                        randomRange(
                            -spawnSpread,
                            spawnSpread
                        );

                mesh.position.copy(
                    spawnPosition

                    Math.random() *
                        Math.PI *
                        2,

                    Math.random() *
                        Math.PI *
                        2,

                    Math.random() *
                        Math.PI *
                        2

                );


                const azimuth =
                    Math.random() *
                    Math.PI *
                    2;


                const elevation =
                    randomRange(
                        params.elevationMin,
                        params.elevationMax
                    );


                const horizontalRadius =
                    Math.cos(

                const direction =
                    new THREE.Vector3(

                        Math.cos(
                            azimuth

                        horizontalRadius,

                        Math.sin(
                            elevation
                        ),

                        Math.sin(
                            azimuth
                        ) *
                        horizontalRadius

                    );

                    randomRange(

                        params.maxSpeed

                            10

                        randomRange(

                        effect.elapsed /
                            effect.duration,

                if (
                    effect.kind ===
                    'flash'

                    const scale =
                        1 +
                        t *
                        (
                            effect.maxScale -
                            1

                    effect.mesh.scale.set(
                        scale,
                        scale,
                        scale
                    );


                    effect.mesh.material.opacity =
                        effect.startOpacity *
                        (1 - t);

                } else {

                    effect.velocity.y -=
                        effect.gravity *
                        delta;


                    effect.mesh.position
                        .addScaledVector(
                            effect.velocity,
                            delta
                        );


                    effect.mesh.rotation.x +=
                        effect.angularVelocity.x *

                    effect.mesh.rotation.y +=

                        scale,
                        scale

                        (1 - t);

            if (

            cameraShakeElapsed +=

            const t =
                cameraShakeElapsed /
                cameraShakeDuration;


            if (

            const decay =

            const magnitude =

        function updateJoystick(
            clientX,
            clientY
        ) {

            const rect =
                joystickContainer
                    .getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width / 2;


            const centerY =
                rect.top +
                rect.height / 2;


            let dx =
                clientX -
                centerX;


            let dy =
                clientY -
                centerY;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance >
                joystickRadius
            ) {

                dx =
                    dx /
                    distance *
                    joystickRadius;


                dy =
                    dy /
                    distance *
                    joystickRadius;

            }


            joystickStick.style.transform =
                `translate(${dx}px, ${dy}px)`;


            joystickX =
                dx /
                joystickRadius;


            joystickY =
                dy /
                joystickRadius;


            const normalizedDistance =
                Math.hypot(
                    joystickX,
                    joystickY
                );


            if (
                normalizedDistance <
                joystickDeadZone
            ) {

                joystickX = 0;

                joystickY = 0;

            }

        }

        function handleRightScreenStart(
            e

            if (

            }


            if (
                keyState.up
            ) {

                keyboardY -= 1;

            }


            if (
                keyState.down
            ) {

                keyboardY += 1;

            }


            if (
                keyboardX !== 0 ||
                keyboardY !== 0
            ) {

                const length =
                    Math.hypot(
                        keyboardX,
                        keyboardY
                    );


                moveX =
                    keyboardX /
                    length;


                moveY =
                    keyboardY /
                    length;


                currentSpeed =
                    maxMoveSpeed;

            } else {

                if (
                    moveX !== 0 ||
                    moveY !== 0
                ) {

                    currentSpeed =
                        maxMoveSpeed;

                } else {

                    currentSpeed = 0;

                }

            }


            const isMoving =
                currentSpeed > 0;


            if (
                isJumping
            ) {

                currentSpeed *=
                    jumpMoveSpeedFactor;

            }


            if (
                !isJumping
            ) {

                if (
                    isMoving
                ) {

                    if (
                        actions.dash
                    ) {

                        setAction(
                            'dash'
                        );

                    }

                } else {

                    if (
                        actions.idle
                    ) {

                        setAction(
                            'idle'
                        );

                    }

                }

            }


            if (
                isMoving
            ) {

                const cameraForward =
                    new THREE.Vector3();


                camera.getWorldDirection(
                    cameraForward
                );


                cameraForward.y = 0;

                cameraForward.normalize();


                const cameraRight =
                    new THREE.Vector3();


                cameraRight.crossVectors(
                    cameraForward,
                    new THREE.Vector3(
                        0,
                        1,
                        0
                    )
                ).normalize();


                const moveDirection =
                    new THREE.Vector3();


                moveDirection
                    .addScaledVector(
                        cameraRight,
                        moveX
                    )
                    .addScaledVector(
                        cameraForward,
                        -moveY
                    );


                if (
                    moveDirection.lengthSq() >
                    0
                ) {

                    moveDirection.normalize();

                }


                targetModel.position
                    .addScaledVector(
                        moveDirection,
                        currentSpeed *
                        delta
                    );


                const targetAngle =
                    Math.atan2(
                        moveDirection.x,
                        moveDirection.z
                    );


                const targetQuaternion =
                    new THREE.Quaternion();


                targetQuaternion.setFromAxisAngle(
                    new THREE.Vector3(
                        0,
                        1,
                        0
                    ),
                    targetAngle
                );


                targetModel.quaternion.slerp(
                    targetQuaternion,
                    rotationSpeed *
                    delta
                );

            }

        }


        // ============================================================
        // メインループ
        // ============================================================

        function animate() {

            requestAnimationFrame(
                animate
            );


            const delta =
                clock.getDelta();


            // ct1操作
            updateModelMovement(
                delta
            );


            // mg → ct1移動・attack1判定
            updateMgMovement(
                delta
            );


            // ct1ダッシュ
            updateDash(
                delta
            );


            // パーティクル
            updateParticles(
                delta
            );


            // 斬撃エフェクト
            updateSlashEffect(
                delta
            );


            // ct1アニメーション
            if (mixer) {

                mixer.update(
                    delta
                );


                if (
                    isJumping &&
                    actions.jump
                ) {

                    jumpFrameCount =
                        Math.floor(
                            actions.jump.time *
                            animationFPS
                        );


                    if (
                        !jumpShockwaveSpawned &&
                        jumpFrameCount >=
                        shockwaveFrame
                    ) {

                        spawnJumpImpactEffects();

                        triggerCameraShake();

                        jumpShockwaveSpawned =
                            true;

                    }


                    if (
                        jumpFrameCount >=
                        jumpTransitionFrame &&
                        hasMoveInput()
                    ) {

                        isJumping =
                            false;

                        updateMovementAnimation();

                    }

                }

            }


            // mgアニメーション
            if (mgMixer) {

                mgMixer.update(
                    delta
                );

            }


            // ct1ジャンプ高さ
            if (rootBone) {

                targetModel
                    .updateMatrixWorld(
                        true
                    );


                rootBone.getWorldPosition(
                    rootBoneWorldPosition
                );


                jumpHeightOffset =
                    rootBoneWorldPosition.y -
                    rootBoneRestY;

            }


            updateCameraPosition();


            applyCameraShake(
                delta
            );


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        // ============================================================
        // リサイズ
        // ============================================================

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
