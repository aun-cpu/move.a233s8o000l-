<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer - Target Follow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; }
        #canvas-container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // --- ズーム（拡大・縮小）を禁止する設定 ---
        controls.enableZoom = false;

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // --- 回転軸（注視点）を上げるための高さオフセット ---
        // この値を大きくすると回転軸がさらに上がります（例: 1.5 〜 2.0 程度で調整）
        const targetHeightOffset = 1.5;

        // --- 初期カメラ位置のオフセット ---
        const cameraOffset = new THREE.Vector3(0, 1.8, 0.8); 

        let targetModel = null;
        let mixer = null;
        const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();

        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;

                // --- ct1 の向きを前後逆（180度反転）にする設定 ---
                targetModel.rotation.y = Math.PI;

                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                // 読み込み時のみ、カメラの初期位置を設定
                initCameraPosition();
                
                console.log('ct1.glb の読み込みと配置に成功しました');
            },
            undefined,
            function (error) {
                console.error('ct1.glb の読み込みエラー:', error);
            }
        );

        // 1. 読み込み時だけに呼ぶ「初期カメラ位置設定」
        function initCameraPosition() {
            if (!targetModel) return;

            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);

            // 回転軸のY座標（高さ）を上げる
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));

            const offset = cameraOffset.clone().applyQuaternion(targetModel.quaternion);
            
            // 回転軸（targetPosition）基準でカメラ位置を設定
            camera.position.copy(targetPosition).add(offset);
            controls.target.copy(targetPosition);
            controls.update();
        }

        // 2. 毎フレーム実行する「モデル移動への追従（位置ズレのみ補正）」
        function followModelPosition() {
            if (!targetModel) return;

            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);

            // 移動後の回転軸位置を計算
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));

            // 前フレームからの移動差分を計算してカメラと注視点をスライド
            const deltaPosition = targetPosition.clone().sub(controls.target);

            controls.target.add(deltaPosition);
            camera.position.add(deltaPosition);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }

            // モデルが動いた場合、回転軸を上げた状態を維持して追従
            if (targetModel) {
                followModelPosition();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
