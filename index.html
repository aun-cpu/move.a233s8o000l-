<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a; /* 背景色（必要に応じて変更） */
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Three.js と GLTFLoader, OrbitControls の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        // 1. シーン、カメラ、レンダラーの設定
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 1, 3); // カメラの初期位置 (x, y, z)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // 2. マウスで操作できるようにする（OrbitControls）
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 滑らかな操作感

        // 3. ライティング（照明）の設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // 全体的な光
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2); // 影を作る強い光
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 4. bg.glb ファイルの読み込み
        const loader = new THREE.GLTFLoader();
        loader.load(
            './bg.glb', // 同じディレクトリにある bg.glb を指定
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                // モデルのサイズや位置を調整したい場合は以下を解除・変更してください
                // model.position.set(0, 0, 0);
                // model.scale.set(1, 1, 1);
            },
            function (xhr) {
                // 読み込み進捗
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                // エラー処理
                console.error('エラーが発生しました:', error);
            }
        );

        // 5. アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // コントロールの更新
            renderer.render(scene, camera);
        }
        animate();

        // 6. ウィンドウサイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
