<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Analog Stick & Camera Control</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #joystick-container {
            position: absolute;
            left: 30px;
            bottom: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-base {
            position: absolute;
            left: 0;
            top: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #joystick-stick {
            position: absolute;
            left: 52px;
            top: 52px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.65);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transform: translate(0px, 0px);
        }

        #jump-button {
            position: absolute;
            right: 35px;
            bottom: 75px;
            width: 90px;
            height: 90px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #jump-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }

        #dash-button {
            position: absolute;
            right: 20px;
            bottom: 15px;
            width: 56px;
            height: 56px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #dash-button:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.94);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="joystick-container">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
    </div>

    <div id="jump-button">↑</div>

    <div id="dash-button">⏫</div>

    <script>

        // ============================================================
        // Three.js 基本設定
        // ============================================================
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.95;
        renderer.shadowMap.enabled = true;              // ※影を有効化
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // ※柔らかく、はっきり見える影にする

        document.getElementById('canvas-container').appendChild(renderer.domElement);


        // ============================================================
        // ライト
        // ============================================================
        scene.add(new THREE.AmbientLight(0xffffff, 0.5)); // ※影を強調するため環境光をさらに抑える（0.7 → 0.5）

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.6); // ※影のコントラストを強めるため強度アップ
        dirLight.position.set(5, 10, 7.5);
        dirLight.castShadow = true; // ※このライトから影を落とす
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005; // ※シャドウアクネ（縞模様）を軽減
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
        fillLight.position.set(-5, 5, -7);
        scene.add(fillLight);


        // ============================================================
        // 環境マップ
        // ============================================================
        const pmremGenerator = new THREE.PMREMGenerator(renderer);

        const environmentScene = new THREE.Scene();
        environmentScene.background = new THREE.Color(0x202020);

        const environmentLight = new THREE.HemisphereLight(0xffffff, 0x222222, 2);
        environmentScene.add(environmentLight);

        const environmentTarget = pmremGenerator.fromScene(environmentScene);
        scene.environment = environmentTarget.texture;


        // ============================================================
        // カメラ設定
        // ============================================================
        const targetHeightOffset = 1.5;
        const cameraDistance = 1.6;

        let cameraSpherical = new THREE.Spherical(cameraDistance, Math.PI / 2.2, 0);

        const minPolarAngle = 0.1;
        const maxPolarAngle = Math.PI / 2 - 0.05;


        // ============================================================
        // モデル・アニメーション（ct1）
        // ============================================================
        let targetModel = null;
        let bgModel = null;
        let mixer = null;

        let actions = {};
        let currentAction = null;

        let rootBone = null;

        let slashSourceNode = null;

        const rightWristBoneNamePattern =
            /(right.*hand|right.*wrist|r[_\.]?hand\b|hand[_\.]?r\b|wrist.*r\b|r.*wrist|righthand|rightwrist|右手首|右手首関節|みぎてくび)/i;

        let rootBoneRestY = 0;
        let jumpHeightOffset = 0;
        const rootBoneWorldPosition = new THREE.Vector3();

        let isJumping = false;
        let jumpFrameCount = 0;

        const jumpTransitionFrame = 25;
        const animationFPS = 30;
        const shockwaveFrame = 22;
        let jumpShockwaveSpawned = false;

        const clock = new THREE.Clock();


        // ============================================================
        // 移動・カメラ設定
        // ============================================================
        const maxMoveSpeed = 4.0;
        const jumpMoveSpeedFactor = 0.3;
        const rotationSpeed = 10.0;
        const cameraTouchSensitivity = 0.005;


        // ============================================================
        // GLTF Loader
        // ============================================================
        const loader = new THREE.GLTFLoader();


        // ============================================================
        // mg.glb（敵キャラクター）の設定
        // ============================================================
        let mgModel = null;
        let mgMixer = null;
        let mgActions = {};
        let currentMgAction = null;

        // ※現在mgが再生している攻撃モーションの種類（'attack1' | 'attack2' | null）
        let currentMgAttackType = null;

        const mgMoveSpeed = 1.0;
        const mgRotationSpeed = 5.0;

        // ct1からこの距離までしか近づかない（＝mgが近づける範囲）
        const mgAttackDistance = 2.0; // ※ct1に近づける限界を近づけた（3.0 → 2.0）

        // mgが攻撃（attack1/attack2）を開始する範囲
        // ※近づける範囲（mgAttackDistance）はそのままに、攻撃を開始する範囲だけを広げた
        const mgAttackTriggerDistance = 3.0;

        // ct1がjumpを行った瞬間、mgとの距離がこの範囲以内で、
        // かつattack1がまだ発動していなければ、その場でattack2を発動する
        const mgJumpAttack2TriggerDistance = 4.0;

        let mgIsMoving = false;
        let mgIsAttacking = false;

        // 3以内に入った瞬間を一度だけ検出するためのフラグ
        // （3より外に出るとfalseに戻り、再接近時にまた発動できる）
        let mgAttackTriggered = false;

        const mgMoveDirection = new THREE.Vector3();
        const mgTargetPosition = new THREE.Vector3();

        // attack1 / attack2 再生中のフレーム数（当たり判定・エフェクトのタイミング制御に使う）
        let mgAttackFrameCount = 0;


        // ------------------------------------------------------------
        // mgの「左1」「右1」ボーンを常に固定角度にするための参照
        // ------------------------------------------------------------
        let mgLeftBone1 = null;
        let mgRightBone1 = null;

        const mgFixedBoneAngleLeft = THREE.MathUtils.degToRad(130);
        const mgFixedBoneAngleRight = THREE.MathUtils.degToRad(-130);


        // ------------------------------------------------------------
        // ct1側も、mgに近づきすぎないように制限する
        // ------------------------------------------------------------
        const ct1MinDistanceToMg = 1.8; // ct1がmgへ近づける最小距離


        // ------------------------------------------------------------
        // mg attack1 / attack2 の当たり判定（mgの前方に置く円形の判定）と
        // ct1側の当たり判定（ct1を中心とした円形の判定）
        //
        // attack1のアニメーション再生中、25フレーム目前後の短い間だけ
        // 判定を有効にし、attack2のアニメーション再生中は15フレーム目に
        // 同じ判定を有効にする。この2つの判定が重なった最初の瞬間にだけ
        // ct1をノックバックさせる（1回の攻撃につき1回だけ）。
        // ct1がダッシュ中（透明化中）は無敵扱いとし、判定自体を行わない。
        // ------------------------------------------------------------
        const mgAttackHitboxForwardOffset = 1.2; // mgの前方どれだけの位置に判定を置くか
        const mgAttackHitboxRadius = 1.3;        // mg側の判定の半径
        const ct1HitboxRadius = 0.6;             // ct1側の判定の半径

        // attack1: 当たり判定を有効にするフレーム範囲（25フレーム目前後）
        const mgAttackHitFrameStart = 23;
        const mgAttackHitFrameEnd = 27;

        // attack2: 当たり判定を有効にするフレーム（15フレーム目）
        const mgAttack2HitFrame = 15;

        let mgAttackHitApplied = false;

        const mgAttackForward = new THREE.Vector3();
        const mgAttackHitPosition = new THREE.Vector3();


        // ------------------------------------------------------------
        // ct1のノックバック（強化版）
        // ------------------------------------------------------------
        let isCt1Knockback = false;
        let ct1KnockbackElapsed = 0;

        const ct1KnockbackVelocity = new THREE.Vector3();
        const ct1KnockbackDuration = 0.5;  // ノックバックが続く時間（秒）※さらに強化：長め
        const ct1KnockbackStrength = 14.0; // ノックバックの初速 ※さらに強化：大幅アップ
        const ct1KnockbackDamping = 3.0;   // 速度の減衰係数（大きいほど早く止まる）※さらに強化：飛距離を伸ばすため減衰を緩める


        // ------------------------------------------------------------
        // ct1のジャンプ攻撃 → mgヒット時のワープ
        //
        // ct1のjumpアニメーション再生中、22フレーム目に到達した時点で、
        // ct1の真下から少し前寄りの位置を攻撃判定の発生源とし、mgとの
        // 距離をチェックする。mgにはct1のおよそ2.5倍の身長を想定した
        // 縦方向の当たり判定を用意し、水平距離・垂直距離の両方が範囲内
        // であれば、そのジャンプにつき1回だけmgをct1から少し離れた
        // 場所へワープさせる。
        // ------------------------------------------------------------
        const ct1ApproxHeight = 1.8;                       // ct1のおおよその身長（目安）
        const mgHitboxHeightMultiplier = 2.5;              // mgの当たり判定の高さ倍率 ※広く：2 → 2.5
        const mgHitboxHeight = ct1ApproxHeight * mgHitboxHeightMultiplier; // mgの当たり判定の高さ
        const mgBodyRadius = ct1MinDistanceToMg;           // mg本体の水平方向の当たり判定半径 ※ct1が近づける限界にちょうど重なるようにする
        const ct1AttackHitboxRadius = 2.3;                 // ct1のジャンプ攻撃の当たり判定半径 ※命中しない問題を解消するためさらに拡大：1.8 → 2.6
        const ct1AttackForwardOffset = 0.1;                // ct1の真下から前方へずらす距離 ※向きがずれても届くよう拡大：0.8 → 1.3
        const ct1AttackVerticalMargin = 1.0;               // 判定の上下に持たせる余裕（判定漏れ防止）
        const jumpAttackFrame = 22;                        // 攻撃判定を発生させるジャンプアニメのフレーム ※22フレーム目のみに限定
        const mgWarpDistance = 8;                        // ヒット時、mgをct1からどれだけ離れた位置へワープさせるか

        let jumpAttackHitApplied = false;

        // ------------------------------------------------------------
        // ct1のジャンプ攻撃がmgに命中した際の「当たった感」パーティクル
        // mgの当たり判定（半径・高さ）を参考に、当たった位置に発生させる
        // ------------------------------------------------------------
        const jumpHitImpactFlashColor = 0xffffff;
        const jumpHitImpactFlashDuration = 0.15;
        const jumpHitImpactFlashRadius = 0.5;
        const jumpHitImpactFlashMaxScale = 3.5;

        const jumpHitImpactBurstCount = 45;
        const jumpHitImpactMinSize = 0.12;
        const jumpHitImpactMaxSize = 0.5;
        const jumpHitImpactMinSpeed = 2.5;
        const jumpHitImpactMaxSpeed = 6.5;
        const jumpHitImpactMinDuration = 0.4;
        const jumpHitImpactMaxDuration = 0.8;
        const jumpHitImpactGravity = 3.0;
        const jumpHitImpactColorA = new THREE.Color(0xffffff);
        const jumpHitImpactColorB = new THREE.Color(0xffe066);


        // ------------------------------------------------------------
        // mgがct1から離れすぎた場合の追従ワープ
        //
        // 毎フレーム、mgとct1の水平距離をチェックし、mgMaxDistanceFromCt1
        // を超えていたら、mgをct1の目の前（mgWarpToFrontDistance離れた
        // 位置）へワープさせて追いつかせる。
        // ------------------------------------------------------------
        const mgMaxDistanceFromCt1 = 12.0;   // この距離を超えて離れたらmgをワープさせる
        const mgWarpToFrontDistance = 4.0;   // ct1の目の前へワープさせる際の距離


        // ------------------------------------------------------------
        // ノックバック発生時、当たり判定付近に一瞬出す黄色い光
        // ------------------------------------------------------------
        const knockbackFlashColor = 0xffe200;
        const knockbackFlashDuration = 0.15;
        const knockbackFlashRadius = 0.4;
        const knockbackFlashMaxScale = 3.0;


        // ------------------------------------------------------------
        // attack2がヒットした際の衝撃波エフェクト（丸いflashのみ・大きめ）
        // ------------------------------------------------------------
        const mgAttack2ShockwaveFlashColor = 0xffe200;
        const mgAttack2ShockwaveFlashDuration = 0.22;
        const mgAttack2ShockwaveFlashRadius = 0.9;
        const mgAttack2ShockwaveFlashMaxScale = 6.0;


        // ------------------------------------------------------------
        // attack1中、20フレーム目からmgの前に大袈裟に出す
        // 白と黄色のブロックで構成された三日月エフェクト（強化版）
        // ------------------------------------------------------------
        const mgCrescentFrame = 20; // このフレームに到達したら発生させる
        let mgCrescentSpawned = false;

        const mgAttackShakeFrame = 25; // このフレームに到達したらカメラを揺らす
        let mgAttackShakeSpawned = false;

        const mgCrescentArcSteps = 60;               // 三日月を構成するブロックの数 ※強化：数を増やす
        const mgCrescentArcAngleRange = Math.PI * 0.55; // 弧の全体角度（約99度）
        const mgCrescentRadius = 2.7;                 // mgからの基本半径 ※強化：範囲を広げる
        const mgCrescentRadiusVariance = 0.4;         // 半径のランダムなばらつき
        const mgCrescentHeight = 1.7;                 // 発生高さ ※強化：位置を上げる

        const mgCrescentCubeMinSize = 0.16;
        const mgCrescentCubeMaxSize = 0.46;

        const mgCrescentOutwardSpeed = 2.6;
        const mgCrescentGravity = 1.0;
        const mgCrescentMinDuration = 0.5;  // ※強化：持続時間を延長
        const mgCrescentMaxDuration = 0.95; // ※強化：持続時間を延長

        const mgCrescentColorWhite = new THREE.Color(0xffffff);
        const mgCrescentColorYellow = new THREE.Color(0xffe200);

        const mgCrescentFlashDuration = 0.15;
        const mgCrescentFlashRadius = 0.6;
        const mgCrescentFlashMaxScale = 4.0;
        const mgCrescentFlashColor = 0xfff2a0;


        // ============================================================
        // bg.glb
        // ============================================================
        loader.load(
            './bg.glb',
            function (gltf) {

                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);

                bgModel.traverse((child) => {

                    if (!child.isMesh) return;

                    const oldMaterial = child.material;
                    const materials = Array.isArray(oldMaterial) ? oldMaterial : [oldMaterial];

                    const newMaterials = materials.map((material) => {
                        return new THREE.MeshBasicMaterial({
                            wireframe: true,
                            transparent: material.transparent,
                            opacity: material.opacity,
                            map: material.map || null,
                            vertexColors: material.vertexColors
                        });
                    });

                    child.material = Array.isArray(oldMaterial) ? newMaterials : newMaterials[0];

                    child.receiveShadow = true; // ※ct1・mgの影を受けられるようにする

                });

                scene.add(bgModel);

            },
            undefined,
            function (error) {
                console.error('bg.glb の読み込みエラー:', error);
            }
        );


        // ============================================================
        // ct1.glb
        // ============================================================
        loader.load(
            './ct1.glb',
            function (gltf) {

                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;

                targetModel.traverse((child) => {

                    if (!child.isMesh) return;

                    const materials = Array.isArray(child.material) ? child.material : [child.material];

                    materials.forEach((material) => {

                        if (!material) return;

                        if (material.color) {
                            material.color.multiplyScalar(0.4); // ※重く・暗い色合いに変更（0.55 → 0.4）
                        }

                        material.metalness = 0.0;   // ※質感を完全にマットにして薄く見えるハイライトを抑える
                        material.roughness = 0.95;  // ※ハイライトを抑え、重く落ち着いた質感にする
                        material.envMapIntensity = 0.08; // ※環境光の映り込みを抑えて色が薄れないようにする

                        if (material.map) {
                            material.map.encoding = THREE.sRGBEncoding;
                            // ※テクスチャをはっきりさせるため、異方性フィルタリングを最大化してぼやけを抑える
                            material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            material.map.needsUpdate = true;
                        }

                        material.needsUpdate = true;

                    });

                    child.castShadow = true;    // ※ct1が影を落とすようにする
                    child.receiveShadow = true; // ※ct1自身にも影が落ちるようにする

                });

                scene.add(targetModel);

                const ct1InitialPosition = targetModel.position.clone();
                const ct1InitialQuaternion = targetModel.quaternion.clone();


                // ====================================================
                // mg.glb
                // ====================================================
                loader.load(
                    './mg.glb',
                    function (mgGltf) {

                        mgModel = mgGltf.scene;
                        mgModel.scale.set(2.5, 2.5, 2.5);

                        // ------------------------------------------------
                        // 「左1」「右1」ボーンを検出（常に固定角度にするため）
                        // ------------------------------------------------
                        mgModel.traverse((child) => {

                            if (!child.isBone) return;

                            if (child.name === '左1') {
                                mgLeftBone1 = child;
                                console.info('[mg] 左1ボーンを検出:', child.name);
                            }

                            if (child.name === '右1') {
                                mgRightBone1 = child;
                                console.info('[mg] 右1ボーンを検出:', child.name);
                            }

                        });

                        if (!mgLeftBone1) {
                            console.warn('[mg] 左1ボーンが見つかりませんでした。');
                        }

                        if (!mgRightBone1) {
                            console.warn('[mg] 右1ボーンが見つかりませんでした。');
                        }

                        // mgのテクスチャがぼやけて薄く見えないよう、はっきりさせつつ
                        // 重くダークな色合いに調整する
                        mgModel.traverse((child) => {

                            if (!child.isMesh) return;

                            const mgMaterials = Array.isArray(child.material) ? child.material : [child.material];

                            mgMaterials.forEach((material) => {

                                if (!material) return;

                                if (material.color) {
                                    material.color.multiplyScalar(0.45); // 重く・暗い色合いにする
                                    material.color.multiply(new THREE.Color(0xfff0a0)); // ※黄ばんだ色味を足す
                                }

                                material.metalness = 0.0;
                                material.roughness = 0.95;
                                material.envMapIntensity = 0.08;

                                // ※輪郭を曖昧にするため半透明にする
                                material.transparent = true;
                                material.opacity = 0.99;

                                if (material.map) {
                                    material.map.encoding = THREE.sRGBEncoding;
                                    material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                    material.map.needsUpdate = true;
                                }

                                material.needsUpdate = true;

                            });

                            child.castShadow = true;    // ※mgが影を落とすようにする
                            child.receiveShadow = true; // ※mg自身にも影が落ちるようにする

                        });

                        // 初期位置：ct1の正面7.0離れた位置
                        const mgForward = new THREE.Vector3(0, 0, 1);
                        mgForward.applyQuaternion(ct1InitialQuaternion);
                        mgForward.y = 0;

                        if (mgForward.lengthSq() > 0) {
                            mgForward.normalize();
                        }

                        mgModel.position.copy(ct1InitialPosition).addScaledVector(mgForward, 7.0);

                        mgModel.quaternion.copy(ct1InitialQuaternion);

                        const mgRotationOffset = new THREE.Quaternion();
                        mgRotationOffset.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
                        mgModel.quaternion.multiply(mgRotationOffset);

                        scene.add(mgModel);

                        // ================================================
                        // mgのアニメーション
                        // ================================================
                        if (mgGltf.animations && mgGltf.animations.length > 0) {

                            mgMixer = new THREE.AnimationMixer(mgModel);

                            mgGltf.animations.forEach((clip) => {

                                const action = mgMixer.clipAction(clip);
                                const animationName = clip.name.trim().toLowerCase();

                                if (animationName === 'walk') {

                                    mgActions.walk = action;
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                    action.clampWhenFinished = false;

                                    console.info('[mg] walkアニメーションを検出:', clip.name);

                                }

                                if (animationName === 'attack1') {

                                    mgActions.attack1 = action;
                                    action.setLoop(THREE.LoopOnce, 1);
                                    action.clampWhenFinished = true;

                                    console.info('[mg] attack1アニメーションを検出:', clip.name);

                                }

                                if (animationName === 'attack2') {

                                    mgActions.attack2 = action;
                                    action.setLoop(THREE.LoopOnce, 1);
                                    action.clampWhenFinished = true;

                                    console.info('[mg] attack2アニメーションを検出:', clip.name);

                                }

                            });

                            if (!mgActions.attack1) {
                                console.warn('[mg] attack1アニメーションが見つかりません。');
                            }

                            if (!mgActions.attack2) {
                                console.warn('[mg] attack2アニメーションが見つかりません。');
                            }

                            // attack1 / attack2 終了イベント
                            mgMixer.addEventListener('finished', function (event) {

                                if (event.action === mgActions.attack1 || event.action === mgActions.attack2) {

                                    mgIsAttacking = false;
                                    currentMgAttackType = null;

                                    // ※何度でも繰り返し発動できるよう、距離に関わらず毎回トリガーをリセットする
                                    mgAttackTriggered = false;

                                    console.info('[mg] 攻撃モーション終了');

                                }

                            });

                        } else {

                            console.warn('[mg] アニメーションがありません。');

                        }

                    },
                    undefined,
                    function (error) {
                        console.error('mg.glb の読み込みエラー:', error);
                    }
                );


                // ====================================================
                // ct1アニメーション
                // ====================================================
                if (gltf.animations && gltf.animations.length > 0) {

                    mixer = new THREE.AnimationMixer(targetModel);

                    gltf.animations.forEach((clip) => {

                        const action = mixer.clipAction(clip);
                        const animationName = clip.name.trim().toLowerCase();

                        if (animationName === 'jump') {

                            actions.jump = action;
                            action.setLoop(THREE.LoopOnce, 1);
                            action.clampWhenFinished = true;

                        } else {

                            action.setLoop(THREE.LoopRepeat, Infinity);
                            action.clampWhenFinished = false;

                            if (animationName === 'idle') actions.idle = action;
                            if (animationName === 'dash') actions.dash = action;

                        }

                    });

                    mixer.addEventListener('finished', function (event) {

                        if (event.action === actions.jump && isJumping) {
                            isJumping = false;
                            updateMovementAnimation();
                        }

                    });

                    setAction('idle');

                }


                // ====================================================
                // ボーン検出
                // ====================================================
                targetModel.traverse((child) => {

                    if (child.isBone && !rootBone) {
                        rootBone = child;
                    }

                    if (!slashSourceNode && child.isBone && rightWristBoneNamePattern.test(child.name)) {
                        slashSourceNode = child;
                        console.info('[斬撃エフェクト] 右手首らしき名前のボーンを検出:', child.name);
                    }

                });

                if (!slashSourceNode) {
                    slashSourceNode = rootBone;
                    console.warn('[斬撃エフェクト] 右手首らしき名前のボーンが見つからなかったため、rootBoneにフォールバックしました。');
                }

                if (rootBone) {
                    targetModel.updateMatrixWorld(true);
                    rootBone.getWorldPosition(rootBoneWorldPosition);
                    rootBoneRestY = rootBoneWorldPosition.y;
                }

                updateCameraPosition();

            },
            undefined,
            function (error) {
                console.error('ct1.glb の読み込みエラー:', error);
            }
        );


        // ============================================================
        // ct1 アニメーション切り替え
        // ============================================================
        function setAction(name) {

            if (!mixer || !actions[name]) return;

            const nextAction = actions[name];

            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().play();
                currentAction = nextAction;
            }

        }


        // ============================================================
        // mg アニメーション切り替え
        // ============================================================
        function setMgAction(name) {

            if (!mgMixer || !mgActions[name]) return;

            const nextAction = mgActions[name];

            if (currentMgAction !== nextAction) {
                if (currentMgAction) currentMgAction.fadeOut(0.2);
                nextAction.reset().play();
                currentMgAction = nextAction;
            }

        }


        function stopMgAnimation() {

            if (!currentMgAction) return;

            currentMgAction.fadeOut(0.2);
            currentMgAction = null;

        }


        // ============================================================
        // mg attack1 再生
        // ============================================================
        function playMgAttack1() {

            if (!mgMixer || !mgActions.attack1) {
                console.warn('[mg] attack1を再生できません。');
                return;
            }

            if (mgIsAttacking) return;

            mgIsAttacking = true;
            mgIsMoving = false;
            currentMgAttackType = 'attack1';

            // 今回のattack1ではまだヒット処理・演出をしていない状態にリセット
            mgAttackHitApplied = false;
            mgCrescentSpawned = false;
            mgAttackShakeSpawned = false;
            mgAttackFrameCount = 0;

            if (currentMgAction) {
                currentMgAction.fadeOut(0.1);
            }

            const attackAction = mgActions.attack1;

            attackAction.reset().setLoop(THREE.LoopOnce, 1);
            attackAction.clampWhenFinished = true;
            attackAction.fadeIn(0.1).play();

            currentMgAction = attackAction;

            console.info('[mg] attack1再生');

        }


        // ============================================================
        // mg attack2 再生
        //
        // mgのattack1がまだ再生されていない間にct1がjumpを行った場合、
        // mgの攻撃発動時にattack1の代わりにこちらが再生される。
        // ============================================================
        function playMgAttack2() {

            if (!mgMixer || !mgActions.attack2) {
                console.warn('[mg] attack2を再生できません。attack1で代用します。');
                playMgAttack1();
                return;
            }

            if (mgIsAttacking) return;

            mgIsAttacking = true;
            mgIsMoving = false;
            currentMgAttackType = 'attack2';

            // 今回のattack2ではまだヒット処理をしていない状態にリセット
            mgAttackHitApplied = false;
            mgCrescentSpawned = false;
            mgAttackShakeSpawned = false;
            mgAttackFrameCount = 0;

            if (currentMgAction) {
                currentMgAction.fadeOut(0.1);
            }

            const attackAction = mgActions.attack2;

            attackAction.reset().setLoop(THREE.LoopOnce, 1);
            attackAction.clampWhenFinished = true;
            attackAction.fadeIn(0.1).play();

            currentMgAction = attackAction;

            console.info('[mg] attack2再生');

        }


        // ============================================================
        // mg → ct1 への接近・停止・attack1発動
        //
        // ct1との距離が mgAttackTriggerDistance（攻撃を開始する範囲）以下に
        // なった瞬間に、その場でattack1を発動する（＝攻撃発動のために
        // mgAttackDistanceまで近づく必要はない）。
        //
        // 一方、攻撃が発動していない間は mgAttackDistance（近づける範囲）
        // より内側には絶対に入らないよう、移動量を境界までにクランプする。
        //
        // なお、attack2はこの距離ベースの判定とは別に、ct1がjump()を
        // 行った瞬間に mgJumpAttack2TriggerDistance 以内であれば即座に
        // 発動する（jump()内のロジックを参照）。
        // ============================================================
        function updateMgMovement(delta) {

            if (!mgModel || !targetModel) return;

            mgTargetPosition.copy(targetModel.position);

            mgMoveDirection.subVectors(mgTargetPosition, mgModel.position);
            mgMoveDirection.y = 0;

            const distance = mgMoveDirection.length();

            // --------------------------------------------------
            // 攻撃を開始する範囲（mgAttackTriggerDistance）以内に入った
            // 瞬間、attack1を発動する
            // --------------------------------------------------
            if (!mgAttackTriggered && !mgIsAttacking && distance <= mgAttackTriggerDistance) {

                mgAttackTriggered = true;
                playMgAttack1();

            }

            // 攻撃アニメーション再生中は移動しない
            if (mgIsAttacking) {
                mgIsMoving = false;
                return;
            }

            // --------------------------------------------------
            // 近づける範囲（mgAttackDistance）以内：これ以上近づかない
            // --------------------------------------------------
            if (distance <= mgAttackDistance) {

                mgIsMoving = false;
                stopMgAnimation();

                return;

            }

            // 攻撃を開始する範囲より外に出たら、再びトリガーできるようにする
            if (distance > mgAttackTriggerDistance) {
                mgAttackTriggered = false;
            }

            mgIsMoving = true;

            mgMoveDirection.normalize();

            // 境界（mgAttackDistanceの円）を超えて内側へ入らないよう移動量をクランプ
            const allowedMoveAmount = Math.max(distance - mgAttackDistance, 0);
            const moveAmount = mgMoveSpeed * delta;

            if (moveAmount >= allowedMoveAmount) {
                mgModel.position.addScaledVector(mgMoveDirection, allowedMoveAmount);
            } else {
                mgModel.position.addScaledVector(mgMoveDirection, moveAmount);
            }

            const targetAngle = Math.atan2(mgMoveDirection.x, mgMoveDirection.z);

            const targetQuaternion = new THREE.Quaternion();
            targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);

            mgModel.quaternion.slerp(targetQuaternion, Math.min(mgRotationSpeed * delta, 1));

            if (mgActions.walk) {
                setMgAction('walk');
            }

        }


        // ============================================================
        // ct1がmgに近づきすぎないよう制限する
        //
        // ct1の移動・ノックバック・ダッシュなど、あらゆる要因で
        // 位置が更新された後、mgとの水平距離がct1MinDistanceToMgを
        // 下回っていたら、その分だけmgから遠ざかる方向へ押し戻す。
        // ============================================================
        function clampCt1DistanceFromMg() {

            if (!targetModel || !mgModel) return;

            const dx = targetModel.position.x - mgModel.position.x;
            const dz = targetModel.position.z - mgModel.position.z;
            const distance = Math.hypot(dx, dz);

            if (distance >= ct1MinDistanceToMg) return;

            if (distance > 0.0001) {

                const pushScale = ct1MinDistanceToMg / distance;

                targetModel.position.x = mgModel.position.x + dx * pushScale;
                targetModel.position.z = mgModel.position.z + dz * pushScale;

            } else {

                // 完全に重なってしまった場合は、適当な方向へ押し出す
                targetModel.position.x = mgModel.position.x + ct1MinDistanceToMg;
                targetModel.position.z = mgModel.position.z;

            }

        }


        // ============================================================
        // mg attack1 / attack2 の当たり判定 → ct1ノックバック
        //
        // attack1再生中は25フレーム目前後の短い間だけ、attack2再生中は
        // 15フレーム目に、mgの前方に置いた円形の判定と、ct1を中心とした
        // 円形の判定が重なっているかをチェックする。重なっていれば、
        // その攻撃につき1回だけct1をノックバックさせ、当たり判定付近に
        // 黄色い光を一瞬出す。
        // ct1がダッシュ中（本体が非表示＝透明化中）は無敵として判定しない。
        // ============================================================
        function updateMgAttackHit(delta) {

            if (!mgModel || !targetModel) return;
            if (!mgIsAttacking) return;
            if (mgAttackHitApplied) return;

            let hitFrameActive = false;

            if (currentMgAttackType === 'attack1') {

                // 25フレーム目前後の短い区間のみ判定を有効にする
                hitFrameActive = mgAttackFrameCount >= mgAttackHitFrameStart && mgAttackFrameCount <= mgAttackHitFrameEnd;

            } else if (currentMgAttackType === 'attack2') {

                // 15フレーム目に判定を有効にする（attack1と同じ判定処理）
                hitFrameActive = mgAttackFrameCount === mgAttack2HitFrame;

            }

            if (!hitFrameActive) return;

            // ダッシュ中（透明化中）のct1には当たり判定を発生させない
            if (isDashing || !targetModel.visible) return;

            mgAttackForward.set(0, 0, 1);
            mgAttackForward.applyQuaternion(mgModel.quaternion);
            mgAttackForward.y = 0;

            if (mgAttackForward.lengthSq() > 0) {
                mgAttackForward.normalize();
            }

            mgAttackHitPosition.copy(mgModel.position)
                .addScaledVector(mgAttackForward, mgAttackHitboxForwardOffset);

            const dx = targetModel.position.x - mgAttackHitPosition.x;
            const dz = targetModel.position.z - mgAttackHitPosition.z;
            const distance = Math.hypot(dx, dz);

            if (distance <= mgAttackHitboxRadius + ct1HitboxRadius) {

                mgAttackHitApplied = true;

                // 判定点からct1へ向かう方向へノックバックさせる
                applyCt1Knockback(dx, dz);

                const flashPosition = mgAttackHitPosition.clone();
                flashPosition.y += 1.0;

                if (currentMgAttackType === 'attack2') {

                    // attack2は丸い衝撃波（flash）のみを大きめに出す
                    spawnFlashParticle(flashPosition, {
                        radius: mgAttack2ShockwaveFlashRadius,
                        duration: mgAttack2ShockwaveFlashDuration,
                        maxScale: mgAttack2ShockwaveFlashMaxScale,
                        startOpacity: 1.0,
                        color: mgAttack2ShockwaveFlashColor
                    });

                    triggerCameraShake();

                } else {

                    // attack1は既存の黄色い光のみ
                    spawnFlashParticle(flashPosition, {
                        radius: knockbackFlashRadius,
                        duration: knockbackFlashDuration,
                        maxScale: knockbackFlashMaxScale,
                        startOpacity: 1.0,
                        color: knockbackFlashColor
                    });

                }

            }

        }


        // ============================================================
        // ct1ノックバック
        // ============================================================
        function applyCt1Knockback(dirX, dirZ) {

            const knockDir = new THREE.Vector3(dirX, 0, dirZ);

            if (knockDir.lengthSq() > 0) {
                knockDir.normalize();
            }

            // ノックバック発生時は、進行中の操作（ジャンプ・ダッシュ・移動）を
            // 全て強制的に中断する
            if (isDashing) {
                isDashing = false;
                targetModel.visible = true;
            }

            if (isJumping) {
                isJumping = false;
            }

            setAction('idle');

            ct1KnockbackVelocity.copy(knockDir).multiplyScalar(ct1KnockbackStrength);
            ct1KnockbackElapsed = 0;
            isCt1Knockback = true;

        }


        function updateCt1Knockback(delta) {

            if (!isCt1Knockback || !targetModel) return;

            // ダッシュ中は無効化（ダッシュ開始時に残っていた場合も止める）
            if (isDashing) {
                isCt1Knockback = false;
                ct1KnockbackVelocity.set(0, 0, 0);
                return;
            }

            ct1KnockbackElapsed += delta;

            targetModel.position.addScaledVector(ct1KnockbackVelocity, delta);

            const damping = Math.max(0, 1 - ct1KnockbackDamping * delta);
            ct1KnockbackVelocity.multiplyScalar(damping);

            if (ct1KnockbackElapsed >= ct1KnockbackDuration) {
                isCt1Knockback = false;
                ct1KnockbackVelocity.set(0, 0, 0);
            }

        }


        // ============================================================
        // ct1のジャンプ攻撃 判定 → mgヒット時のワープ
        // ============================================================
        function updateCt1JumpAttackHit() {

            if (!mgModel || !targetModel) return;
            if (!isJumping) return;
            if (jumpAttackHitApplied) return;
            if (jumpFrameCount !== jumpAttackFrame) return; // ※22フレーム目だけで判定する

            // ct1の真下（現在の高さ）から少し前寄りの位置を攻撃判定の発生源とする
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(targetModel.quaternion);
            forward.y = 0;

            if (forward.lengthSq() > 0) {
                forward.normalize();
            }

            const attackPosition = targetModel.position.clone();
            attackPosition.y += jumpHeightOffset;
            attackPosition.addScaledVector(forward, ct1AttackForwardOffset);

            const dx = attackPosition.x - mgModel.position.x;
            const dz = attackPosition.z - mgModel.position.z;
            const horizontalDistance = Math.hypot(dx, dz);

            if (horizontalDistance > ct1AttackHitboxRadius + mgBodyRadius) return;

            // mgの足元からmgHitboxHeightの高さまでを当たり判定とする
            // （判定漏れを防ぐため、上下にct1AttackVerticalMarginの余裕を持たせる）
            const relativeHeight = attackPosition.y - mgModel.position.y;

            if (relativeHeight < -ct1AttackVerticalMargin || relativeHeight > mgHitboxHeight + ct1AttackVerticalMargin) return;

            jumpAttackHitApplied = true;

            spawnJumpHitImpactEffect(attackPosition);

            warpMgAwayFromCt1();

        }


        // ============================================================
        // ct1のジャンプ攻撃がmgに命中した際の「当たった感」演出
        // mgの当たり判定（半径・高さ）を参考に、当たり判定の表面付近に発生させる
        // ============================================================
        function spawnJumpHitImpactEffect(attackPosition) {

            if (!mgModel) return;

            const impactDirection = new THREE.Vector3(
                attackPosition.x - mgModel.position.x,
                0,
                attackPosition.z - mgModel.position.z
            );

            if (impactDirection.lengthSq() > 0.0001) {
                impactDirection.normalize();
            } else {
                impactDirection.set(0, 0, 1);
            }

            // mgの当たり判定（半径・高さ）を参考に、その表面上に衝突位置を作る
            const impactPosition = mgModel.position.clone()
                .addScaledVector(impactDirection, mgBodyRadius);

            impactPosition.y = THREE.MathUtils.clamp(
                attackPosition.y,
                mgModel.position.y,
                mgModel.position.y + mgHitboxHeight
            );

            spawnFlashParticle(impactPosition, {
                radius: jumpHitImpactFlashRadius,
                duration: jumpHitImpactFlashDuration,
                maxScale: jumpHitImpactFlashMaxScale,
                startOpacity: 1.0,
                color: jumpHitImpactFlashColor
            });

            spawnCubeBurst(impactPosition, {
                count: jumpHitImpactBurstCount,
                minSize: jumpHitImpactMinSize,
                maxSize: jumpHitImpactMaxSize,
                minSpeed: jumpHitImpactMinSpeed,
                maxSpeed: jumpHitImpactMaxSpeed,
                minDuration: jumpHitImpactMinDuration,
                maxDuration: jumpHitImpactMaxDuration,
                gravity: jumpHitImpactGravity,
                colorA: jumpHitImpactColorA,
                colorB: jumpHitImpactColorB,
                elevationMin: -0.1,
                elevationMax: 1.0,
                spawnSpread: 0.3
            });

        }


        function warpMgAwayFromCt1() {

            if (!mgModel || !targetModel) return;

            const dx = mgModel.position.x - targetModel.position.x;
            const dz = mgModel.position.z - targetModel.position.z;

            const warpDirection = new THREE.Vector3(dx, 0, dz);

            if (warpDirection.lengthSq() < 0.0001) {

                // ct1とmgがほぼ重なっている場合は、ct1の前方へ逃がす
                warpDirection.set(0, 0, 1).applyQuaternion(targetModel.quaternion);
                warpDirection.y = 0;

            }

            if (warpDirection.lengthSq() > 0) {
                warpDirection.normalize();
            }

            mgModel.position.copy(targetModel.position).addScaledVector(warpDirection, mgWarpDistance);

            const targetAngle = Math.atan2(-warpDirection.x, -warpDirection.z);

            mgModel.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);

            // ワープ後は攻撃状態をリセットし、mgが再び近づいてこられるようにする
            mgIsAttacking = false;
            mgAttackTriggered = false;
            currentMgAttackType = null;
            stopMgAnimation();

            // ワープの演出として、ワープ先に青白い光を一瞬出す
            const flashPosition = mgModel.position.clone();
            flashPosition.y += 1.2;

            spawnFlashParticle(flashPosition, {
                radius: knockbackFlashRadius,
                duration: knockbackFlashDuration,
                maxScale: knockbackFlashMaxScale * 1.3,
                startOpacity: 1.0,
                color: 0x66ccff
            });

        }


        // ============================================================
        // mgがct1から離れすぎた場合、目の前へワープさせる
        // ============================================================
        function updateMgDistanceWarp() {

            if (!mgModel || !targetModel) return;
            if (mgIsAttacking) return; // 攻撃中は割り込ませない

            const dx = mgModel.position.x - targetModel.position.x;
            const dz = mgModel.position.z - targetModel.position.z;
            const distance = Math.hypot(dx, dz);

            if (distance <= mgMaxDistanceFromCt1) return;

            warpMgInFrontOfCt1();

        }


        function warpMgInFrontOfCt1() {

            if (!mgModel || !targetModel) return;

            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(targetModel.quaternion);
            forward.y = 0;

            if (forward.lengthSq() > 0) {
                forward.normalize();
            }

            mgModel.position.copy(targetModel.position).addScaledVector(forward, mgWarpToFrontDistance);

            const targetAngle = Math.atan2(-forward.x, -forward.z);
            mgModel.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);

            // ワープ後は攻撃状態をリセットし、mgが改めてct1を追えるようにする
            mgIsAttacking = false;
            mgAttackTriggered = false;
            currentMgAttackType = null;
            stopMgAnimation();

            // ワープの演出として、ワープ先に青白い光を一瞬出す
            const flashPosition = mgModel.position.clone();
            flashPosition.y += 1.2;

            spawnFlashParticle(flashPosition, {
                radius: knockbackFlashRadius,
                duration: knockbackFlashDuration,
                maxScale: knockbackFlashMaxScale * 1.3,
                startOpacity: 1.0,
                color: 0x66ccff
            });

        }


        // ============================================================
        // パーティクル共通処理
        // ============================================================
        const particles = [];


        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }


        function spawnFlashParticle(position, options) {

            const geometry = new THREE.SphereGeometry(options.radius, 12, 12);

            const material = new THREE.MeshBasicMaterial({
                color: options.color,
                transparent: true,
                opacity: options.startOpacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            scene.add(mesh);

            particles.push({
                kind: 'flash',
                mesh: mesh,
                elapsed: 0,
                duration: options.duration,
                maxScale: options.maxScale,
                startOpacity: options.startOpacity
            });

        }


        function spawnCubeBurst(position, params) {

            const spawnSpread = params.spawnSpread || 0;

            for (let i = 0; i < params.count; i++) {

                const size = randomRange(params.minSize, params.maxSize);

                const geometry = new THREE.BoxGeometry(
                    size,
                    size,
                    size * randomRange(0.15, 0.35)
                );

                const color = params.colorA.clone().lerp(params.colorB, Math.random());

                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                const mesh = new THREE.Mesh(geometry, material);

                const spawnPosition = position.clone();

                if (spawnSpread > 0) {
                    spawnPosition.x += randomRange(-spawnSpread, spawnSpread);
                    spawnPosition.y += randomRange(-spawnSpread * 0.4, spawnSpread);
                    spawnPosition.z += randomRange(-spawnSpread, spawnSpread);
                }

                mesh.position.copy(spawnPosition);

                mesh.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );

                const azimuth = Math.random() * Math.PI * 2;
                const elevation = randomRange(params.elevationMin, params.elevationMax);
                const horizontalRadius = Math.cos(elevation);

                const direction = new THREE.Vector3(
                    Math.cos(azimuth) * horizontalRadius,
                    Math.sin(elevation),
                    Math.sin(azimuth) * horizontalRadius
                );

                const speed = randomRange(params.minSpeed, params.maxSpeed);
                const velocity = direction.multiplyScalar(speed);

                const angularVelocity = new THREE.Vector3(
                    randomRange(-10, 10),
                    randomRange(-10, 10),
                    randomRange(-10, 10)
                );

                scene.add(mesh);

                particles.push({
                    kind: 'cube',
                    mesh: mesh,
                    elapsed: 0,
                    duration: randomRange(params.minDuration, params.maxDuration),
                    velocity: velocity,
                    angularVelocity: angularVelocity,
                    gravity: params.gravity,
                    startOpacity: 1.0,
                    startScale: 1.0
                });

            }

        }


        function updateParticles(delta) {

            for (let i = particles.length - 1; i >= 0; i--) {

                const effect = particles[i];
                effect.elapsed += delta;

                const t = Math.min(effect.elapsed / effect.duration, 1);

                if (effect.kind === 'flash') {

                    const scale = 1 + t * (effect.maxScale - 1);
                    effect.mesh.scale.set(scale, scale, scale);
                    effect.mesh.material.opacity = effect.startOpacity * (1 - t);

                } else {

                    effect.velocity.y -= effect.gravity * delta;
                    effect.mesh.position.addScaledVector(effect.velocity, delta);

                    effect.mesh.rotation.x += effect.angularVelocity.x * delta;
                    effect.mesh.rotation.y += effect.angularVelocity.y * delta;
                    effect.mesh.rotation.z += effect.angularVelocity.z * delta;

                    const scale = effect.startScale * (1 - t * 0.5);
                    effect.mesh.scale.set(scale, scale, scale);
                    effect.mesh.material.opacity = effect.startOpacity * (1 - t);

                }

                if (t >= 1) {
                    scene.remove(effect.mesh);
                    effect.mesh.geometry.dispose();
                    effect.mesh.material.dispose();
                    particles.splice(i, 1);
                }

            }

        }


        // ============================================================
        // mg attack1 の三日月エフェクト（強化版）
        //
        // attack1再生中、20フレーム目に到達した瞬間に1回だけ発生させる。
        // mgの前方を中心に、白〜黄色の細長いブロックを弧状（三日月状）に
        // 大袈裟に並べ、外側へ弾け飛ばしながらフェードアウトさせる。
        // ============================================================
        function spawnMgCrescentEffect() {

            if (!mgModel) return;

            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(mgModel.quaternion);
            forward.y = 0;

            if (forward.lengthSq() > 0) {
                forward.normalize();
            }

            const baseAngle = Math.atan2(forward.x, forward.z);

            const origin = mgModel.position.clone();
            origin.y += mgCrescentHeight;

            // 中心に閃光を一瞬出して、より大袈裟に見せる
            const flashOrigin = origin.clone().addScaledVector(forward, mgCrescentRadius);

            spawnFlashParticle(flashOrigin, {
                radius: mgCrescentFlashRadius,
                duration: mgCrescentFlashDuration,
                maxScale: mgCrescentFlashMaxScale,
                startOpacity: 1.0,
                color: mgCrescentFlashColor
            });

            for (let i = 0; i < mgCrescentArcSteps; i++) {

                const t = mgCrescentArcSteps <= 1 ? 0.5 : i / (mgCrescentArcSteps - 1);
                const angleOffset = (t - 0.5) * mgCrescentArcAngleRange;
                const angle = baseAngle + angleOffset;

                // 三日月らしく、中央ほど太く外側へ張り出すよう半径を調整する
                const edgeFactor = 1 - Math.abs(t - 0.5) * 2; // 0(両端)〜1(中央)
                const radius = mgCrescentRadius +
                    randomRange(-mgCrescentRadiusVariance, mgCrescentRadiusVariance * 0.5) +
                    edgeFactor * 0.4;

                const position = origin.clone();
                position.x += Math.sin(angle) * radius;
                position.z += Math.cos(angle) * radius;
                position.y += randomRange(-0.15, 0.3);

                const size = randomRange(mgCrescentCubeMinSize, mgCrescentCubeMaxSize) * (0.5 + edgeFactor * 0.8);

                const geometry = new THREE.BoxGeometry(
                    size,
                    size * randomRange(0.5, 0.9),
                    size * randomRange(0.2, 0.4)
                );

                const color = mgCrescentColorWhite.clone().lerp(mgCrescentColorYellow, Math.random());

                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(position);

                // 弧の接線方向を向かせ、刃らしいシルエットにする
                mesh.rotation.y = angle;
                mesh.rotation.z = randomRange(-0.3, 0.3);
                mesh.rotation.x = randomRange(-0.2, 0.2);

                scene.add(mesh);

                const outwardDirection = new THREE.Vector3(
                    Math.sin(angle),
                    randomRange(-0.1, 0.35),
                    Math.cos(angle)
                );

                if (outwardDirection.lengthSq() > 0) {
                    outwardDirection.normalize();
                }

                const velocity = outwardDirection.multiplyScalar(
                    mgCrescentOutwardSpeed * randomRange(0.6, 1.3)
                );

                particles.push({
                    kind: 'cube',
                    mesh: mesh,
                    elapsed: 0,
                    duration: randomRange(mgCrescentMinDuration, mgCrescentMaxDuration),
                    velocity: velocity,
                    angularVelocity: new THREE.Vector3(
                        randomRange(-4, 4),
                        randomRange(-4, 4),
                        randomRange(-4, 4)
                    ),
                    gravity: mgCrescentGravity,
                    startOpacity: 1.0,
                    startScale: 1.0
                });

            }

        }


        // ============================================================
        // ジャンプ衝撃波エフェクト
        // ============================================================
        const shockwaveFlashDuration = 0.12;
        const shockwaveFlashRadius = 0.5;
        const shockwaveFlashMaxScale = 3.2;
        const shockwaveFlashMaxOpacity = 1.0;
        const shockwaveFlashColor = 0xffffff;

        const shockwaveSparkCount = 55;
        const shockwaveSparkMinSpeed = 2.0;
        const shockwaveSparkMaxSpeed = 6.0;
        const shockwaveSparkMinSize = 0.08;
        const shockwaveSparkMaxSize = 0.24;

            });
