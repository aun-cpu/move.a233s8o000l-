<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ct1 Test</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #222;
        }

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<script>

    console.log("===== TEST START =====");

    // ============================================================
    // Scene
    // ============================================================

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x222222);


    // ============================================================
    // Camera
    // ============================================================

    const camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.001,
            10000
        );

    camera.position.set(
        0,
        1,
        5
    );


    // ============================================================
    // Renderer
    // ============================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    document.body.appendChild(
        renderer.domElement
    );


    // ============================================================
    // Light
    // ============================================================

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            3
        );

    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            5
        );

    directional.position.set(
        5,
        10,
        5
    );

    scene.add(
        directional
    );


    // ============================================================
    // GLTF Loader
    // ============================================================

    const loader =
        new THREE.GLTFLoader();


    console.log(
        "ct1.glb の読み込み開始"
    );


    loader.load(

        "./ct1.glb",

        function(gltf) {

            console.log(
                "★★★★★★★★★★★★★★★★"
            );

            console.log(
                "ct1.glb 読み込み成功"
            );

            console.log(
                "★★★★★★★★★★★★★★★★"
            );


            const model =
                gltf.scene;


            // ====================================================
            // モデルをシーンに追加
            // ====================================================

            scene.add(
                model
            );


            // ====================================================
            // 全Mesh確認
            // ====================================================

            let meshCount = 0;

            model.traverse(
                function(object) {

                    console.log(
                        "OBJECT:",
                        object.type,
                        object.name
                    );

                    if (
                        object.isMesh
                    ) {

                        meshCount++;

                        object.visible =
                            true;

                        object.frustumCulled =
                            false;

                        if (
                            object.material
                        ) {

                            object.material.visible =
                                true;

                        }

                    }

                }
            );


            console.log(
                "Mesh数:",
                meshCount
            );


            // ====================================================
            // 初期変換をリセット
            // ====================================================

            model.position.set(
                0,
                0,
                0
            );

            model.rotation.set(
                0,
                0,
                0
            );

            model.scale.set(
                1,
                1,
                1
            );


            // ====================================================
            // 行列更新
            // ====================================================

            scene.updateMatrixWorld(
                true
            );


            // ====================================================
            // BoundingBox
            // ====================================================

            const box =
                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const size =
                new THREE.Vector3();

            const center =
                new THREE.Vector3();


            box.getSize(
                size
            );

            box.getCenter(
                center
            );


            console.log(
                "BoundingBox:",
                box
            );

            console.log(
                "モデルサイズ:",
                size.x,
                size.y,
                size.z
            );

            console.log(
                "モデル中心:",
                center.x,
                center.y,
                center.z
            );


            // ====================================================
            // 自動的にモデルの正面へカメラ配置
            // ====================================================

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            let distance =
                maxSize * 2;


            if (
                !isFinite(distance) ||
                distance <= 0
            ) {

                distance = 5;

            }


            camera.position.set(
                center.x,
                center.y,
                center.z + distance
            );


            camera.lookAt(
                center
            );


            console.log(
                "カメラ位置:",
                camera.position
            );


            console.log(
                "表示処理完了"
            );

        },


        // ========================================================
        // Loading Progress
        // ========================================================

        function(xhr) {

            console.log(
                "読み込み:",
                xhr.loaded,
                "/",
                xhr.total
            );

        },


        // ========================================================
        // Error
        // ========================================================

        function(error) {

            console.error(
                "!!!!!!!!!!!!!!!!!!!!!!!!"
            );

            console.error(
                "ct1.glb 読み込み失敗"
            );

            console.error(
                error
            );

            console.error(
                "!!!!!!!!!!!!!!!!!!!!!!!!"
            );

        }

    );


    // ============================================================
    // Render
    // ============================================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        renderer.render(
            scene,
            camera
        );

    }

    animate();


    // ============================================================
    // Resize
    // ============================================================

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>
