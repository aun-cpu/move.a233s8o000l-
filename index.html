<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer - Target Follow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; }
        #canvas-container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // --- カメラ追従用の設定値 ---
        // 距離と高さを詰めて、より近づくよう数値を小さく変更 (x: 0, y: 高さ, z: 後方距離)
        const cameraOffset = new THREE.Vector3(0, 2, 2.2); 

        let targetModel = null;
        let mixer = null;
        const clock = new THREE.Clock();

        const loader = new THREE.GLTFLoader();

        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;

                // --- ct1 を反対（180度）に向かせる設定 ---
                targetModel.rotation.y = Math.PI; // 180度（πラジアン）回転

                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                updateCameraPosition();
                
                console.log('ct1.glb の読み込みと配置に成功しました');
            },
            undefined,
            function (error) {
                console.error('ct1.glb の読み込みエラー:', error);
            }
        );

        function updateCameraPosition() {
            if (!targetModel) return;

            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);

            // モデルの回転（向き）に合わせた相対オフセットを計算
            const offset = cameraOffset.clone().applyQuaternion(targetModel.quaternion);
            
            camera.position.copy(modelPosition).add(offset);
            controls.target.copy(modelPosition);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }

            if (targetModel) {
                updateCameraPosition();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
