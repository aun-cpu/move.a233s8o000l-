<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - Move D-Pad & Right Screen Camera Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        /* --------------------------------------------------
            左下：移動用 4方向矢印ボタンUI（D-Pad）
        -------------------------------------------------- */
        #dpad-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-arrow {
            position: absolute;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn-arrow:active, .btn-arrow.active {
            background: rgba(255, 255, 255, 0.6);
        }

        #btn-up    { top: 0; left: 52px; }
        #btn-down  { bottom: 0; left: 52px; }
        #btn-left  { top: 52px; left: 0; }
        #btn-right { top: 52px; right: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 左下：移動用 4方向矢印ボタンUI -->
    <div id="dpad-container">
        <div id="btn-up" class="btn-arrow">▲</div>
        <div id="btn-left" class="btn-arrow">◀</div>
        <div id="btn-right" class="btn-arrow">▶</div>
        <div id="btn-down" class="btn-arrow">▼</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const targetHeightOffset = 1.5;
        const cameraDistance = 1.6;

        // 視点角（極座標）管理
        let cameraSpherical = new THREE.Spherical(cameraDistance, Math.PI / 2.2, Math.PI);
        const minPolarAngle = 0.1;
        const maxPolarAngle = Math.PI / 2 - 0.05;

        let targetModel = null;
        let bgModel = null;
        let mixer = null;
        let actions = [];
        let currentAction = null;
        const clock = new THREE.Clock();

        const maxMoveSpeed = 4.0;
        const rotationSpeed = 10.0;
        const cameraTouchSensitivity = 0.005; // 画面右側のスワイプ感度

        const loader = new THREE.GLTFLoader();

        // 1. 背景モデル (bg.glb)
        loader.load(
            './bg.glb',
            function (gltf) {
                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);
                bgModel.traverse((child) => {
                    if (child.isMesh) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach((mat) => { mat.wireframe = true; });
                        } else if (child.material) {
                            child.material.wireframe = true;
                        }
                    }
                });
                scene.add(bgModel);
            },
            undefined,
            function (error) { console.error('bg.glb の読み込みエラー:', error); }
        );

        // 2. ターゲットモデル (ct1.glb)
        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;
                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    gltf.animations.forEach((clip) => {
                        actions.push(mixer.clipAction(clip));
                    });
                    setAction(0);
                }

                updateCameraPosition();
            },
            undefined,
            function (error) { console.error('ct1.glb の読み込みエラー:', error); }
        );

        function setAction(index) {
            if (!mixer || !actions[index]) return;
            const nextAction = actions[index];
            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().fadeIn(0.2).play();
                currentAction = nextAction;
            }
        }

        // カメラ位置の更新計算
        function updateCameraPosition() {
            if (!targetModel) return;

            const targetPosition = targetModel.position.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const offset = new THREE.Vector3().setFromSpherical(cameraSpherical);

            camera.position.copy(targetPosition).add(offset);
            camera.lookAt(targetPosition);
        }

        // ============================================================
        // 移動用 D-Pad ボタンイベント
        // ============================================================
        const keyState = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        function bindButtonEvents(elementId, direction) {
            const btn = document.getElementById(elementId);

            const startPress = (e) => {
                e.preventDefault();
                e.stopPropagation();

                keyState[direction] = true;
                btn.classList.add('active');
            };

            const endPress = (e) => {
                e.preventDefault();
                e.stopPropagation();

                keyState[direction] = false;
                btn.classList.remove('active');
            };

            btn.addEventListener('pointerdown', startPress, { passive: false });
            btn.addEventListener('pointerup', endPress, { passive: false });
            btn.addEventListener('pointercancel', endPress, { passive: false });
            btn.addEventListener('pointerleave', endPress, { passive: false });
        }

        bindButtonEvents('btn-up', 'up');
        bindButtonEvents('btn-down', 'down');
        bindButtonEvents('btn-left', 'left');
        bindButtonEvents('btn-right', 'right');

        // キーボード操作対応
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = false;
        });

        // ============================================================
        // 画面右側領域での 視点（カメラ）操作（ドラッグ / スワイプ）
        // ============================================================
        let isCameraDragging = false;
        let cameraTouchId = null;
        let previousTouchX = 0;
        let previousTouchY = 0;

        function handleRightScreenStart(e) {
            // 左下のUI（D-Pad）上のクリックイベントは除外
            if (e.target.closest('#dpad-container')) {
                return;
            }

            const touch = e.changedTouches ? e.changedTouches[0] : e;

            // 画面の右半分の領域のみ視点操作を開始
            if (touch.clientX >= window.innerWidth / 2) {
                isCameraDragging = true;
                cameraTouchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
            }
        }

        function handleRightScreenMove(e) {
            if (!isCameraDragging) return;

            let touch = null;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === cameraTouchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }
            } else {
                touch = e;
            }

            if (touch) {
                // ドラッグ位置が画面の左半分（画面右側境界）を超えたら無効化してドラッグ終了
                if (touch.clientX < window.innerWidth / 2) {
                    isCameraDragging = false;
                    cameraTouchId = null;
                    return;
                }

                const deltaX = touch.clientX - previousTouchX;
                const deltaY = touch.clientY - previousTouchY;

                // 視点（カメラ）の旋回・ピッチ更新
                cameraSpherical.theta -= deltaX * cameraTouchSensitivity;
                // 上下操作の反転（+= から -= に変更）
                cameraSpherical.phi -= deltaY * cameraTouchSensitivity;
                cameraSpherical.phi = Math.max(minPolarAngle, Math.min(maxPolarAngle, cameraSpherical.phi));

                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
            }
        }

        function handleRightScreenEnd(e) {
            if (!isCameraDragging) return;

            let isTargetRelease = false;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === cameraTouchId) {
                        isTargetRelease = true;
                        break;
                    }
                }
            } else {
                isTargetRelease = true;
            }

            if (isTargetRelease) {
                isCameraDragging = false;
                cameraTouchId = null;
            }
        }

        window.addEventListener('pointerdown', handleRightScreenStart, { passive: false });
        window.addEventListener('pointermove', handleRightScreenMove, { passive: false });
        window.addEventListener('pointerup', handleRightScreenEnd, { passive: false });
        window.addEventListener('pointercancel', handleRightScreenEnd, { passive: false });

        // ============================================================
        // 移動・フレーム更新処理
        // ============================================================
        function updateModelMovement(delta) {
            if (!targetModel) return;

            let moveX = 0;
            let moveY = 0;
            let currentSpeed = 0;

            // D-Pad / キーボード入力計算
            let inputX = 0;
            let inputY = 0;

            if (keyState.right) inputX += 1;
            if (keyState.left)  inputX -= 1;
            if (keyState.up)    inputY -= 1;
            if (keyState.down)  inputY += 1;

            if (inputX !== 0 || inputY !== 0) {
                const length = Math.hypot(inputX, inputY);
                moveX = inputX / length;
                moveY = inputY / length;
                currentSpeed = maxMoveSpeed;
            }

            const isMoving = currentSpeed > 0;

            if (isMoving) {
                if (actions.length > 1) {
                    setAction(1);
                }

                // カメラの向きに基づいた移動ベクトル
                const cameraForward = new THREE.Vector3();
                camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDirection = new THREE.Vector3()
                    .addScaledVector(cameraRight, moveX)
                    .addScaledVector(cameraForward, -moveY)
                    .normalize();

                targetModel.position.addScaledVector(moveDirection, currentSpeed * delta);

                // 移動方向へ旋回
                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                const targetQuaternion = new THREE.Quaternion();
                targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
                targetModel.quaternion.slerp(targetQuaternion, rotationSpeed * delta);

            } else {
                if (actions.length > 0) {
                    setAction(0);
                }
            }
        }

        // ============================================================
        // メインループ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateModelMovement(delta);

            if (mixer) {
                mixer.update(delta);
            }

            updateCameraPosition();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
