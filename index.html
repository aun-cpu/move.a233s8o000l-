<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Viewer - D-Pad Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        /* 視点操作（カメラ制御）専用エリア（画面右側60%） */
        #camera-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            z-index: 10;
            touch-action: none;
        }

        /* 左下に配置する方向キー（D-Pad）コンテナ */
        #dpad-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 方向ボタンの共通スタイル */
        .btn-arrow {
            position: absolute;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        /* ボタン押下時の視覚効果 */
        .btn-arrow:active, .btn-arrow.active {
            background: rgba(255, 255, 255, 0.6);
        }

        /* 上下左右の個別配置 */
        #btn-up    { top: 0; left: 52px; }
        #btn-down  { bottom: 0; left: 52px; }
        #btn-left  { top: 52px; left: 0; }
        #btn-right { top: 52px; right: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- 視点操作用エリア -->
    <div id="camera-touch-zone"></div>

    <!-- 4方向矢印ボタンUI -->
    <div id="dpad-container">
        <div id="btn-up" class="btn-arrow">▲</div>
        <div id="btn-left" class="btn-arrow">◀</div>
        <div id="btn-right" class="btn-arrow">▶</div>
        <div id="btn-down" class="btn-arrow">▼</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // OrbitControls を右側領域(#camera-touch-zone)だけにバインド
        const touchZone = document.getElementById('camera-touch-zone');
        const controls = new THREE.OrbitControls(camera, touchZone);
        controls.enableDamping = true;
        controls.enableZoom = false; // ズーム機能オフ

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const targetHeightOffset = 1.5;
        const cameraOffset = new THREE.Vector3(0, 0.4, -1.6); 

        let targetModel = null;
        let bgModel = null;
        let mixer = null;
        let actions = [];
        let currentAction = null;
        const clock = new THREE.Clock();

        const moveSpeed = 4.0;
        const rotationSpeed = 10.0;

        const loader = new THREE.GLTFLoader();

        // 1. 背景モデル (bg.glb)
        loader.load(
            './bg.glb',
            function (gltf) {
                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);
                bgModel.traverse((child) => {
                    if (child.isMesh) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach((mat) => { mat.wireframe = true; });
                        } else if (child.material) {
                            child.material.wireframe = true;
                        }
                    }
                });
                scene.add(bgModel);
            },
            undefined,
            function (error) { console.error('bg.glb の読み込みエラー:', error); }
        );

        // 2. ターゲットモデル (ct1.glb)
        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;
                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    gltf.animations.forEach((clip) => {
                        actions.push(mixer.clipAction(clip));
                    });
                    setAction(0);
                }

                initCameraPosition();
            },
            undefined,
            function (error) { console.error('ct1.glb の読み込みエラー:', error); }
        );

        function setAction(index) {
            if (!mixer || !actions[index]) return;
            const nextAction = actions[index];
            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().fadeIn(0.2).play();
                currentAction = nextAction;
            }
        }

        function initCameraPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const offset = cameraOffset.clone().applyQuaternion(targetModel.quaternion);
            
            camera.position.copy(targetPosition).add(offset);
            controls.target.copy(targetPosition);
            controls.update();
        }

        function followModelPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const deltaPosition = targetPosition.clone().sub(controls.target);

            controls.target.add(deltaPosition);
            camera.position.add(deltaPosition);
        }

        // ============================================================
        // 矢印ボタン（方向キー）の入力処理
        // ============================================================
        const keyState = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        function bindButtonEvents(elementId, direction) {
            const btn = document.getElementById(elementId);

            const startPress = (e) => {
                e.preventDefault();
                e.stopPropagation();
                keyState[direction] = true;
                btn.classList.add('active');
            };

            const endPress = (e) => {
                e.preventDefault();
                e.stopPropagation();
                keyState[direction] = false;
                btn.classList.remove('active');
            };

            btn.addEventListener('pointerdown', startPress);
            btn.addEventListener('pointerup', endPress);
            btn.addEventListener('pointercancel', endPress);
            btn.addEventListener('pointerleave', endPress);
        }

        bindButtonEvents('btn-up', 'up');
        bindButtonEvents('btn-down', 'down');
        bindButtonEvents('btn-left', 'left');
        bindButtonEvents('btn-right', 'right');

        // キーボード（PC用）の互換処理
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keyState.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keyState.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keyState.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keyState.right = false;
        });

        // ============================================================
        // モデルの移動・回転計算
        // ============================================================
        function updateModelMovement(delta) {
            if (!targetModel) return;

            let inputX = 0;
            let inputY = 0;

            if (keyState.right) inputX += 1;
            if (keyState.left)  inputX -= 1;
            if (keyState.up)    inputY -= 1; // 画面上方向（前進）
            if (keyState.down)  inputY += 1; // 画面下方向（後退）

            const isMoving = inputX !== 0 || inputY !== 0;

            if (isMoving) {
                if (actions.length > 1) {
                    setAction(1);
                }

                const cameraForward = new THREE.Vector3();
                camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDirection = new THREE.Vector3()
                    .addScaledVector(cameraRight, inputX)
                    .addScaledVector(cameraForward, -inputY)
                    .normalize();

                targetModel.position.addScaledVector(moveDirection, moveSpeed * delta);

                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                const targetQuaternion = new THREE.Quaternion();
                targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
                targetModel.quaternion.slerp(targetQuaternion, rotationSpeed * delta);

            } else {
                if (actions.length > 0) {
                    setAction(0);
                }
            }
        }

        // ============================================================
        // メインループ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateModelMovement(delta);

            if (mixer) {
                mixer.update(delta);
            }

            if (targetModel) {
                followModelPosition();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
