    const joystickContainer =
        document.getElementById(
            'joystick-container'
        );
    const joystickStick =
        document.getElementById(
            'joystick-stick'
        );
    let joystickPointerId = null;
    let joystickX = 0;
    let joystickY = 0;
    const joystickRadius = 52;
    const joystickDeadZone = 0.08;
    function updateJoystick(
        clientX,
        clientY
    ) {
        const rect =
            joystickContainer
                .getBoundingClientRect();
        const centerX =
            rect.left +
            rect.width / 2;
        const centerY =
            rect.top +
            rect.height / 2;
        let dx =
            clientX -
            centerX;
        let dy =
            clientY -
            centerY;
        const distance =
            Math.hypot(dx, dy);
        if (
            distance >
            joystickRadius
        ) {
            dx =
                dx / distance *
                joystickRadius;
            dy =
                dy / distance *
                joystickRadius;
        }
        joystickStick.style.transform =
            `translate(${dx}px, ${dy}px)`;
        joystickX =
            dx / joystickRadius;
        joystickY =
            dy / joystickRadius;
        const normalizedDistance =
            Math.hypot(
                joystickX,
                joystickY
            );
        if (
            normalizedDistance <
            joystickDeadZone
        ) {
            joystickX = 0;
            joystickY = 0;
        }
    }
    function resetJoystick() {
        joystickPointerId = null;
        joystickX = 0;
        joystickY = 0;
        joystickStick.style.transform =
            'translate(0px, 0px)';
    }
    function handleJoystickStart(e) {
        e.preventDefault();
        e.stopPropagation();
        if (
            joystickPointerId !== null
        ) {
            return;
        }
        joystickPointerId =
            e.pointerId;
        try {
            joystickContainer
                .setPointerCapture(
                    e.pointerId
                );
        } catch (err) {}
        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
    function handleJoystickMove(e) {
        if (
            e.pointerId !==
            joystickPointerId
        ) {
            return;
        }
        e.preventDefault();
        e.stopPropagation();
        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
    function handleJoystickEnd(e) {
        if (
            e.pointerId !==
            joystickPointerId
        ) {
            return;
        }
        e.preventDefault();
        e.stopPropagation();
        try {
            if (
                joystickContainer
                    .hasPointerCapture(
                        e.pointerId
                    )
            ) {
                joystickContainer
                    .releasePointerCapture(
                        e.pointerId
                    );
            }
        } catch (err) {}
        resetJoystick();
    }
    joystickContainer.addEventListener(
        'pointerdown',
        handleJoystickStart,
        { passive: false }
    );
    joystickContainer.addEventListener(
        'pointermove',
        handleJoystickMove,
        { passive: false }
    );
    joystickContainer.addEventListener(
        'pointerup',
        handleJoystickEnd,
        { passive: false }
    );
    joystickContainer.addEventListener(
        'pointercancel',
        handleJoystickEnd,
        { passive: false }
    );
    // ============================================================
    // キーボード
    // ============================================================
    const keyState = {
        up: false,
        down: false,
        left: false,
        right: false
    };
    window.addEventListener(
        'keydown',
        (e) => {
            if (
                e.key === 'ArrowUp' ||
                e.key === 'w'
            ) {
                keyState.up = true;
            }
            if (
                e.key === 'ArrowDown' ||
                e.key === 's'
            ) {
                keyState.down = true;
            }
            if (
                e.key === 'ArrowLeft' ||
                e.key === 'a'
            ) {
                keyState.left = true;
            }
            if (
                e.key === 'ArrowRight' ||
                e.key === 'd'
            ) {
                keyState.right = true;
            }
        }
    );
    window.addEventListener(
        'keyup',
        (e) => {
            if (
                e.key === 'ArrowUp' ||
                e.key === 'w'
            ) {
                keyState.up = false;
            }
            if (
                e.key === 'ArrowDown' ||
                e.key === 's'
            ) {
                keyState.down = false;
            }
            if (
                e.key === 'ArrowLeft' ||
                e.key === 'a'
            ) {
                keyState.left = false;
            }
            if (
                e.key === 'ArrowRight' ||
                e.key === 'd'
            ) {
                keyState.right = false;
            }
        }
    );
    // ============================================================
    // カメラ操作
    // ============================================================
    let isCameraDragging = false;
    let cameraPointerId = null;
    let previousTouchX = 0;
    let previousTouchY = 0;
    function handleRightScreenStart(e) {
        if (
            e.target.closest(
                '#joystick-container'
            )
        ) {
            return;
        }
        if (
            e.target.closest(
                '#jump-button'
            )
        ) {
            return;
        }
        if (
            e.target.closest(
                '#dash-button'
            )
        ) {
            return;
        }
        if (
            e.target.closest(
                '#at-button'
            )
        ) {
            return;
        }
        if (isCameraDragging) return;
        if (
            e.clientX >=
            window.innerWidth / 2
        ) {
            e.preventDefault();
            isCameraDragging = true;
            cameraPointerId =
                e.pointerId;
            previousTouchX =
                e.clientX;
            previousTouchY =
                e.clientY;
            try {
                renderer.domElement
                    .setPointerCapture(
                        e.pointerId
                    );
            } catch (err) {}
        }
    }
    function handleRightScreenMove(e) {
        if (!isCameraDragging) return;
        if (
            e.pointerId !==
            cameraPointerId
        ) {
            return;
        }
        e.preventDefault();
        const deltaX =
            e.clientX -
            previousTouchX;
        const deltaY =
            e.clientY -
            previousTouchY;
        cameraSpherical.theta -=
            deltaX *
            cameraTouchSensitivity;
        cameraSpherical.phi -=
            deltaY *
            cameraTouchSensitivity;
        cameraSpherical.phi =
            Math.max(
                minPolarAngle,
                Math.min(
                    maxPolarAngle,
                    cameraSpherical.phi
                )
            );
        previousTouchX =
            e.clientX;
        previousTouchY =
            e.clientY;
    }
    function handleRightScreenEnd(e) {
        if (!isCameraDragging) return;
        if (
            e.pointerId !==
            cameraPointerId
        ) {
            return;
        }
        e.preventDefault();
        isCameraDragging = false;
        try {
            if (
                renderer.domElement
                    .hasPointerCapture(
                        e.pointerId
                    )
            ) {
                renderer.domElement
                    .releasePointerCapture(
                        e.pointerId
                    );
            }
        } catch (err) {}
        cameraPointerId = null;
    }
    window.addEventListener(
        'pointerdown',
        handleRightScreenStart,
        { passive: false }
    );
    window.addEventListener(
        'pointermove',
        handleRightScreenMove,
        { passive: false }
    );
    window.addEventListener(
        'pointerup',
        handleRightScreenEnd,
        { passive: false }
    );
    window.addEventListener(
        'pointercancel',
        handleRightScreenEnd,
        { passive: false }
    );
    // ============================================================
    // ct1移動アニメーション
    // ============================================================
    function updateMovementAnimation() {
        if (hasMoveInput()) {
            if (actions.dash) {
                setAction('dash');
            }
        } else {
            if (actions.idle) {
                setAction('idle');
            }
        }
    }
    // ============================================================
    // ct1移動
    // ============================================================
    function updateModelMovement(delta) {
        if (!targetModel) return;
        if (isDashing) return;
        if (isCt1Knockback) return;
        let moveX = joystickX;
        let moveY = joystickY;
        let currentSpeed = 0;
        let keyboardX = 0;
        let keyboardY = 0;
        if (keyState.right) keyboardX += 1;
        if (keyState.left) keyboardX -= 1;
        if (keyState.up) keyboardY -= 1;
        if (keyState.down) keyboardY += 1;
        if (
            keyboardX !== 0 ||
            keyboardY !== 0
        ) {
            const length =
                Math.hypot(
                    keyboardX,
                    keyboardY
                );
            moveX =
                keyboardX /
                length;
            moveY =
                keyboardY /
                length;
            currentSpeed =
                maxMoveSpeed;
        } else {
            if (
                moveX !== 0 ||
                moveY !== 0
            ) {
                currentSpeed =
                    maxMoveSpeed;
            } else {
                currentSpeed = 0;
            }
        }
        const isMoving =
            currentSpeed > 0;
        if (isJumping || isAttacking1 || isAttacking2) {
            currentSpeed *=
                jumpMoveSpeedFactor;
        }
        if (!isJumping && !isAttacking1 && !isAttacking2) {
            if (isMoving) {
                if (actions.dash) {
                    setAction('dash');
                }
            } else {
                if (actions.idle) {
                    setAction('idle');
                }
            }
        }
        if (isMoving) {
            const cameraForward =
                new THREE.Vector3();
            camera.getWorldDirection(
                cameraForward
            );
            cameraForward.y = 0;
            cameraForward.normalize();
            const cameraRight =
                new THREE.Vector3();
            cameraRight.crossVectors(
                cameraForward,
                new THREE.Vector3(0, 1, 0)
            ).normalize();
            const moveDirection =
                new THREE.Vector3();
            moveDirection
                .addScaledVector(
                    cameraRight,
                    moveX
                )
                .addScaledVector(
                    cameraForward,
                    -moveY
                );
            if (
                moveDirection.lengthSq() > 0
            ) {
                moveDirection.normalize();
            }
            targetModel.position
                .addScaledVector(
                    moveDirection,
                    currentSpeed * delta
                );
            const targetAngle =
                Math.atan2(
                    moveDirection.x,
                    moveDirection.z
                );
            const targetQuaternion =
                new THREE.Quaternion();
            targetQuaternion.setFromAxisAngle(
                new THREE.Vector3(0, 1, 0),
                targetAngle
            );
            targetModel.quaternion.slerp(
                targetQuaternion,
                rotationSpeed * delta
            );
        }
    }
    // ============================================================
    // メインループ
    // ============================================================
    function animate() {
        requestAnimationFrame(
            animate
        );
        const delta =
            clock.getDelta();
        // ct1操作
        updateModelMovement(
            delta
        );
        // mg接近・攻撃
        updateMgMovement(
            delta
        );
        // ct1ノックバック
        updateCt1Knockback(
            delta
        );
        // ct1ダッシュ
        updateDash(
            delta
        );
        // AT攻撃の前進ステップ（瞬間移動ではなく滑らかに移動）
        updateAtForwardSteps(
            delta
        );
        // ct1距離制限
        clampCt1DistanceFromMg();
        // mg距離ワープ
        updateMgDistanceWarp();
        // パーティクル
        updateParticles(
            delta
        );
        // 斬撃エフェクト
        updateSlashEffect(
            delta
        );
        // ========================================================
        // ct1アニメーション
        // ========================================================
        if (mixer) {
            mixer.update(
                delta
            );
            if (
                isJumping &&
                actions.jump
            ) {
                jumpFrameCount =
                    Math.floor(
                        actions.jump.time *
                        animationFPS
                    );
                if (
                    !jumpShockwaveSpawned &&
                    jumpFrameCount >=
                    shockwaveFrame
                ) {
                    spawnJumpImpactEffects();
                    triggerCameraShake();
                    jumpShockwaveSpawned = true;
                }
                updateCt1JumpAttackHit();
                if (
                    jumpFrameCount >=
                    jumpTransitionFrame &&
                    hasMoveInput()
                ) {
                    isJumping = false;
                    updateMovementAnimation();
                }
            }
            if (
                isAttacking1 &&
                actions.at1
            ) {
                // ★ at1は1.5倍速なので、
                //   timeの進行も1.5倍になる。
                at1FrameCount =
                    Math.floor(
                        actions.at1.time *
                        animationFPS
                    );

                // at1の15フレーム目に、その時点でct1が向いている方向へ滑らかに1進む。
                if (
                    !at1ForwardStepApplied &&
                    at1FrameCount >= 15
                ) {
                    startAtForwardStep(
                        'at1',
                        atAttackForwardStepDistance
                    );
                    at1ForwardStepApplied = true;
                }

                updateCt1At1Hit();
            }

            if (
                isAttacking2 &&
                actions.at2
            ) {
                at2FrameCount =
                    Math.floor(
                        actions.at2.time *
                        animationFPS
                    );

                // at2の10フレーム目に、その時点でct1が向いている方向へ滑らかに1進む。
                if (
                    !at2ForwardStepApplied &&
                    at2FrameCount >= 10
                ) {
                    startAtForwardStep(
                        'at2',
                        atAttackForwardStepDistance
                    );
                    at2ForwardStepApplied = true;
                }

                updateCt1At2Hit();
            }
        }
        // ========================================================
        // mgアニメーション
        // ========================================================
        if (mgMixer) {
            mgMixer.update(
                delta
            );
            if (mgIsAttacking) {
                const activeMgAttackAction =
                    currentMgAttackType ===
                    'attack2'
                        ? mgActions.attack2
                        : mgActions.attack1;
                if (activeMgAttackAction) {
                    mgAttackFrameCount =
                        Math.floor(
                            activeMgAttackAction.time *
                            animationFPS
                        );
                    if (
                        currentMgAttackType ===
                        'attack1'
                    ) {
                        if (
                            !mgCrescentSpawned &&
                            mgAttackFrameCount >=
                            mgCrescentFrame
                        ) {
                            spawnMgCrescentEffect();
                            mgCrescentSpawned = true;
                        }
                        if (
                            !mgAttackShakeSpawned &&
                            mgAttackFrameCount >=
                            mgAttackShakeFrame
                        ) {
                            triggerCameraShake();
                            mgAttackShakeSpawned = true;
                        }
                    }
                }
            }
            if (mgLeftBone1) {
                mgLeftBone1.rotation.z =
                    mgFixedBoneAngleLeft;
            }
            if (mgRightBone1) {
                mgRightBone1.rotation.z =
                    mgFixedBoneAngleRight;
            }
        }
        // mg攻撃当たり判定
        updateMgAttackHit(
            delta
        );
        // ========================================================
        // ct1ジャンプ高さ
        // ========================================================
        if (rootBone) {
            targetModel.updateMatrixWorld(
                true
            );
            rootBone.getWorldPosition(
                rootBoneWorldPosition
            );
            jumpHeightOffset =
                rootBoneWorldPosition.y -
                rootBoneRestY;
        }
        // カメラ
        updateCameraPosition();
        applyCameraShake(
            delta
        );
        renderer.render(
            scene,
            camera
        );
    }
    animate();
    // ============================================================
    // リサイズ
    // ============================================================
    window.addEventListener(
        'resize',
        () => {
            camera.aspect =
                window.innerWidth /
                window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );
</script>
</body>
</html>
