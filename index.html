<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer - Dynamic Joystick Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #1a1a1a; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; }

        /* 動的ジョイスティックUI（初期状態は非表示） */
        #joystick-container {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            user-select: none;
            z-index: 100;
            display: none; /* タッチ時のみ表示 */
            pointer-events: none; /* マウス/タッチイベントを妨げない */
            transform: translate(-50%, -50%); /* タッチ位置を中心にする */
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 画面操作時に出現する動的ジョイスティックUI -->
    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false; // ズーム禁止

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const targetHeightOffset = 1.5;
        const cameraOffset = new THREE.Vector3(0, 0.4, -1.6); 

        let targetModel = null;
        let bgModel = null;
        let mixer = null;
        let actions = [];
        let currentAction = null;
        const clock = new THREE.Clock();

        const moveSpeed = 4.0;
        const rotationSpeed = 10.0;

        const loader = new THREE.GLTFLoader();

        // 1. 背景モデル (bg.glb)
        loader.load(
            './bg.glb',
            function (gltf) {
                bgModel = gltf.scene;
                bgModel.scale.set(2, 2, 2);
                bgModel.traverse((child) => {
                    if (child.isMesh) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach((mat) => { mat.wireframe = true; });
                        } else if (child.material) {
                            child.material.wireframe = true;
                        }
                    }
                });
                scene.add(bgModel);
            },
            undefined,
            function (error) { console.error('bg.glb の読み込みエラー:', error); }
        );

        // 2. ターゲットモデル (ct1.glb)
        loader.load(
            './ct1.glb',
            function (gltf) {
                targetModel = gltf.scene;
                targetModel.rotation.y = Math.PI;
                scene.add(targetModel);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(targetModel);
                    gltf.animations.forEach((clip) => {
                        actions.push(mixer.clipAction(clip));
                    });
                    setAction(0);
                }

                initCameraPosition();
            },
            undefined,
            function (error) { console.error('ct1.glb の読み込みエラー:', error); }
        );

        function setAction(index) {
            if (!mixer || !actions[index]) return;
            const nextAction = actions[index];
            if (currentAction !== nextAction) {
                if (currentAction) currentAction.fadeOut(0.2);
                nextAction.reset().fadeIn(0.2).play();
                currentAction = nextAction;
            }
        }

        function initCameraPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const offset = cameraOffset.clone().applyQuaternion(targetModel.quaternion);
            
            camera.position.copy(targetPosition).add(offset);
            controls.target.copy(targetPosition);
            controls.update();
        }

        function followModelPosition() {
            if (!targetModel) return;
            const modelPosition = new THREE.Vector3();
            targetModel.getWorldPosition(modelPosition);
            const targetPosition = modelPosition.clone().add(new THREE.Vector3(0, targetHeightOffset, 0));
            const deltaPosition = targetPosition.clone().sub(controls.target);

            controls.target.add(deltaPosition);
            camera.position.add(deltaPosition);
        }

        // ============================================================
        // 動的ジョイスティック処理（画面左1/3領域）
        // ============================================================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickStick = document.getElementById('joystick-stick');
        
        let joystickInput = { x: 0, y: 0 };
        let activeTouchId = null;
        let joystickCenter = { x: 0, y: 0 };
        const maxRadius = 40; // 可動半径（px）

        function handlePointerDown(e) {
            if (activeTouchId !== null) return;

            const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
            const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);

            // 画面左側 1/3 (33.3%) の領域内であるか判定
            if (clientX <= window.innerWidth / 3) {
                activeTouchId = e.pointerId ?? (e.changedTouches ? e.changedTouches[0].identifier : 'mouse');

                // タッチした位置を中心にジョイスティックを表示
                joystickCenter.x = clientX;
                joystickCenter.y = clientY;

                joystickContainer.style.left = `${clientX}px`;
                joystickContainer.style.top = `${clientY}px`;
                joystickContainer.style.display = 'block';

                updateJoystick(clientX, clientY);
            }
        }

        function handlePointerMove(e) {
            if (activeTouchId === null) return;

            let touch = null;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }
            } else if (e.pointerId === activeTouchId || activeTouchId === 'mouse') {
                touch = e;
            }

            if (touch) {
                updateJoystick(touch.clientX, touch.clientY);
            }
        }

        function handlePointerUp(e) {
            if (activeTouchId === null) return;

            let shouldReset = false;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        shouldReset = true;
                        break;
                    }
                }
            } else {
                shouldReset = true;
            }

            if (shouldReset) {
                resetJoystick();
            }
        }

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystickCenter.x;
            let dy = clientY - joystickCenter.y;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            joystickInput.x = dx / maxRadius;
            joystickInput.y = dy / maxRadius;
        }

        function resetJoystick() {
            activeTouchId = null;
            joystickInput.x = 0;
            joystickInput.y = 0;
            joystickStick.style.transform = 'translate(-50%, -50%)';
            joystickContainer.style.display = 'none'; // 手を離したら消去
        }

        // イベント登録（stopPropagation は使用せずバブリングを邪魔しない）
        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);

        // ============================================================
        // モデルの移動・回転ロジック
        // ============================================================
        function updateModelMovement(delta) {
            if (!targetModel) return;

            const isMoving = Math.abs(joystickInput.x) > 0.05 || Math.abs(joystickInput.y) > 0.05;

            if (isMoving) {
                if (actions.length > 1) {
                    setAction(1);
                }

                const cameraForward = new THREE.Vector3();
                camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraForward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDirection = new THREE.Vector3()
                    .addScaledVector(cameraRight, joystickInput.x)
                    .addScaledVector(cameraForward, -joystickInput.y)
                    .normalize();

                const inputLength = Math.min(1.0, Math.hypot(joystickInput.x, joystickInput.y));
                targetModel.position.addScaledVector(moveDirection, moveSpeed * inputLength * delta);

                const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                const targetQuaternion = new THREE.Quaternion();
                targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
                targetModel.quaternion.slerp(targetQuaternion, rotationSpeed * delta);

            } else {
                if (actions.length > 0) {
                    setAction(0);
                }
            }
        }

        // ============================================================
        // メインループ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateModelMovement(delta);

            if (mixer) {
                mixer.update(delta);
            }

            if (targetModel) {
                followModelPosition();
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
